# ============================================================
# Pangrova Standalone — Deployment Configuration Template
# This is a template, copy before editing
#
# Single-JVM dev mode: Coordinator + Worker in one process
# Main class: org.pangrova.standalone.PangrovaStandaloneMain
#
# Configuration priority (highest → lowest):
#   1. Environment variables (PANGROVA_* prefix)
#   2. CLI YAML (--config path/to/file.yml)
#   3. Classpath default YAML
#   4. ConfigOption.defaultValue()
#
# Environment variable placeholders supported:
#   ${ENV_VAR} or ${ENV_VAR:-default}
# ============================================================

# ====================================================================
# Coordinator Configuration Section
# ====================================================================

# ---- Server ----
coordinator:
  # Unique node identifier
  id: "standalone-coordinator"

  # Bind address
  host: "0.0.0.0"

  # HTTP port
  port: 8080

  # ---- High Availability ----
  ha:
    # HA not needed in standalone mode
    enabled: false

  # ---- Query ----
  query:
    # Query timeout
    # Dev mode: can be more lenient
    timeout: "5m"

    # Maximum concurrent queries
    # Dev mode: smaller value is fine
    max-concurrent: 20

  # ---- Worker Management ----
  worker:
    # Worker heartbeat timeout
    heartbeat-timeout: "30s"

    # Maximum task retry count per worker
    max-retry: 3

# ====================================================================
# Worker Configuration Section
# ====================================================================

# ---- Server ----
worker:
  # Bind address
  host: "0.0.0.0"

  # HTTP port
  port: 8081

  # Unique node identifier
  id: "standalone-worker"

  # Coordinator URL (localhost in standalone mode)
  coordinator-url: "http://localhost:8080"

  # Heartbeat interval
  heartbeat-interval: "10s"

  # ---- Transport ----
  transport:
    # Transport port (inter-worker shuffle data transfer)
    # 0 = auto-assign
    port: 0

  # ---- Task Execution ----
  task:
    # Task result retention time (seconds)
    result-retention-seconds: 300

  # ---- Shuffle ----
  shuffle:
    # Shuffle buffer capacity (number of entries)
    # Dev mode: smaller value is fine
    buffer-capacity: 50

    # Shuffle maximum memory (bytes)
    # Dev mode: 256 MB
    max-memory-bytes: 268435456   # 256 MB

    # Shuffle spill threshold (0.0-1.0)
    spill-threshold: 0.8

  # ---- Memory / Resources ----
  memory:
    # Query execution memory budget (bytes)
    # Dev mode: 256 MB
    budget-bytes: 268435456       # 256 MB

    # System reserved memory (bytes)
    system-reserved-bytes: 67108864  # 64 MB

    # Total node memory (bytes)
    # Dev mode: 512 MB
    node-bytes: 536870912         # 512 MB

  # ---- Threads ----
  threads:
    # Query execution threads
    # Dev mode: fewer threads
    query: 2

    # IO threads
    io: 2

    # Scheduler threads
    scheduler: 1

  # ---- Spill ----
  # The directory is the switch: leaving it unset disables engine-level spill.
  # Paths below are examples, not defaults — code-side defaults derive from
  # ${java.io.tmpdir}, which is NOT /tmp on macOS.
  # spill:
  #   # Spill directory
  #   directory: "/var/lib/pangrova/spill"

  # ---- Native Engine ----
  native:
    # Native library path
    # path: "/opt/pangrova/lib/libpangrova_native.so"

    # Native working directory
    # workdir: "/var/lib/pangrova/native"

    # Delete temporary files after loading
    delete-after-load: true

  # ---- Registration Retry ----
  registration:
    max-attempts: 5
    initial-backoff: "1s"
    max-backoff: "30s"

  # ---- CDC (Change Data Capture) ----
  cdc:
    enabled: true

# ====================================================================
# Shared Configuration Sections
# ====================================================================

# ---- State Store ----
# Dev mode: in-memory state store
state-store:
  type: IN_MEMORY

# ---- Metadata ----
metadata:
  enabled: true
  # Dev mode: use embedded database or omit for in-memory
  # jdbc-url: "jdbc:h2:file:./data/pangrova-metadata"
  cache:
    l1-max-size: 10000
    l1-ttl: "60s"

# ---- Feature Flags ----
governance:
  enabled: true

resilience:
  enabled: true

streaming:
  enabled: true

tenant:
  enabled: true

indexing:
  enabled: true

operations:
  enabled: true

observability:
  enabled: true
  # service-name: "pangrova-standalone"
  # otlp-endpoint: "http://localhost:4317"

security:
  enabled: false
