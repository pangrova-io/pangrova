# ============================================================
# Pangrova Worker — Configuration (Production)
#
# Configuration priority (highest → lowest):
#   1. Environment variables (PANGROVA_* prefix)
#   2. CLI flag: --config /path/to/file.yml
#   3. Classpath default YAML
#   4. ConfigOption.defaultValue()
#
# Environment variable placeholders:
#   ${ENV_VAR}           — required; startup fails if unset
#   ${ENV_VAR:-default}  — optional with fallback
#
# Memory allocation guide (128 GB node example):
#   JVM heap (-Xmx)               32 GB   (jvm-worker.config)
#   Arrow off-heap (MaxDMem)      16 GB   (jvm-worker.config)
#   Velox in-memory cache          32 GB   (worker.native.cache.memory-bytes)
#   Velox SSD cache               200 GB  (worker.native.cache.ssd-bytes)
#
# All keys below are defined in WorkerOptions (pangrova-config).
# See docs/configuration/worker.md for the full reference.
# ============================================================

# ── Node Identity ─────────────────────────────────────────────
worker:
  # Bind address — listen on all interfaces.
  host: "0.0.0.0"

  # HTTP management port (health check, metrics scrape).
  # Do NOT expose this port to end users; firewall to internal only.
  port: 8081

  # Hostname or IP address that the Coordinator and other Workers
  # use to connect back to this node. Auto-detection picks the
  # wrong address behind NAT or with multiple NICs — set explicitly.
  advertised-host: "${PANGROVA_ADVERTISED_HOST}"

  # Unique, stable identifier for this Worker node.
  # Convention: worker-<datacenter>-<rack>-<index>
  id: "${HOSTNAME:-worker-0}"

  # ── Coordinator Connection ───────────────────────────────────
  # URL of the Coordinator REST API. In HA deployments, point to
  # the load balancer VIP (Coordinator HA handles leader routing).
  coordinator-url: "${PANGROVA_COORDINATOR_URL}"

  # How often this Worker sends a heartbeat to the Coordinator.
  # Must be < Coordinator.worker.heartbeat-timeout (typically ÷ 3).
  heartbeat-interval: "10s"

  # ── Transport (inter-node data plane) ───────────────────────
  #
  # Workers exchange shuffle data (Arrow Flight) on this port.
  # Fixed ports are required for firewall rules in bare-metal
  # and VM deployments. Kubernetes uses service discovery instead.
  transport:
    port: 9090

  # ── Memory / Resources ──────────────────────────────────────
  #
  # budget-bytes: memory budget for the native execution engine.
  # This does NOT include Arrow off-heap (MaxDirectMemorySize in
  # jvm-worker.config) or native Velox cache (native.cache.*).
  memory:
    # 16 GB native engine budget for this Worker node.
    budget-bytes: 17179869184       # 16 GB

    # Total node memory pool capacity. Set to ~85% of RAM to leave
    # headroom for OS and JVM metadata.
    node-bytes: 109951162777       # ~102 GB (85% of 128 GB)

    # Reserved for system overhead.
    system-reserved-bytes: 2147483648  # 2 GB

  # ── Thread Pools ─────────────────────────────────────────────
  threads:
    # Parallel query execution threads. Set to physical CPU cores.
    # Hyper-threading rarely helps for CPU-bound vectorized scans.
    query: 32

    # Async I/O threads for remote storage reads (S3, HDFS, GCS).
    # Tune based on object store latency and per-request bandwidth.
    io: 16

    # Internal scheduler (heartbeat, spill monitor, cleanup).
    scheduler: 2

  # ── Task Execution ──────────────────────────────────────────
  task:
    # How long completed task results are kept before eviction.
    # Clients must fetch results before this window expires.
    # Increase for multi-part result streaming over slow links.
    result-retention-seconds: 600

  # ── Shuffle ──────────────────────────────────────────────────
  #
  # Shuffle buffers hold in-flight exchange data between stages.
  # Size them to hold at least 2 concurrent query exchanges.
  shuffle:
    # Must match coordinator.shuffle.mode. REMOTE writes shuffle output to the
    # external service the Coordinator names, so a dead Worker's output can be
    # re-read instead of recomputed. REMOTE requires worker.transport.tls.*
    # because the shuffle service demands mutual TLS.
    mode: "NATIVE"

    # Native Flight service spill must point at an existing writable directory.
    # This can share the node's configured spill mount when sized for both quotas.
    service:
      spill-directory: "${PANGROVA_SHUFFLE_SERVICE_SPILL_DIRECTORY:-/mnt/spill/pangrova}"

  # ── Spill ────────────────────────────────────────────────────
  #
  # Spill writes intermediate data to disk when memory pressure
  # exceeds the budget. Use a fast local NVMe mount, separate
  # from the data directory and the OS root partition.
  # Leaving the directory unset disables spill.
  spill:
    directory: "/mnt/spill/pangrova"

  # ── Internal Authentication ─────────────────────────────────
  # Shared secret for the X-Internal-Auth header between
  # Coordinator and Worker. Must be identical on all nodes.
  # Generate: openssl rand -base64 48
  internal-auth-secret: "${PANGROVA_INTERNAL_AUTH_SECRET}"

  # ── Native Engine (Velox) ────────────────────────────────────
  #
  # The native layer executes all SELECT plans via Velox.
  # The library is bundled in the distribution and loaded from
  # the classpath; you do not need to set path manually.
  native:
    # Delete the extracted native library temp file after loading.
    delete-after-load: true

    # Working directory for native library extraction and temporaries.
    # Point this at durable, sized storage. Code-side defaults derive from
    # ${java.io.tmpdir}, which is NOT /tmp on macOS, so set it explicitly.
    workdir: "/var/lib/pangrova/native"

    # ── Velox Async Data Cache ─────────────────────────────────
    #
    # The Velox cache absorbs repeated scans of hot data.
    # RAM cache sits in-process; SSD cache persists across restarts.
    # Sizing: aim for ram+ssd ≥ your "hot dataset" footprint.
    cache:
      enabled: true

      # In-process RAM cache budget.
      # Keep below (node RAM − JVM Xmx − MaxDirectMemorySize − OS headroom).
      memory-bytes: 34359738368     # 32 GB

      # SSD-backed persistent cache. Point to a fast NVMe mount.
      # The directory is created on first startup if it does not exist.
      ssd-path: "/mnt/nvme0/velox-cache"

      # Total SSD cache capacity.
      ssd-bytes: 214748364800       # 200 GB

      # Number of SSD cache shards for parallel read/write I/O.
      # Match to the number of NVMe drives or queue depth.
      ssd-shards: 16

  # ── Registration Retry ──────────────────────────────────────
  #
  # Workers retry registration if the Coordinator is temporarily
  # unavailable (leader election in progress, rolling upgrade).
  registration:
    max-attempts: 20
    initial-backoff: "1s"
    max-backoff: "60s"

  # ── CDC ──────────────────────────────────────────────────────
  cdc:
    enabled: true


# ── Observability ─────────────────────────────────────────────
observability:
  enabled: true

  # Distinguish worker spans from coordinator spans in traces.
  service-name: "pangrova-worker"

  # OTLP endpoint for the OpenTelemetry Collector.
  otlp-endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
