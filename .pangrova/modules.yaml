version: 1
status: baseline
baselineDate: "2026-10-31"
description: >
  Single source of truth for module ownership and import boundaries.
  Phase 0 registers the metadata owner artifact and the modules that must be
  migrated next; remaining leaves are added as the manifest gate lands.

modules:
  pangrova-metadata:
    family: null
    reactorRole: leaf
    layer: domain-owner
    owner: metadata
    packageRoots:
      - org.pangrova.metadata
    exports:
      - org.pangrova.metadata.api..
    friendExports: {}
    internalLayers:
      api: org.pangrova.metadata.api..
      core: org.pangrova.metadata.core..
      store: org.pangrova.metadata.store.jdbc..
    forbiddenImports:
      - org.pangrova.metadata.core..
      - org.pangrova.metadata.store..
      - org.pangrova.semantic..
      - org.pangrova.ai.control..
      - org.pangrova.ai.worker..
      - org.pangrova.ai.store..
      - org.pangrova.indexing..
      - org.pangrova.streaming..
      - org.pangrova.materialization..
      - org.pangrova.coordinator..
      - org.pangrova.worker..
    automaticModuleName: org.pangrova.metadata
    allowedDependencies:
      - pangrova-common
      - pangrova-spi
      - pangrova-security
      - pangrova-governance
    allowedImports:
      pangrova-common:
        - org.pangrova.common..
      pangrova-spi:
        - org.pangrova.spi..
      pangrova-security:
        - org.pangrova.security..
      pangrova-governance:
        - org.pangrova.governance..
    forbiddenLibraries:
      - org.apache.iceberg:iceberg-api
      - org.apache.iceberg:iceberg-core

  pangrova-semantic:
    family: null
    reactorRole: leaf
    layer: domain-owner
    owner: semantic
    packageRoots:
      - org.pangrova.semantic
    exports:
      - org.pangrova.semantic.api..
    friendExports: {}
    internalLayers:
      api: org.pangrova.semantic.api..
      store: org.pangrova.semantic.store.jdbc..
    forbiddenImports:
      - org.pangrova.metadata..
      - org.pangrova.coordinator..
      - org.pangrova.ai..
      - org.pangrova.indexing..
    automaticModuleName: org.pangrova.semantic
    allowedDependencies:
      - pangrova-common
    allowedImports:
      pangrova-common:
        - org.pangrova.common..

  pangrova-ai:
