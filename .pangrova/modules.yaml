# Module ownership and dependency policy.
#
# This file is the architectural source of truth for Java artifact boundaries.
# Facts (reactor layout, current imports, POM declarations, descriptors) live in
# .pangrova/module-baseline.yaml and are regenerated by
# .pangrova/scripts/generate-module-baseline.py. ModuleDependencyPropertyTest
# verifies this policy against the facts and refuses undeclared edges.
#
# Rules
# - allowedImports is an allow-list. Anything not listed is forbidden, even if a
#   POM dependency exists. Empty list means "no Pangrova dependencies".
# - forbiddenImports documents red lines; it must never intersect
#   allowedImports or a declared friend export.
# - exports narrow which package subtrees other modules may import. Importing a
#   package outside exports is a violation even when the artifact edge is allowed.
# - friendExports restricts one artifact edge to specific packages
#   (only where an explicitly documented integration boundary requires it).
# - baselineViolations records debt with an owning milestone. A violation must
#   currently exist and must not also be allowed; it is deleted in its milestone.
# - testSurface artifacts are cross-cutting test infrastructure; their production
#   imports are still checked, but the artifact allow-list does not apply.
version: 1

artifacts:
