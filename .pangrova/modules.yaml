      - org.pangrova.coordinator..
      - org.pangrova.indexing..
      - org.pangrova.streaming..
      - org.pangrova.materialization..
    automaticModuleName: org.pangrova.ai
    allowedDependencies:
      - pangrova-common
      - pangrova-semantic
    allowedImports:
      pangrova-common:
        - org.pangrova.common..
