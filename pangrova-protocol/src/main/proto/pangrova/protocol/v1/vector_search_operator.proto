syntax = "proto3";
package pangrova.protocol.v1;
option java_package = "org.pangrova.protocol.v1";
option java_multiple_files = true;

import "pangrova/protocol/v1/vector_value.proto";

// Substrait custom extension operator for vector ANN search.
// Embedded in a Substrait plan as a custom RelNode, enabling vector
// search to flow through the standard DAG pipeline alongside scalar
// operators.
//
// The coordinator's CompilationPhase converts a VectorSearchNode
// (from VectorSearchRewriter) into this proto. Workers deserialize
// it and delegate to VectorSearchExecutor.
message VectorSearchOperator {
    // Fully qualified table name (catalog.schema.table).
    string table_name = 1;

    // Name of the vector column to search.
    string vector_column = 2;

    // Query embedding vector.
    VectorValue query_vector = 3;

    // Number of nearest neighbors to return per worker.
    int32 top_k = 4;

    // Distance metric (L2, COSINE, INNER_PRODUCT).
    string distance_metric = 5;

    // Vector index identifier for the target column.
    string index_id = 6;

    // Algorithm-specific search parameters (efSearch, nprobe, etc.).
    map<string, string> search_params = 7;

    // Scalar filter predicates to apply before ANN search (optional).
    // Encoded as serialized Substrait expressions.
    repeated bytes filter_expressions = 8;

    // Filtered search strategy for combining ANN search with predicates.
    // Values: POST_FILTER, PRE_FILTER, PREDICATE_AWARE, ITERATIVE_SCAN.
    // Empty string or unset defaults to POST_FILTER.
    string filter_strategy = 9;
}
