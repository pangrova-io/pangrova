<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="1102" viewBox="0 0 1158 1102" role="img">
<rect width="1158" height="1102" rx="14" fill="#FFFFFF"/>
<rect x="0.75" y="0.75" width="1156.5" height="1100.5" rx="14" fill="none" stroke="#E2E8F0"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
<text x="34.0" y="47.7" fill="#1F2937" xml:space="preserve"># metadata-config.yaml</text>
<text x="34.0" y="66.7" fill="#1F2937" xml:space="preserve">metadata:</text>
<text x="34.0" y="85.7" fill="#1F2937" xml:space="preserve">  enabled: true</text>
<text x="34.0" y="104.7" fill="#1F2937" xml:space="preserve">  jdbc-url: jdbc:postgresql://localhost:5432/pangrova_meta</text>
<text x="34.0" y="123.7" fill="#1F2937" xml:space="preserve">  jdbc-username: ${METASTORE_USER}</text>
<text x="34.0" y="142.7" fill="#1F2937" xml:space="preserve">  jdbc-password: ${METASTORE_PASSWORD}</text>
<line x1="71.6" y1="176.5" x2="81.0" y2="176.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="81.0" y1="176.5" x2="90.4" y2="176.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="240.8" y1="176.5" x2="250.2" y2="176.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="250.2" y1="176.5" x2="259.6" y2="176.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<text x="34.0" y="180.7" fill="#1F2937" xml:space="preserve">  #    Metadata cache</text>
<text x="34.0" y="199.7" fill="#1F2937" xml:space="preserve">  cache:</text>
<text x="34.0" y="218.7" fill="#1F2937" xml:space="preserve">    l1-max-size: 10000</text>
<text x="34.0" y="237.7" fill="#1F2937" xml:space="preserve">    l1-ttl: 60s</text>
<text x="34.0" y="256.7" fill="#1F2937" xml:space="preserve">    l2:</text>
<text x="34.0" y="275.7" fill="#1F2937" xml:space="preserve">      provider: redis</text>
<text x="34.0" y="294.7" fill="#1F2937" xml:space="preserve">      properties:</text>
<text x="34.0" y="313.7" fill="#1F2937" xml:space="preserve">        url: redis://redis:6379</text>
<text x="34.0" y="332.7" fill="#1F2937" xml:space="preserve">        namespace: production-a</text>
<line x1="71.6" y1="366.5" x2="81.0" y2="366.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="81.0" y1="366.5" x2="90.4" y2="366.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="231.4" y1="366.5" x2="240.8" y2="366.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="240.8" y1="366.5" x2="250.2" y2="366.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<text x="34.0" y="370.7" fill="#1F2937" xml:space="preserve">  #    Metadata sync</text>
<text x="34.0" y="389.7" fill="#1F2937" xml:space="preserve">  sync:</text>
<text x="34.0" y="408.7" fill="#1F2937" xml:space="preserve">    enabled: true</text>
<text x="34.0" y="427.7" fill="#1F2937" xml:space="preserve">    interval-seconds: 60                           # incremental sync interval</text>
<text x="34.0" y="446.7" fill="#1F2937" xml:space="preserve">    retry-max-attempts: 3</text>
<text x="34.0" y="465.7" fill="#1F2937" xml:space="preserve">    retry-backoff-ms: 1000                         # exponential backoff base</text>
<text x="34.0" y="484.7" fill="#1F2937" xml:space="preserve">    full-sync-on-register: true                    # automatically full-sync when registering a new Catalog</text>
<line x1="71.6" y1="518.5" x2="81.0" y2="518.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="81.0" y1="518.5" x2="90.4" y2="518.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="306.6" y1="518.5" x2="316.0" y2="518.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="316.0" y1="518.5" x2="325.4" y2="518.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<text x="34.0" y="522.7" fill="#1F2937" xml:space="preserve">  #    Catalog health checks</text>
<text x="34.0" y="541.7" fill="#1F2937" xml:space="preserve">  health:</text>
<text x="34.0" y="560.7" fill="#1F2937" xml:space="preserve">    check-interval-seconds: 30</text>
<text x="34.0" y="579.7" fill="#1F2937" xml:space="preserve">    degraded-threshold: 3                          # consecutive failure count triggers DEGRADED</text>
<line x1="71.6" y1="613.5" x2="81.0" y2="613.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="81.0" y1="613.5" x2="90.4" y2="613.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="259.6" y1="613.5" x2="269.0" y2="613.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="269.0" y1="613.5" x2="278.4" y2="613.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<text x="34.0" y="617.7" fill="#1F2937" xml:space="preserve">  #    Schema Evolution</text>
<text x="34.0" y="636.7" fill="#1F2937" xml:space="preserve">  schema-evolution:</text>
<text x="34.0" y="655.7" fill="#1F2937" xml:space="preserve">    compatibility-check: true                      # enable compatibility checks</text>
<text x="34.0" y="674.7" fill="#1F2937" xml:space="preserve">    allow-incompatible-changes: false              # whether to allow incompatible changes (forbidden in production)</text>
<line x1="71.6" y1="708.5" x2="81.0" y2="708.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="81.0" y1="708.5" x2="90.4" y2="708.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="588.6" y1="708.5" x2="598.0" y2="708.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<line x1="598.0" y1="708.5" x2="607.4" y2="708.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>
<text x="34.0" y="712.7" fill="#1F2937" xml:space="preserve">  #    Federation Catalog registration (loaded at startup)</text>
<text x="34.0" y="731.7" fill="#1F2937" xml:space="preserve">  catalogs:</text>
<text x="34.0" y="750.7" fill="#1F2937" xml:space="preserve">    iceberg_prod:</text>
<text x="34.0" y="769.7" fill="#1F2937" xml:space="preserve">      type: connector</text>
<text x="34.0" y="788.7" fill="#1F2937" xml:space="preserve">      provider: iceberg</text>
<text x="34.0" y="807.7" fill="#1F2937" xml:space="preserve">      properties:</text>
<text x="34.0" y="826.7" fill="#1F2937" xml:space="preserve">        uri: http://iceberg-rest:8181</text>
<text x="34.0" y="845.7" fill="#1F2937" xml:space="preserve">        warehouse: s3://data-lake/warehouse</text>
<text x="34.0" y="864.7" fill="#1F2937" xml:space="preserve">    hive_federation:</text>
<text x="34.0" y="883.7" fill="#1F2937" xml:space="preserve">      type: federation</text>
<text x="34.0" y="902.7" fill="#1F2937" xml:space="preserve">      provider: hms</text>
<text x="34.0" y="921.7" fill="#1F2937" xml:space="preserve">      properties:</text>
<text x="34.0" y="940.7" fill="#1F2937" xml:space="preserve">        uri: thrift://hive-metastore:9083</text>
<text x="34.0" y="959.7" fill="#1F2937" xml:space="preserve">    glue_analytics:</text>
<text x="34.0" y="978.7" fill="#1F2937" xml:space="preserve">      type: federation</text>
<text x="34.0" y="997.7" fill="#1F2937" xml:space="preserve">      provider: glue</text>
<text x="34.0" y="1016.7" fill="#1F2937" xml:space="preserve">      properties:</text>
<text x="34.0" y="1035.7" fill="#1F2937" xml:space="preserve">        region: us-east-1</text>
<text x="34.0" y="1054.7" fill="#1F2937" xml:space="preserve">        catalog-id: '123456789012'</text>
</g>
</svg>
