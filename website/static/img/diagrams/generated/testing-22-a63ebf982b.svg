<text x="34.0" y="47.7" fill="#1F2937" xml:space="preserve">Goal: verify the complete data flow SQL   Calcite   Substrait   Native Velox   Arrow Flight   Client</text>
<text x="34.0" y="85.7" fill="#1F2937" xml:space="preserve">Preconditions:</text>
<text x="34.0" y="104.7" fill="#1F2937" xml:space="preserve">  - 1 Coordinator + 1 Worker</text>
<text x="34.0" y="123.7" fill="#1F2937" xml:space="preserve">  - Iceberg table (Parquet, 100K rows)</text>
<text x="34.0" y="161.7" fill="#1F2937" xml:space="preserve">Test steps:</text>
<text x="34.0" y="180.7" fill="#1F2937" xml:space="preserve">  1. Client submits SELECT * FROM iceberg.db.orders WHERE amount &gt; 100 LIMIT 10</text>
