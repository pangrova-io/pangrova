<text x="34.0" y="218.7" fill="#1F2937" xml:space="preserve">  3. Worker: JNI   Velox Scan   Filter   Project   Arrow C Data   Flight   Client</text>
<text x="34.0" y="237.7" fill="#1F2937" xml:space="preserve">  4. Client verifies result row count ≤ 10, all amount &gt; 100</text>
<text x="34.0" y="275.7" fill="#1F2937" xml:space="preserve">Verification points:</text>
<text x="34.0" y="294.7" fill="#1F2937" xml:space="preserve">  - [02] Substrait Plan is serialized/deserialized correctly</text>
<text x="34.0" y="313.7" fill="#1F2937" xml:space="preserve">  - [03] Native Parquet Reader reads correctly + filter pushdown</text>
<text x="34.0" y="332.7" fill="#1F2937" xml:space="preserve">  - [04] ConnectorSplitManager generates correct Splits</text>
<text x="34.0" y="351.7" fill="#1F2937" xml:space="preserve">  - [07] CatalogRegistry resolves table metadata correctly</text>
<text x="34.0" y="389.7" fill="#1F2937" xml:space="preserve">Pass criteria:</text>
<text x="34.0" y="408.7" fill="#1F2937" xml:space="preserve">  - Results match the DuckDB reference implementation</text>
<text x="34.0" y="427.7" fill="#1F2937" xml:space="preserve">  - No memory leaks (Native ASAN clean)</text>
