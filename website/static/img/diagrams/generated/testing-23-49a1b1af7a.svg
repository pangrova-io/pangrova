<svg xmlns="http://www.w3.org/2000/svg" width="857" height="589" viewBox="0 0 857 589" role="img">
<rect width="857" height="589" rx="14" fill="#FFFFFF"/>
<rect x="0.75" y="0.75" width="855.5" height="587.5" rx="14" fill="none" stroke="#E2E8F0"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
<text x="34.0" y="47.7" fill="#1F2937" xml:space="preserve">Goal: verify Shuffle data exchange between multiple Workers and HashJoin correctness</text>
<text x="34.0" y="85.7" fill="#1F2937" xml:space="preserve">Preconditions:</text>
<text x="34.0" y="104.7" fill="#1F2937" xml:space="preserve">  - 1 Coordinator + 3 Workers</text>
<text x="34.0" y="123.7" fill="#1F2937" xml:space="preserve">  - Iceberg tables: orders (1M rows), customers (100K rows)</text>
<text x="34.0" y="161.7" fill="#1F2937" xml:space="preserve">Test steps:</text>
<text x="34.0" y="180.7" fill="#1F2937" xml:space="preserve">  1. Client submits:</text>
<text x="34.0" y="199.7" fill="#1F2937" xml:space="preserve">     SELECT c.name, SUM(o.amount)</text>
<text x="34.0" y="218.7" fill="#1F2937" xml:space="preserve">     FROM orders o JOIN customers c ON o.customer_id = c.id</text>
<text x="34.0" y="237.7" fill="#1F2937" xml:space="preserve">     GROUP BY c.name</text>
<text x="34.0" y="256.7" fill="#1F2937" xml:space="preserve">  2. Coordinator builds a 3-Stage DAG:</text>
<path d="M277.59999999999997 266.0 L277.59999999999997 277.0 L288.59999999999997 271.5 z" fill="#D97706"/>
<path d="M409.2 266.0 L409.2 277.0 L420.2 271.5 z" fill="#D97706"/>
<text x="34.0" y="275.7" fill="#1F2937" xml:space="preserve">     Stage 2: Scan orders   Partial Agg   Exchange(REPARTITION)</text>
<path d="M305.8 285.0 L305.8 296.0 L316.8 290.5 z" fill="#D97706"/>
<text x="34.0" y="294.7" fill="#1F2937" xml:space="preserve">     Stage 1: Scan customers   Exchange(REPARTITION)</text>
<path d="M249.4 304.0 L249.4 315.0 L260.4 309.5 z" fill="#D97706"/>
<path d="M362.2 304.0 L362.2 315.0 L373.2 309.5 z" fill="#D97706"/>
<text x="34.0" y="313.7" fill="#1F2937" xml:space="preserve">     Stage 0: HashJoin   Final Agg   Output</text>
<text x="34.0" y="332.7" fill="#1F2937" xml:space="preserve">  3. Workers perform Shuffle (Arrow Flight)</text>
<text x="34.0" y="351.7" fill="#1F2937" xml:space="preserve">  4. Output Worker aggregates results and returns them to the Client</text>
<text x="34.0" y="389.7" fill="#1F2937" xml:space="preserve">Verification points:</text>
<text x="34.0" y="408.7" fill="#1F2937" xml:space="preserve">  - [02] Stage DAG is partitioned correctly, Exchange types are correct</text>
<text x="34.0" y="427.7" fill="#1F2937" xml:space="preserve">  - [01] Shuffle data is transferred correctly via Arrow Flight</text>
<text x="34.0" y="446.7" fill="#1F2937" xml:space="preserve">  - [06] Memory is fairly allocated across Tasks</text>
<text x="34.0" y="465.7" fill="#1F2937" xml:space="preserve">  - [03] Native HashJoin + Agg results are correct</text>
<text x="34.0" y="503.7" fill="#1F2937" xml:space="preserve">Pass criteria:</text>
<text x="34.0" y="522.7" fill="#1F2937" xml:space="preserve">  - Results match the DuckDB reference implementation</text>
<text x="34.0" y="541.7" fill="#1F2937" xml:space="preserve">  - No Shuffle data loss or duplication</text>
</g>
</svg>
