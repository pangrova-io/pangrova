<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
<text x="34.0" y="47.7" fill="#1F2937" xml:space="preserve">/**</text>
<text x="34.0" y="66.7" fill="#1F2937" xml:space="preserve"> * ConnectorSession — SPI-level session passed to all Connector methods.</text>
<text x="34.0" y="85.7" fill="#1F2937" xml:space="preserve"> * Authoritative field definition (see also connectors.md §1.2).</text>
<text x="34.0" y="104.7" fill="#1F2937" xml:space="preserve"> */</text>
<text x="34.0" y="123.7" fill="#1F2937" xml:space="preserve">public interface ConnectorSession {</text>
<text x="34.0" y="142.7" fill="#1F2937" xml:space="preserve">    String getIdentity();              // authenticated user principal</text>
<text x="34.0" y="161.7" fill="#1F2937" xml:space="preserve">    String getCatalogName();           // catalog this session is scoped to</text>
<text x="34.0" y="180.7" fill="#1F2937" xml:space="preserve">    Optional&lt;String&gt; getSchema();      // current default schema (if set)</text>
<text x="34.0" y="199.7" fill="#1F2937" xml:space="preserve">    String getTimeZone();              // session timezone (IANA format)</text>
<text x="34.0" y="218.7" fill="#1F2937" xml:space="preserve">    Locale getLocale();                // session locale</text>
<text x="34.0" y="237.7" fill="#1F2937" xml:space="preserve">    Map&lt;String, String&gt; getProperties(); // connector-specific session properties</text>
<text x="34.0" y="256.7" fill="#1F2937" xml:space="preserve">}</text>
<text x="34.0" y="294.7" fill="#1F2937" xml:space="preserve">/**</text>
<text x="34.0" y="313.7" fill="#1F2937" xml:space="preserve"> * SessionContext.toConnectorSession() — field mapping:</text>
<text x="34.0" y="332.7" fill="#1F2937" xml:space="preserve"> *</text>
