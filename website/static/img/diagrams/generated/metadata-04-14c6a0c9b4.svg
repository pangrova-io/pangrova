<text x="34.0" y="370.7" fill="#1F2937" xml:space="preserve"> *</text>
<path d="M334.0 380.0 L334.0 391.0 L345.0 385.5 z" fill="#D97706"/>
<text x="34.0" y="389.7" fill="#1F2937" xml:space="preserve"> *   identity.getUser()           getIdentity()</text>
<path d="M334.0 399.0 L334.0 410.0 L345.0 404.5 z" fill="#D97706"/>
<text x="34.0" y="408.7" fill="#1F2937" xml:space="preserve"> *   currentCatalog               getCatalogName()</text>
<path d="M334.0 418.0 L334.0 429.0 L345.0 423.5 z" fill="#D97706"/>
<text x="34.0" y="427.7" fill="#1F2937" xml:space="preserve"> *   currentSchema                getSchema()</text>
<path d="M362.2 437.0 L362.2 448.0 L373.2 442.5 z" fill="#D97706"/>
<text x="34.0" y="446.7" fill="#1F2937" xml:space="preserve"> *   sessionProperties["timezone"]   getTimeZone()</text>
<path d="M362.2 456.0 L362.2 467.0 L373.2 461.5 z" fill="#D97706"/>
<text x="34.0" y="465.7" fill="#1F2937" xml:space="preserve"> *   sessionProperties["locale"]     getLocale()</text>
<path d="M362.2 475.0 L362.2 486.0 L373.2 480.5 z" fill="#D97706"/>
<text x="34.0" y="484.7" fill="#1F2937" xml:space="preserve"> *   connectorProperties(catalog)    getProperties()</text>
<text x="34.0" y="503.7" fill="#1F2937" xml:space="preserve"> *</text>
<text x="34.0" y="522.7" fill="#1F2937" xml:space="preserve"> * Fields NOT propagated (filtered for SPI isolation):</text>
<text x="34.0" y="541.7" fill="#1F2937" xml:space="preserve"> *   - tenantId        (tenant context is enforced at MetadataService level, not leaked to connectors)</text>
<text x="34.0" y="560.7" fill="#1F2937" xml:space="preserve"> *   - securityToken   (connectors use their own auth; engine token is not forwarded)</text>
<text x="34.0" y="579.7" fill="#1F2937" xml:space="preserve"> *   - queryId         (not relevant to connector operations)</text>
<text x="34.0" y="598.7" fill="#1F2937" xml:space="preserve"> *   - transactionId   (managed by ConnectorTransactionHandle, not session)</text>
<text x="34.0" y="617.7" fill="#1F2937" xml:space="preserve"> */</text>
<text x="34.0" y="636.7" fill="#1F2937" xml:space="preserve">public ConnectorSession toConnectorSession() {</text>
<text x="34.0" y="655.7" fill="#1F2937" xml:space="preserve">    return new ConnectorSessionImpl(</text>
<text x="34.0" y="674.7" fill="#1F2937" xml:space="preserve">        this.identity.getUser(),</text>
<text x="34.0" y="693.7" fill="#1F2937" xml:space="preserve">        this.currentCatalog,</text>
<text x="34.0" y="712.7" fill="#1F2937" xml:space="preserve">        Optional.ofNullable(this.currentSchema),</text>
<text x="34.0" y="731.7" fill="#1F2937" xml:space="preserve">        this.getProperty("timezone", ZoneId.systemDefault().getId()),</text>
<text x="34.0" y="750.7" fill="#1F2937" xml:space="preserve">        this.getProperty("locale", Locale.getDefault()),</text>
<text x="34.0" y="769.7" fill="#1F2937" xml:space="preserve">        this.getConnectorProperties(this.currentCatalog));</text>
<text x="34.0" y="788.7" fill="#1F2937" xml:space="preserve">}</text>
</g>
</svg>
