<path d="M277.59999999999997 228.0 L277.59999999999997 239.0 L288.59999999999997 233.5 z" fill="#D97706"/>
<path d="M371.6 228.0 L371.6 239.0 L382.6 233.5 z" fill="#D97706"/>
<path d="M465.6 228.0 L465.6 239.0 L476.6 233.5 z" fill="#D97706"/>
<text x="34.0" y="237.7" fill="#1F2937" xml:space="preserve">Scheduling order: Stage 3   Stage 2   Stage 1   Stage 0</text>
<text x="34.0" y="275.7" fill="#1F2937" xml:space="preserve">Rules:</text>
<text x="34.0" y="294.7" fill="#1F2937" xml:space="preserve">1. Leaf Stages (no upstream dependency) can be scheduled in parallel</text>
<text x="34.0" y="313.7" fill="#1F2937" xml:space="preserve">2. Intermediate Stages are scheduled after all tasks of their upstream Stages are scheduled</text>
<text x="34.0" y="332.7" fill="#1F2937" xml:space="preserve">3. The Output Stage (Stage 0) is scheduled last</text>
<text x="34.0" y="351.7" fill="#1F2937" xml:space="preserve">4. Scheduling = dispatching TaskDescriptor to Workers, without waiting for task execution to finish</text>
