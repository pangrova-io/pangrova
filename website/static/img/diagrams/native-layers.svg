<rect x="610" y="195" width="230" height="86" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="610" y="195" width="5" height="86" rx="2.5" fill="#7C3AED"/>
<text x="630" y="223" font-size="16.5" font-weight="700" fill="#111827">Substrait</text>
<text x="630" y="247" font-size="13.5" fill="#64748B">canonical plan</text>
<line x1="840" y1="238" x2="870" y2="238" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
