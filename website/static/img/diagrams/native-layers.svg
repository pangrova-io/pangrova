<text x="110" y="547" font-size="13.5" fill="#64748B">DataSource factory</text>
<text x="110" y="568" font-size="13.5" fill="#64748B">DataSource reader</text>
<text x="110" y="589" font-size="13.5" fill="#64748B">Native writer · spiller</text>
