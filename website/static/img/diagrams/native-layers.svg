<text x="610.0" y="824.0" font-size="14" font-weight="600" fill="#7C3AED">JNI status / terminal report</text>
<line x1="60" y1="890" x2="100" y2="890" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="895" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="890" x2="280" y2="890" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="895" font-size="12.5" fill="#64748B">data plane</text>
