<rect x="90" y="645" width="5" height="90" rx="2.5" fill="#D97706"/>
<text x="110" y="673" font-size="16.5" font-weight="700" fill="#111827">Result and exchange</text>
<text x="110" y="697" font-size="13.5" fill="#64748B">Native Flight shuffle · Arrow Flight result stream</text>
<text x="110" y="718" font-size="13.5" fill="#64748B">Canonical lifecycle and error reports return to the Worker JVM</text>
