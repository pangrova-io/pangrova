<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d">
<title id="t">Planning and execution stack</title>
<desc id="d">SQL is parsed, planned with Calcite, serialized as Substrait, and executed by Velox.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="860" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">Planning and execution stack</text>
<text x="60" y="106" font-size="17" fill="#64748B">One canonical plan crosses the Java/Native boundary.</text>
<rect x="180" y="150" width="840" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="150" width="7" height="92" rx="3.5" fill="#2563EB"/>
<text x="210" y="186" font-size="24" font-weight="700" fill="#111827">SQL and API</text>
<text x="210" y="216" font-size="16.5" fill="#475569">JDBC · REST API · CLI</text>
<line x1="600.0" y1="242" x2="600.0" y2="282" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="180" y="282" width="840" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="282" width="7" height="92" rx="3.5" fill="#7C3AED"/>
<text x="210" y="318" font-size="24" font-weight="700" fill="#111827">ANTLR parser</text>
<text x="210" y="348" font-size="16.5" fill="#475569">Custom SQL extensions · statement classification · partial diagnostics</text>
<line x1="600.0" y1="374" x2="600.0" y2="414" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="180" y="414" width="840" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="414" width="7" height="92" rx="3.5" fill="#7C3AED"/>
<text x="210" y="450" font-size="24" font-weight="700" fill="#111827">Calcite optimizer</text>
<text x="210" y="480" font-size="16.5" fill="#475569">Rule- and cost-based transformations · statistics · type validation</text>
<line x1="600.0" y1="506" x2="600.0" y2="546" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="180" y="546" width="840" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="546" width="7" height="92" rx="3.5" fill="#0D9488"/>
<text x="210" y="582" font-size="24" font-weight="700" fill="#111827">Substrait plan</text>
<text x="210" y="612" font-size="16.5" fill="#475569">Canonical cross-language plan · explicit version stamping</text>
<line x1="600.0" y1="638" x2="600.0" y2="678" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="180" y="678" width="840" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="678" width="7" height="92" rx="3.5" fill="#D97706"/>
<text x="210" y="714" font-size="24" font-weight="700" fill="#111827">Velox engine</text>
<text x="210" y="744" font-size="16.5" fill="#475569">C++20 vectorized operators · Arrow batches · Native result stream</text>
<line x1="60" y1="820" x2="100" y2="820" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="825" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="820" x2="280" y2="820" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="825" font-size="12.5" fill="#64748B">data plane</text>
</g>
</svg>
