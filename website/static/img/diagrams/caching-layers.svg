<text x="420" y="352" font-size="13.5" fill="#64748B">Memory or Redis</text>
<text x="420" y="373" font-size="13.5" fill="#64748B">Generation-checked fill</text>
<text x="420" y="394" font-size="13.5" fill="#64748B">Invalidation by group and entry</text>
