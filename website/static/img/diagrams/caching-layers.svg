<text x="300" y="818" font-size="16.5" font-weight="700" fill="#111827">Remote object storage</text>
<text x="300" y="842" font-size="13.5" fill="#64748B">S3 · OSS · HDFS — the source of truth</text>
<line x1="600" y1="740" x2="600" y2="790" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
