<text x="110" y="352" font-size="13.5" fill="#64748B">Caffeine · on-heap</text>
<text x="110" y="373" font-size="13.5" fill="#64748B">10k entries · 60s TTL</text>
<text x="110" y="394" font-size="13.5" fill="#64748B">Per-process</text>
