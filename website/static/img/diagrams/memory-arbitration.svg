<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="t d">
<title id="t">Memory arbitration</title>
<desc id="d">Node pools, task budgets, shuffle and cache reservations, and spilling.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="980" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">Memory arbitration</text>
<text x="60" y="106" font-size="17" fill="#64748B">Every allocation is admitted against the process budget; pressure triggers spill or rejection.</text>
<rect x="80" y="140" width="1040" height="76" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="80" y="140" width="5" height="76" rx="2.5" fill="#2563EB"/>
<text x="100" y="168" font-size="16.5" font-weight="700" fill="#111827">Worker process</text>
<text x="100" y="192" font-size="13.5" fill="#64748B">One NodePool and one MemoryArbitrator per Worker JVM</text>
<rect x="60" y="250" width="1080" height="230" rx="18" fill="#FBFBFE" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="282" font-size="19" font-weight="700" fill="#7C3AED">RESERVATIONS</text>
<rect x="90" y="300" width="320" height="150" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="300" width="5" height="150" rx="2.5" fill="#7C3AED"/>
<text x="110" y="328" font-size="16.5" font-weight="700" fill="#111827">Task execution</text>
<text x="110" y="352" font-size="13.5" fill="#64748B">Per-attempt native budget</text>
<text x="110" y="373" font-size="13.5" fill="#64748B">Operator and spill accounting</text>
<rect x="440" y="300" width="320" height="150" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="440" y="300" width="5" height="150" rx="2.5" fill="#D97706"/>
<text x="460" y="328" font-size="16.5" font-weight="700" fill="#111827">Shuffle and exchange</text>
<text x="460" y="352" font-size="13.5" fill="#64748B">In-memory batches</text>
<text x="460" y="373" font-size="13.5" fill="#64748B">Disk service reservations</text>
<rect x="790" y="300" width="310" height="150" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="790" y="300" width="5" height="150" rx="2.5" fill="#0D9488"/>
<text x="810" y="328" font-size="16.5" font-weight="700" fill="#111827">Native cache</text>
<text x="810" y="352" font-size="13.5" fill="#64748B">RAM / SSD cache budget</text>
<text x="810" y="373" font-size="13.5" fill="#64748B">Worker-local eviction</text>
<line x1="600" y1="480" x2="600" y2="520" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="60" y="520" width="1080" height="210" rx="18" fill="#FFFCF5" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="552" font-size="19" font-weight="700" fill="#D97706">PRESSURE RESPONSE</text>
<rect x="90" y="575" width="320" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="575" width="5" height="120" rx="2.5" fill="#7C3AED"/>
<text x="110" y="603" font-size="16.5" font-weight="700" fill="#111827">Admission</text>
<text x="110" y="627" font-size="13.5" fill="#64748B">Reject over-budget tasks</text>
<text x="110" y="648" font-size="13.5" fill="#64748B">Respect tenant quotas</text>
<rect x="440" y="575" width="320" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="440" y="575" width="5" height="120" rx="2.5" fill="#D97706"/>
<text x="460" y="603" font-size="16.5" font-weight="700" fill="#111827">Spill</text>
<text x="460" y="627" font-size="13.5" fill="#64748B">Task spill directory</text>
<text x="460" y="648" font-size="13.5" fill="#64748B">Language-specific file ownership</text>
<rect x="790" y="575" width="310" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="790" y="575" width="5" height="120" rx="2.5" fill="#D97706"/>
<text x="810" y="603" font-size="16.5" font-weight="700" fill="#111827">Backpressure</text>
<text x="810" y="627" font-size="13.5" fill="#64748B">Bounded queues</text>
<text x="810" y="648" font-size="13.5" fill="#64748B">Cancellation and drain</text>
<rect x="80" y="790" width="1040" height="90" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="80" y="790" width="5" height="90" rx="2.5" fill="#0D9488"/>
<text x="100" y="818" font-size="16.5" font-weight="700" fill="#111827">NativeMemoryGovernor and allocator</text>
<text x="100" y="842" font-size="13.5" fill="#64748B">C++ allocation paths report through the governor; the JVM does not infer native usage</text>
<line x1="600" y1="730" x2="600" y2="790" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="600" y="930" font-size="14" fill="#64748B" text-anchor="middle">A second accounting layer must not be introduced merely to explain memory; the owning allocator remains authoritative.</text>
<line x1="60" y1="960" x2="100" y2="960" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="965" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="960" x2="280" y2="960" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="965" font-size="12.5" fill="#64748B">data plane</text>
</g>
</svg>
