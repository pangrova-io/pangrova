<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="t d">
<title id="t">End-to-end query execution</title>
<desc id="d">Client submission, Coordinator planning, Native execution, and result delivery.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="1260" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">End-to-end query execution</text>
<text x="60" y="106" font-size="17" fill="#64748B">The Coordinator plans and fences; Workers execute; one Output Worker streams results.</text>
<rect x="60" y="140" width="1080" height="260" rx="18" fill="#FBFBFE" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="172" font-size="19" font-weight="700" fill="#7C3AED">COORDINATOR — JAVA</text>
<rect x="90" y="195" width="320" height="92" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="195" width="5" height="92" rx="2.5" fill="#7C3AED"/>
<text x="110" y="223" font-size="16.5" font-weight="700" fill="#111827">Parse · bind</text>
<text x="110" y="247" font-size="13.5" fill="#64748B">ANTLR · session resolution</text>
<text x="110" y="268" font-size="13.5" fill="#64748B">authorize</text>
<line x1="410" y1="241" x2="440" y2="241" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="440" y="195" width="320" height="92" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="440" y="195" width="5" height="92" rx="2.5" fill="#7C3AED"/>
<text x="460" y="223" font-size="16.5" font-weight="700" fill="#111827">Plan</text>
<text x="460" y="247" font-size="13.5" fill="#64748B">Calcite · statistics</text>
<text x="460" y="268" font-size="13.5" fill="#64748B">Substrait</text>
<line x1="760" y1="241" x2="790" y2="241" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="790" y="195" width="320" height="92" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="790" y="195" width="5" height="92" rx="2.5" fill="#7C3AED"/>
<text x="810" y="223" font-size="16.5" font-weight="700" fill="#111827">Admit · schedule</text>
<text x="810" y="247" font-size="13.5" fill="#64748B">resource and tenant limits</text>
<text x="810" y="268" font-size="13.5" fill="#64748B">stage DAG</text>
<rect x="90" y="305" width="1020" height="64" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="305" width="5" height="64" rx="2.5" fill="#0D9488"/>
<text x="110" y="333" font-size="16.5" font-weight="700" fill="#111827">Query state · admission · worker placement · leases · final catalog commit</text>
<line x1="600" y1="400" x2="600" y2="450" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="429.0" font-size="14" font-weight="600" fill="#7C3AED">TaskRequest v2 + Substrait + execution bindings</text>
<rect x="60" y="450" width="1080" height="400" rx="18" fill="#FFFCF5" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="482" font-size="19" font-weight="700" fill="#D97706">WORKER — JAVA + NATIVE</text>
<rect x="90" y="505" width="470" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="505" width="5" height="120" rx="2.5" fill="#0D9488"/>
<text x="110" y="533" font-size="16.5" font-weight="700" fill="#111827">Worker JVM</text>
<text x="110" y="557" font-size="13.5" fill="#64748B">task lifecycle · admission</text>
<text x="110" y="578" font-size="13.5" fill="#64748B">JNI bridge · connector callbacks</text>
<text x="110" y="599" font-size="13.5" fill="#64748B">status and terminal reports</text>
<rect x="650" y="505" width="460" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="650" y="505" width="5" height="120" rx="2.5" fill="#D97706"/>
<text x="670" y="533" font-size="16.5" font-weight="700" fill="#111827">Native Worker — C++ / Velox</text>
<text x="670" y="557" font-size="13.5" fill="#64748B">scan · filter · project</text>
<text x="670" y="578" font-size="13.5" fill="#64748B">join · aggregate · shuffle</text>
<text x="670" y="599" font-size="13.5" fill="#64748B">retrieval · write · output</text>
<line x1="560" y1="565" x2="650" y2="565" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrowAmber)"/>
<text x="605" y="553" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">JNI</text>
<rect x="90" y="660" width="1020" height="130" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="660" width="5" height="130" rx="2.5" fill="#D97706"/>
<text x="110" y="688" font-size="16.5" font-weight="700" fill="#111827">Execution and exchange</text>
<text x="110" y="712" font-size="13.5" fill="#64748B">Workers exchange Arrow Flight batches inside a stage</text>
<text x="110" y="733" font-size="13.5" fill="#64748B">The Output Worker streams the result to the client over Arrow Flight</text>
<text x="110" y="754" font-size="13.5" fill="#64748B">Write attempts return commit fragments to the Coordinator</text>
<line x1="600" y1="850" x2="600" y2="900" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="180" y="900" width="840" height="84" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="900" width="7" height="84" rx="3.5" fill="#D97706"/>
<text x="210" y="936" font-size="24" font-weight="700" fill="#111827">Client result stream</text>
<text x="210" y="966" font-size="16.5" fill="#475569">Arrow Flight batches from the Output Worker; cancellation and status use HTTP</text>
<polyline points="1140,330 1180,330 1180,1052 1020,1052" fill="none" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1170" y="700" font-size="13" font-weight="600" fill="#7C3AED" text-anchor="middle" transform="rotate(-90 1170 700)">status / terminal</text>
<rect x="180" y="1010" width="840" height="84" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="1010" width="7" height="84" rx="3.5" fill="#7C3AED"/>
<text x="210" y="1046" font-size="24" font-weight="700" fill="#111827">Coordinator terminal handling</text>
<text x="210" y="1076" font-size="16.5" fill="#475569">Validates terminal reports and publishes the final fenced catalog commit for writes</text>
<line x1="60" y1="1215" x2="100" y2="1215" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="1220" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="1215" x2="280" y2="1215" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="1220" font-size="12.5" fill="#64748B">data plane</text>
</g>
</svg>
