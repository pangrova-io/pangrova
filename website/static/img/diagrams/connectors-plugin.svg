<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Connector plugin architecture</title>
<desc id="d">Versioned factories are discovered per role, isolated by classloader, and exposed through the Connector SPI.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">Connector plugin architecture</text>
<text x="60" y="106" font-size="17" fill="#64748B">Factories and providers are isolated; the engine compiles against contracts only.</text>
<rect x="60" y="140" width="1080" height="230" rx="18" fill="#FBFBFE" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="172" font-size="19" font-weight="700" fill="#7C3AED">INVENTORY</text>
<rect x="90" y="190" width="310" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="190" width="5" height="120" rx="2.5" fill="#2563EB"/>
<text x="110" y="218" font-size="16.5" font-weight="700" fill="#111827">Factory discovery</text>
<text x="110" y="242" font-size="13.5" fill="#64748B">ServiceLoader per role</text>
<text x="110" y="263" font-size="13.5" fill="#64748B">Duplicate names and versions rejected</text>
<rect x="430" y="190" width="310" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="430" y="190" width="5" height="120" rx="2.5" fill="#0D9488"/>
<text x="450" y="218" font-size="16.5" font-weight="700" fill="#111827">Classloader isolation</text>
<text x="450" y="242" font-size="13.5" fill="#64748B">Builtin factories on the role classpath</text>
<text x="450" y="263" font-size="13.5" fill="#64748B">Each external directory gets one loader</text>
<rect x="770" y="190" width="340" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="770" y="190" width="5" height="120" rx="2.5" fill="#D97706"/>
<text x="790" y="218" font-size="16.5" font-weight="700" fill="#111827">Lifecycle</text>
<text x="790" y="242" font-size="13.5" fill="#64748B">Restart to update plugins</text>
<text x="790" y="263" font-size="13.5" fill="#64748B">Active leases block loader reclamation</text>
<line x1="600" y1="370" x2="600" y2="410" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="394.0" font-size="14" font-weight="600" fill="#7C3AED">connector contracts</text>
<rect x="60" y="410" width="1080" height="210" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="442" font-size="19" font-weight="700" fill="#7C3AED">CONNECTOR SPI</text>
<rect x="90" y="465" width="320" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="250" y="494" font-size="14.5" font-weight="600" fill="#5B21B6" text-anchor="middle">Metadata</text>
<rect x="440" y="465" width="320" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="600" y="494" font-size="14.5" font-weight="600" fill="#5B21B6" text-anchor="middle">Split planning</text>
<rect x="790" y="465" width="320" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="950" y="494" font-size="14.5" font-weight="600" fill="#5B21B6" text-anchor="middle">Page source</text>
<rect x="90" y="529" width="320" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="250" y="558" font-size="14.5" font-weight="600" fill="#5B21B6" text-anchor="middle">Page sink</text>
<rect x="440" y="529" width="320" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="600" y="558" font-size="14.5" font-weight="600" fill="#5B21B6" text-anchor="middle">Transaction</text>
<rect x="790" y="529" width="320" height="46" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="950" y="558" font-size="14.5" font-weight="600" fill="#5B21B6" text-anchor="middle">Index &amp; statistics</text>
<line x1="600" y1="620" x2="600" y2="660" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="644.0" font-size="14" font-weight="600" fill="#7C3AED">bindings</text>
<line x1="600" y1="660" x2="250" y2="690" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90" y="690" width="320" height="92" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="690" width="5" height="92" rx="2.5" fill="#0D9488"/>
<text x="110" y="718" font-size="16.5" font-weight="700" fill="#111827">Apache Iceberg</text>
<text x="110" y="742" font-size="13.5" fill="#64748B">Native catalog · snapshots · metadata tables</text>
<line x1="600" y1="660" x2="610" y2="690" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="450" y="690" width="320" height="92" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="450" y="690" width="5" height="92" rx="2.5" fill="#0D9488"/>
<text x="470" y="718" font-size="16.5" font-weight="700" fill="#111827">Apache Paimon</text>
<text x="470" y="742" font-size="13.5" fill="#64748B">Filesystem or REST catalog · merge policies</text>
<line x1="600" y1="660" x2="970" y2="690" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="810" y="690" width="320" height="92" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="810" y="690" width="5" height="92" rx="2.5" fill="#0D9488"/>
<text x="830" y="718" font-size="16.5" font-weight="700" fill="#111827">Managed Lance</text>
<text x="830" y="742" font-size="13.5" fill="#64748B">Native dataset control · snapshot isolation</text>
<text x="600" y="830" font-size="14" fill="#64748B" text-anchor="middle">Additional formats register through the same factory contract; updates require a restart.</text>
<line x1="60" y1="870" x2="100" y2="870" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="875" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="870" x2="280" y2="870" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="875" font-size="12.5" fill="#64748B">data plane</text>
</g>
</svg>
