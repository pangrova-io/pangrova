<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="t d">
<title id="t">Data governance pipeline</title>
<desc id="d">Lineage, quality rules, classification, and durable governance records.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="960" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">Data governance pipeline</text>
<text x="60" y="106" font-size="17" fill="#64748B">Governance consumes execution facts and persists decisions beside the data authority.</text>
<rect x="80" y="140" width="1040" height="76" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="80" y="140" width="5" height="76" rx="2.5" fill="#2563EB"/>
<text x="100" y="168" font-size="16.5" font-weight="700" fill="#111827">Sources</text>
<text x="100" y="192" font-size="13.5" fill="#64748B">Query events and lineage · table columns and tags · quality rule definitions</text>
<line x1="600" y1="216" x2="600" y2="256" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="60" y="256" width="1080" height="220" rx="18" fill="#FBFBFE" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="288" font-size="19" font-weight="700" fill="#7C3AED">GOVERNANCE RUNTIME</text>
<rect x="90" y="308" width="320" height="140" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="308" width="5" height="140" rx="2.5" fill="#7C3AED"/>
<text x="110" y="336" font-size="16.5" font-weight="700" fill="#111827">Lineage</text>
<text x="110" y="360" font-size="13.5" fill="#64748B">Logical START and terminal events</text>
<text x="110" y="381" font-size="13.5" fill="#64748B">LOG or OpenLineage HTTP backend</text>
<rect x="440" y="308" width="320" height="140" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="440" y="308" width="5" height="140" rx="2.5" fill="#D97706"/>
<text x="460" y="336" font-size="16.5" font-weight="700" fill="#111827">Quality</text>
<text x="460" y="360" font-size="13.5" fill="#64748B">Rule evaluation at write gates</text>
<text x="460" y="381" font-size="13.5" fill="#64748B">Severity, table UUID, and row count</text>
<rect x="790" y="308" width="310" height="140" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="790" y="308" width="5" height="140" rx="2.5" fill="#0D9488"/>
<text x="810" y="336" font-size="16.5" font-weight="700" fill="#111827">Classification</text>
<text x="810" y="360" font-size="13.5" fill="#64748B">Column tag bindings</text>
<text x="810" y="381" font-size="13.5" fill="#64748B">PII type and masking policy</text>
<line x1="600" y1="476" x2="600" y2="516" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="60" y="516" width="1080" height="210" rx="18" fill="#F7FEFC" stroke="#0D9488" stroke-opacity="0.45" stroke-width="1.6"/>
<text x="84" y="548" font-size="19" font-weight="700" fill="#0D9488">DURABLE RECORDS</text>
<rect x="90" y="570" width="320" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="90" y="570" width="5" height="120" rx="2.5" fill="#0D9488"/>
<text x="110" y="598" font-size="16.5" font-weight="700" fill="#111827">PostgreSQL</text>
<text x="110" y="622" font-size="13.5" fill="#64748B">Tag and policy bindings</text>
<text x="110" y="643" font-size="13.5" fill="#64748B">Audit and mutation receipts</text>
<rect x="440" y="570" width="320" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="440" y="570" width="5" height="120" rx="2.5" fill="#0D9488"/>
<text x="460" y="598" font-size="16.5" font-weight="700" fill="#111827">Lineage backend</text>
<text x="460" y="622" font-size="13.5" fill="#64748B">OpenLineage HTTP</text>
<text x="460" y="643" font-size="13.5" fill="#64748B">Configured outbox requirement</text>
<rect x="790" y="570" width="310" height="120" rx="13" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="790" y="570" width="5" height="120" rx="2.5" fill="#0D9488"/>
<text x="810" y="598" font-size="16.5" font-weight="700" fill="#111827">Query audit</text>
<text x="810" y="622" font-size="13.5" fill="#64748B">Terminal state and failure flag</text>
<text x="810" y="643" font-size="13.5" fill="#64748B">Tenant and submitter</text>
<text x="600" y="800" font-size="14" fill="#64748B" text-anchor="middle">Missing authority, unsupported SQL, or an unavailable backend fails closed; governance never silently fabricates success.</text>
<line x1="60" y1="930" x2="100" y2="930" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="935" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="930" x2="280" y2="930" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="935" font-size="12.5" fill="#64748B">data plane</text>
</g>
</svg>
