<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Testing levels</title>
<desc id="d">Real dependencies at every level, with no mocks or test doubles.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">Testing levels</text>
<text x="60" y="106" font-size="17" fill="#64748B">All levels use real dependencies; mocks, stubs, and test doubles are prohibited.</text>
<rect x="390" y="140" width="420" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="390" y="140" width="7" height="78" rx="3.5" fill="#D97706"/>
<text x="420" y="176" font-size="24" font-weight="700" fill="#111827">Benchmark and chaos</text>
<text x="420" y="206" font-size="16.5" fill="#475569">JMH · TPC-derived suites · fault injection</text>
<rect x="330" y="260" width="540" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="330" y="260" width="7" height="78" rx="3.5" fill="#7C3AED"/>
<text x="360" y="296" font-size="24" font-weight="700" fill="#111827">Native and sanitizers</text>
<text x="360" y="326" font-size="16.5" fill="#475569">GoogleTest · CTest · ASan/UBSan · packaged JNI</text>
<rect x="270" y="380" width="660" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="270" y="380" width="7" height="78" rx="3.5" fill="#0D9488"/>
<text x="300" y="416" font-size="24" font-weight="700" fill="#111827">End-to-end</text>
<text x="300" y="446" font-size="16.5" fill="#475569">Testcontainers · real Coordinator/Worker · real model and storage fixtures</text>
<rect x="210" y="500" width="780" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="210" y="500" width="7" height="78" rx="3.5" fill="#2563EB"/>
<text x="240" y="536" font-size="24" font-weight="700" fill="#111827">Module integration</text>
<text x="240" y="566" font-size="16.5" fill="#475569">Owning module dependencies · real PostgreSQL, Kafka, MinIO, Redis</text>
<rect x="180" y="620" width="840" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="180" y="620" width="7" height="112" rx="3.5" fill="#7C3AED"/>
<text x="210" y="656" font-size="24" font-weight="700" fill="#111827">Unit</text>
<text x="210" y="686" font-size="16.5" fill="#475569">Owning module · real lightweight dependencies</text>
<text x="210" y="715" font-size="16.5" fill="#475569">Every commit</text>
<text x="600" y="800" font-size="14" fill="#64748B" text-anchor="middle">Coverage depth follows risk: pure refactoring may rely on existing tests; new behavior needs boundary and error-path coverage.</text>
<text x="600" y="826" font-size="14" fill="#64748B" text-anchor="middle">Container and Native suites require their real prerequisites; unavailable prerequisites are reported, never silently skipped.</text>
</g>
</svg>
