<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="t d">
<title id="t">Query execution path</title>
<desc id="d">From SQL text through Coordinator planning to Native execution and Arrow Flight results.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7F5FF"/><stop offset="55%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F1F7FB"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
</defs>
<rect width="1200" height="1080" fill="url(#bg)"/>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<text x="60" y="74" font-size="34" font-weight="800" fill="#111827">Query execution path</text>
<text x="60" y="106" font-size="17" fill="#64748B">Control decisions stay in Java; relational work and data movement stay Native.</text>
<rect x="100" y="140" width="1000" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="100" y="140" width="7" height="100" rx="3.5" fill="#2563EB"/>
<text x="130" y="176" font-size="24" font-weight="700" fill="#111827">Clients</text>
<rect x="1017.2" y="154" width="62.8" height="30" rx="15" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="1048.6" y="173" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">HTTP</text>
<text x="130" y="206" font-size="16.5" fill="#475569">JDBC · REST API · CLI</text>
<text x="130" y="235" font-size="16.5" fill="#475569">SQL text · session context · result consumer</text>
<line x1="600" y1="240" x2="600" y2="276" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="262.0" font-size="14" font-weight="600" fill="#7C3AED">submit / status / cancel</text>
<rect x="100" y="280" width="1000" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="100" y="280" width="7" height="150" rx="3.5" fill="#7C3AED"/>
<text x="130" y="316" font-size="24" font-weight="700" fill="#111827">Coordinator JVM</text>
<rect x="1017.2" y="294" width="62.8" height="30" rx="15" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="1048.6" y="313" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">Java</text>
<rect x="130" y="328" width="69.0" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="164.5" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">parse</text>
<rect x="209.0" y="328" width="60.8" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="239.4" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">bind</text>
<rect x="279.8" y="328" width="101.8" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="330.7" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">authorize</text>
<rect x="391.6" y="328" width="60.8" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="422.0" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">plan</text>
<rect x="462.40000000000003" y="328" width="69.0" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="496.90000000000003" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">admit</text>
<rect x="541.4000000000001" y="328" width="93.6" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="588.2" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">schedule</text>
<rect x="645.0000000000001" y="328" width="69.0" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="679.5000000000001" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">fence</text>
<rect x="724.0000000000001" y="328" width="77.19999999999999" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="762.6000000000001" y="346" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">commit</text>
<text x="130" y="382" font-size="16.5" fill="#475569">Resolves catalog metadata and snapshots, chooses Workers, and owns the final fenced catalog commit.</text>
<line x1="600" y1="430" x2="600" y2="466" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="452.0" font-size="14" font-weight="600" fill="#7C3AED">canonical v2 task request</text>
<rect x="100" y="470" width="1000" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="100" y="470" width="7" height="120" rx="3.5" fill="#7C3AED"/>
<text x="130" y="506" font-size="24" font-weight="700" fill="#111827">Canonical task binding</text>
<text x="130" y="536" font-size="16.5" fill="#475569">TaskRequest v2 + Substrait plan + execution bindings</text>
<rect x="130" y="547" width="151.0" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="205.5" y="565" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">descriptor hash</text>
<rect x="291.0" y="547" width="93.6" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="337.8" y="565" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">snapshot</text>
<rect x="394.6" y="547" width="101.8" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="445.5" y="565" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">authority</text>
<rect x="506.40000000000003" y="547" width="69.0" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="540.9000000000001" y="565" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">lease</text>
<rect x="585.4000000000001" y="547" width="126.39999999999999" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="648.6000000000001" y="565" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">write intent</text>
<line x1="600" y1="590" x2="600" y2="626" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="612.0" font-size="14" font-weight="600" fill="#7C3AED">JNI</text>
<rect x="100" y="630" width="1000" height="110" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="100" y="630" width="7" height="110" rx="3.5" fill="#0D9488"/>
<text x="130" y="666" font-size="24" font-weight="700" fill="#111827">Worker JVM</text>
<rect x="1017.2" y="644" width="62.8" height="30" rx="15" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="1048.6" y="663" font-size="14" font-weight="700" fill="#0D9488" text-anchor="middle">Java</text>
<text x="130" y="696" font-size="16.5" fill="#475569">lifecycle · admission · JNI · secrets · governed provider callbacks</text>
<line x1="600" y1="740" x2="600" y2="776" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="762.0" font-size="14" font-weight="600" fill="#7C3AED">JNI</text>
<rect x="100" y="780" width="1000" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="100" y="780" width="7" height="130" rx="3.5" fill="#D97706"/>
<text x="130" y="816" font-size="24" font-weight="700" fill="#111827">C++ Native — Velox</text>
<rect x="1009.0" y="794" width="71.0" height="30" rx="15" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="1044.5" y="813" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">C++20</text>
<text x="130" y="846" font-size="16.5" fill="#475569">scan → filter/project → join/aggregate → retrieve → shuffle → fill → output</text>
<text x="130" y="875" font-size="16.5" fill="#475569">Vectorized operators consume Arrow batches and report status through the canonical lifecycle.</text>
<line x1="600" y1="910" x2="600" y2="946" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrowAmber)"/>
<text x="610.0" y="932.0" font-size="14" font-weight="600" fill="#D97706">Arrow Flight results</text>
<rect x="100" y="950" width="1000" height="70" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
<rect x="100" y="950" width="7" height="70" rx="3.5" fill="#D97706"/>
<text x="130" y="986" font-size="24" font-weight="700" fill="#111827">Client result stream</text>
<text x="130" y="1016" font-size="16.5" fill="#475569">Output Worker streams batches directly to the consumer.</text>
<line x1="60" y1="1050" x2="100" y2="1050" stroke="#7C3AED" stroke-width="2.4"/>
<text x="110" y="1055" font-size="12.5" fill="#64748B">control plane</text>
<line x1="240" y1="1050" x2="280" y2="1050" stroke="#D97706" stroke-width="2.4" stroke-dasharray="8 6"/>
<text x="290" y="1055" font-size="12.5" fill="#64748B">data plane</text>
</g>
</svg>
