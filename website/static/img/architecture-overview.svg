<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Pangrova architecture overview</title>
  <desc id="archDesc">Clients submit SQL over HTTP to the Java Coordinator, which plans with Calcite, owns control state and catalog commit, and dispatches tasks to Worker JVMs. Workers execute through JNI in C++/Velox, exchange data with Arrow Flight, read and write lakehouse storage, and stream results to clients from the output worker.</desc>

  <defs>
    <marker id="arrowControl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5D78"/>
    </marker>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C77C2B"/>
    </marker>
    <style>
      .box-title { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #17202E; }
      .box-text  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 15px; fill: #2A3648; }
      .box-sub   { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; fill: #4A5568; }
      .label     { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; fill: #4A5D78; }
      .label-data{ font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; fill: #A9621F; }
      .region    { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #5A6B85; letter-spacing: 0.4px; }
      .col       { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #3C4A5E; }
    </style>
  </defs>

  <rect x="0" y="0" width="1520" height="1040" fill="#FFFFFF"/>

  <!-- Clients -->
  <rect x="60" y="100" width="230" height="120" rx="12" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.5"/>
  <text class="box-title" x="175" y="146" text-anchor="middle">Clients</text>
  <text class="box-text" x="175" y="176" text-anchor="middle">JDBC · REST API · CLI</text>
  <text class="box-sub" x="175" y="198" text-anchor="middle">SQL submit · status · cancel</text>

  <!-- Coordinator -->
  <rect x="400" y="80" width="440" height="180" rx="12" fill="#EEF2FF" stroke="#5B6ABF" stroke-width="1.5"/>
  <text class="box-title" x="620" y="116" text-anchor="middle">Coordinator — Java</text>
  <text class="box-text" x="620" y="146" text-anchor="middle">ANTLR parse · bind · authorize</text>
  <text class="box-text" x="620" y="172" text-anchor="middle">Calcite planning · admission</text>
  <text class="box-text" x="620" y="198" text-anchor="middle">Scheduling · fencing</text>
  <text class="box-text" x="620" y="224" text-anchor="middle">Catalog metadata &amp; final commit</text>

  <!-- Control state -->
  <rect x="960" y="95" width="250" height="140" rx="12" fill="#FFF4E5" stroke="#C98A2B" stroke-width="1.5"/>
  <text class="box-title" x="1085" y="130" text-anchor="middle">Control State</text>
  <text class="box-text" x="1085" y="160" text-anchor="middle">JDBC journal &amp; leases</text>
  <text class="box-text" x="1085" y="186" text-anchor="middle">Catalog metadata</text>
  <text class="box-sub" x="1085" y="210" text-anchor="middle">ZooKeeper optional backend</text>

  <!-- Client -> Coordinator -->
  <line x1="290" y1="160" x2="392" y2="160" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="341" y="150" text-anchor="middle">HTTP</text>

  <!-- Coordinator <-> Control state -->
  <line x1="840" y1="160" x2="952" y2="160" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <line x1="952" y1="172" x2="848" y2="172" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="900" y="142" text-anchor="middle">durable</text>
  <text class="label" x="900" y="194" text-anchor="middle">metadata</text>

  <!-- Workers region -->
  <rect x="300" y="340" width="1140" height="420" rx="16" fill="#F7F9FC" stroke="#A9B7CC" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text class="region" x="324" y="372">Worker processes</text>

  <!-- Worker A column -->
  <text class="col" x="580" y="412" text-anchor="middle">Worker A</text>
  <rect x="350" y="425" width="460" height="105" rx="10" fill="#E9F7EF" stroke="#3E8E5A" stroke-width="1.5"/>
  <text class="box-title" x="580" y="462" text-anchor="middle">Worker JVM — Java</text>
  <text class="box-text" x="580" y="490" text-anchor="middle">Task lifecycle · admission</text>
  <text class="box-sub" x="580" y="512" text-anchor="middle">JNI bridge · connector callbacks</text>

  <rect x="350" y="585" width="460" height="105" rx="10" fill="#FFF1E0" stroke="#D9822B" stroke-width="1.5"/>
  <text class="box-title" x="580" y="622" text-anchor="middle">Native Worker — C++ / Velox</text>
  <text class="box-text" x="580" y="650" text-anchor="middle">Scan · compute · shuffle · write</text>
  <text class="box-sub" x="580" y="672" text-anchor="middle">Arrow batches across data boundaries</text>

  <line x1="580" y1="530" x2="580" y2="577" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="590" y="560">JNI</text>

  <!-- Worker B column -->
  <text class="col" x="1240" y="412" text-anchor="middle">Worker B</text>
  <rect x="930" y="425" width="460" height="105" rx="10" fill="#E9F7EF" stroke="#3E8E5A" stroke-width="1.5"/>
  <text class="box-title" x="1160" y="462" text-anchor="middle">Worker JVM — Java</text>
  <text class="box-text" x="1160" y="490" text-anchor="middle">Task lifecycle · admission</text>
  <text class="box-sub" x="1160" y="512" text-anchor="middle">JNI bridge · connector callbacks</text>

  <rect x="930" y="585" width="460" height="105" rx="10" fill="#FFF1E0" stroke="#D9822B" stroke-width="1.5"/>
  <text class="box-title" x="1160" y="622" text-anchor="middle">Native Worker — C++ / Velox</text>
  <text class="box-text" x="1160" y="650" text-anchor="middle">Scan · compute · shuffle · write</text>
  <text class="box-sub" x="1160" y="672" text-anchor="middle">Arrow batches across data boundaries</text>

  <line x1="1160" y1="530" x2="1160" y2="577" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="1170" y="560">JNI</text>

  <!-- Worker exchange -->
  <line x1="810" y1="637" x2="922" y2="637" stroke="#C77C2B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowData)"/>
  <line x1="922" y1="650" x2="818" y2="650" stroke="#C77C2B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowData)"/>
  <text class="label-data" x="870" y="620" text-anchor="middle">Arrow Flight</text>
  <text class="label-data" x="870" y="676" text-anchor="middle">exchange</text>

  <!-- Coordinator -> Workers -->
  <line x1="520" y1="260" x2="520" y2="417" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="532" y="330">HTTP task control</text>
  <polyline points="780,260 780,300 1140,300 1140,417" fill="none" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="960" y="292" text-anchor="middle">HTTP task control</text>

  <!-- Worker status -> Coordinator (top lane) -->
  <polyline points="1390,470 1420,470 1420,30 700,30 700,72" fill="none" stroke="#4A5D78" stroke-width="2" marker-end="url(#arrowControl)"/>
  <text class="label" x="1040" y="18" text-anchor="middle">status · commit metadata</text>

  <!-- Output worker results -> Clients (top lane) -->
  <polyline points="1390,660 1470,660 1470,55 175,55 175,92" fill="none" stroke="#C77C2B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowData)"/>
  <text class="label-data" x="800" y="47" text-anchor="middle">Arrow Flight results from the output worker</text>

  <!-- Lakehouse storage -->
  <rect x="460" y="850" width="740" height="120" rx="12" fill="#FFF4E5" stroke="#C98A2B" stroke-width="1.5"/>
  <text class="box-title" x="830" y="892" text-anchor="middle">Lakehouse storage</text>
  <text class="box-text" x="830" y="922" text-anchor="middle">Iceberg / Paimon tables · object storage / local files</text>
  <text class="box-sub" x="830" y="946" text-anchor="middle">The Coordinator publishes the final fenced catalog commit</text>

  <line x1="580" y1="690" x2="580" y2="842" stroke="#C77C2B" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
  <line x1="1160" y1="690" x2="1160" y2="842" stroke="#C77C2B" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
  <text class="label-data" x="880" y="790" text-anchor="middle">data reads / writes · files and immutable artifacts</text>

  <!-- Legend -->
  <line x1="60" y1="1005" x2="110" y2="1005" stroke="#4A5D78" stroke-width="2"/>
  <text class="label" x="120" y="1010">control plane</text>
  <line x1="240" y1="1005" x2="290" y2="1005" stroke="#C77C2B" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="label-data" x="300" y="1010">data plane</text>
</svg>
