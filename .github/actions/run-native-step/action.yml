name: Run a native build step with diagnostics
description: >-
  Run a shell command, tee its output, and on failure publish one escaped
  annotation containing the last commands, matching errors and runner state.

inputs:
  log:
    description: Log file stem written under RUNNER_TEMP
    required: true
  title:
    description: Human-readable failure title for the step summary
    required: true
  command:
    description: Shell command executed with bash -e -o pipefail
    required: true
  working-directory:
    description: Directory relative to the workspace
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run command
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LOG_NAME: ${{ inputs.log }}
        FAILURE_TITLE: ${{ inputs.title }}
        STEP_COMMAND: ${{ inputs.command }}
      run: |
        set -o pipefail
        log="$RUNNER_TEMP/${LOG_NAME}.log"
        if bash -e -o pipefail -c "$STEP_COMMAND" 2>&1 | tee "$log"; then
          exit 0
        fi
        {
          printf '### %s\n```text\n' "$FAILURE_TITLE"
          df -h /
          uname -a
          free -m 2>/dev/null || vm_stat
          tail -n 160 "$log"
          printf '```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        escaped="$({ df -h /; uname -a; free -m 2>/dev/null || vm_stat; \
          printf '%s\n' '--- last command lines ---'; tail -n 25 "$log"; \
          printf '%s\n' '--- error diagnostics ---'; \
          grep -E -i 'error:|fatal error|CMake Error|undefined reference|ld: |cannot find|No space left|Killed|ninja: build stopped|command not found|Failed to|FAILED:' "$log" \
            | tail -n 80 || true; } \
          | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
          | awk 'length {printf "%s%%0A", $0}')"
        printf '::error::%s\n' "${escaped:0:60000}"
        exit 1
