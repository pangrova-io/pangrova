version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      arrow:
        patterns:
          - "org.apache.arrow*"
      calcite:
        patterns:
          - "org.apache.calcite*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
