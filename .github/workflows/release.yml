name: Release

on:
  push:
    tags:
      - 'v*'

env:
  MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml

jobs:
  validation:
    name: Validate release revision
    uses: ./.github/workflows/ci.yml

  native-build:
    name: Native Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            lib-ext: so
            classifier: linux-x86_64
            docker-build: true
            docker-platform: linux/amd64
          - name: linux-aarch_64
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            lib-ext: so
            classifier: linux-aarch_64
            docker-build: true
            docker-platform: linux/arm64
          - name: osx-x86_64
            runner: macos-15-intel
            os: osx
            arch: x86_64
            lib-ext: dylib
            classifier: osx-x86_64
            docker-build: false
          - name: osx-aarch_64
            runner: macos-15
            os: osx
            arch: aarch64
            lib-ext: dylib
            classifier: osx-aarch_64
            docker-build: false
    steps:
      - uses: actions/checkout@v7

      # --- Docker reproducible build (Linux) ---
      - name: Set up QEMU (cross-arch Docker builds)
        if: matrix.platform.docker-build
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: matrix.platform.docker-build
        uses: docker/setup-buildx-action@v4

      - name: Build native library via Docker (reproducible)
        if: matrix.platform.docker-build
        run: |
          docker buildx build \
            -f deploy/docker/Dockerfile.native-build \
            --platform ${{ matrix.platform.docker-platform }} \
            --target output \
            --output type=local,dest=native-output \
            .
          mkdir -p native-lib
          cp native-output/libpangrova_native.${{ matrix.platform.lib-ext }} native-lib/

      # --- Direct build (macOS — no Docker) ---
      - name: Cache dependency archives
        if: "!matrix.platform.docker-build"
        uses: actions/cache@v6
        with:
          path: ~/.pangrova/velox/archive-cache
          key: pangrova-v1-archives-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/dependency-versions.txt') }}

      - name: Cache native dependency prefixes
        if: "!matrix.platform.docker-build"
        uses: actions/cache@v6
        with:
          path: |
            ~/.pangrova/native-deps
            ~/.pangrova/velox/deps-install
          key: pangrova-v1-deps-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/dependency-versions.txt', '.github/actions/setup-native-build/action.yml', 'pangrova-worker-native/patches/*') }}

      - name: Cache Velox build layer
        if: "!matrix.platform.docker-build"
        uses: actions/cache@v6
        with:
          path: |
            ~/.pangrova/velox/_build/release/_deps
            ~/.pangrova/velox/_build/release/lib
            ~/.pangrova/velox/_build/release/CMakeCache.txt
          key: pangrova-v1-velox-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/dependency-versions.txt', 'pangrova-worker-native/patches/velox-*.patch', 'pangrova-protocol/src/main/resources/function-contracts/execution-selection.json') }}

      - name: Cache compiler results (macOS)
        if: "!matrix.platform.docker-build"
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: pangrova-ccache-release-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            pangrova-ccache-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up native build tools (macOS)
        if: "!matrix.platform.docker-build"
        uses: ./.github/actions/setup-native-build

      - name: Build native dependencies (macOS)
        if: "!matrix.platform.docker-build"
        run: ./pangrova-worker-native/bin/setup-native-build-env.sh

      - name: Build required Lance C FFI (macOS)
        if: "!matrix.platform.docker-build"
        run: ./pangrova-worker-native/bin/build-lance-ffi.sh

      - name: CMake configure (macOS)
        if: "!matrix.platform.docker-build"
        run: |
          source ~/.pangrova/env.sh
          cmake --preset dev-release -DPANGROVA_BUILD_TESTS=OFF
        working-directory: pangrova-worker-native

      - name: CMake build (macOS)
        if: "!matrix.platform.docker-build"
        run: |
          cmake --build build
          mkdir -p ../native-lib
          cp build/libpangrova_native.${{ matrix.platform.lib-ext }} ../native-lib/
        working-directory: pangrova-worker-native

      # --- Stage native lib into classifier JAR resource path ---
      - name: Stage native library for Maven packaging
        run: |
          RESOURCE_DIR=pangrova-worker/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          mkdir -p "${RESOURCE_DIR}"
          cp native-lib/libpangrova_native.${{ matrix.platform.lib-ext }} "${RESOURCE_DIR}/"
          echo "Staged native library:"
          find pangrova-worker/src/main/resources -type f

      # --- Build classifier JAR ---
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build classifier JAR
        run: |
          mvn -B package -pl pangrova-native-bundle \
            -Dnative.platform.classifier=${{ matrix.platform.classifier }} \
            -Dnative.resource.dir=${{ github.workspace }}/pangrova-worker/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }} \
            -Dnative.resource.os=${{ matrix.platform.os }} \
            -Dnative.resource.arch=${{ matrix.platform.arch }} \
            -Dnative.library.path=${{ github.workspace }}/pangrova-worker/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }}/libpangrova_native.${{ matrix.platform.lib-ext }} \
            -DskipTests

      - name: Upload classifier JAR
        uses: actions/upload-artifact@v7
        with:
          name: release-native-bundle-${{ matrix.platform.classifier }}
          path: pangrova-native-bundle/target/pangrova-native-bundle-*-${{ matrix.platform.classifier }}.jar
          retention-days: 1

      - name: Upload raw native library
        uses: actions/upload-artifact@v7
        with:
          name: release-native-lib-${{ matrix.platform.name }}
          path: native-lib/libpangrova_native.*
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [native-build, validation]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-native-*

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install same-run Iceberg SDK
        uses: ./.github/actions/restore-iceberg-sdk

      - name: Build Java modules
        run: mvn -B clean package -DskipTests -pl '!pangrova-native-bundle'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/release-native-bundle-*/pangrova-native-bundle-*.jar
            artifacts/release-native-lib-*/libpangrova_native.*
