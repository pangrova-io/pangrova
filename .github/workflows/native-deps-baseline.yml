name: Native dependency baseline

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Isolated CI stage to verify
        type: choice
        options: [macos-docker, macos-intel-docker, production, worker-files, java-daily]
        default: macos-docker

permissions:
  contents: read
  actions: read

jobs:
  macos-docker:
    if: inputs.probe == 'macos-docker' || inputs.probe == 'macos-intel-docker'
    name: Verify native macOS Docker
    runs-on: ${{ inputs.probe == 'macos-intel-docker' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Start the CI Docker endpoint
        run: bash .pangrova/scripts/setup-macos-native-test-docker.sh
      - name: Run PostgreSQL and verify the published port
        env:
          DOCKER_API_VERSION: '1.44'
        run: |
          command -v docker >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install docker
          docker info
          docker run --rm -d --name pangrova-ci-probe -e POSTGRES_PASSWORD=probe \
            -p 127.0.0.1::5432 postgres:16-alpine
          trap 'docker logs pangrova-ci-probe; docker stop pangrova-ci-probe || true' EXIT
          port=$(docker port pangrova-ci-probe 5432/tcp | cut -d: -f2)
          for attempt in $(seq 1 60); do
            if docker exec pangrova-ci-probe pg_isready -h 127.0.0.1 &&
                nc -z -G 2 127.0.0.1 "$port"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  production-regression:
    name: Production image and full regression (JDK 17)
    runs-on: ubuntu-24.04
    if: inputs.probe == 'production'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      PANGROVA_PROBE_SOURCE_SHA: 4aa0e5c87377b0a502dd4d12159cef8f70a879da
      PANGROVA_E2E_IMAGE: pangrova/pangrova:ci-4aa0e5c87377b0a502dd4d12159cef8f70a879da-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4aa0e5c87377b0a502dd4d12159cef8f70a879da
          fetch-depth: 3
      - name: Verify the source and the tested Native fixture inputs
        run: |
          test "$(git rev-parse HEAD)" = "$PANGROVA_PROBE_SOURCE_SHA"
          git diff --exit-code 80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0 HEAD -- pangrova-worker-native pangrova-protocol
          free -h
          df -h /

      - name: Download the tested Java Native fixture
        uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-test-download
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Restore executable test runtime
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/java-native-test-runtime.XXXXXXXX")
          tar -xzf "$RUNNER_TEMP/java-native-test-download/java-native-test-runtime.tar.gz" -C "$runtime_dir"
          test -x "$runtime_dir/pangrova_lance_fixture_tool"
          test -x "$runtime_dir/libexec/pangrova_lance_fixture_tool"
          echo "PANGROVA_JAVA_NATIVE_TEST_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download the tested Iceberg SDK
        uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Build the canonical same-source Linux production image
        run: |
          docker buildx version
          IMAGE="$PANGROVA_E2E_IMAGE" SOURCE_COMMIT="$PANGROVA_PROBE_SOURCE_SHA" \
            docker buildx bake --load -f deploy/docker/docker-bake.hcl \
              --allow "fs.read=$RUNNER_TEMP/pangrova-iceberg-sdk" \
              --set native-build.args.NATIVE_BUILD_JOBS=2 \
              --set 'pangrova.args.MAVEN_ARGS=-C --global-settings /build/.mvn/ci-settings.xml' \
              --set "pangrova.contexts.iceberg-sdk=$RUNNER_TEMP/pangrova-iceberg-sdk" pangrova
          image_id=$(docker image inspect --format '{{.Id}}' "$PANGROVA_E2E_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" == "$PANGROVA_PROBE_SOURCE_SHA" ]]
          echo "PANGROVA_E2E_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Stage the production classifier and matching host JNI
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/pangrova-local-runtime.XXXXXXXX")
          echo "PANGROVA_LOCAL_STAGE=$stage" >> "$GITHUB_ENV"
          bundle=$(bash .pangrova/scripts/stage-production-regression-native.sh \
            "$PANGROVA_E2E_IMAGE_ID" "$stage" "$PANGROVA_PROBE_SOURCE_SHA")
          mvn -B install:install-file -Dfile="$bundle" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64 -Dpackaging=jar

      # Standalone-process tests need the complete reactor installed before tests start.
      - name: Install the complete Java reactor for process tests
        run: mvn -B -Pnative-runtime -DskipTests install -pl '!pangrova-native-bundle'

      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          echo "PANGROVA_E2E_AI_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Configure real FILE SQL acceptance
        run: |
          capability_key=$(openssl rand -base64 32)
          echo "::add-mask::$capability_key"
          echo "PANGROVA_E2E_FILE_CAPABILITY_KEY=$capability_key" >> "$GITHUB_ENV"

      - name: Run full regression
        run: |
          mvn -B -Pnative-runtime,full-regression verify -pl '!pangrova-native-bundle' \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
            -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID" \
            -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
            -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
            -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
            -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
            -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA"

      - name: Run isolated Native runtime owner E2E
        run: |
          for suite in WorkerBootstrapE2ETest NativeExchangeTransportExternalIntegrationTest \
                       WorkerShuffleChannelAdmissionIntegrationTest \
                       NativeShuffleEgressContractIntegrationTest \
                       NativeAiFailureProjectionRegistrationTest \
                       WorkerMembershipAdmissionE2ETest \
                       'CopySourceReadHttpE2ETest#privateTicketStagesExactVersionAndRestartsFromManagedBytes' \
                       LocalGovernedFileSqlE2ETest; do
            file_backend=s3
            if [[ "$suite" == LocalGovernedFileSqlE2ETest ]]; then file_backend=local; fi
            mvn -B -Pnative-runtime,full-regression \
              -pl pangrova-testing/pangrova-testing-integration-tests \
              -Dpangrova.e2e.excludedGroups=none -Dtest="$suite" test \
              -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
              -Dpangrova.e2e.file.backend="$file_backend" \
              -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
              -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
              -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
              -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
              -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
              -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID"
          done

      - name: Upload full regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-regression-reports
          path: |
            **/target/surefire-reports/

      - name: Upload production runtime provenance and process diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-runtime-provenance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pangrova-ai-fixture.json
            ${{ runner.temp }}/pangrova-local-runtime.*/runtime.sha256
            ${{ runner.temp }}/pangrova-local-runtime.*/image-provenance.properties
            /tmp/pangrova-local-process-*/*.log

  worker-files:
    name: Verify 5 GiB HTTP transfer and authorization on Temurin 17
    if: inputs.probe == 'worker-files'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: ./.github/actions/setup-iceberg-sdk
      - name: Run file transfer and authorization tests
        run: |
          cat >"$RUNNER_TEMP/maven-global.xml" <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          XML
          mvn -B -C --global-settings "$RUNNER_TEMP/maven-global.xml" \
            -Pfull-regression -pl :pangrova-worker -am \
            -Dtest=FileSpaceLargeObjectIntegrationTest,FileTransferDeadlineTest,FileSpaceFileResourceTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload file test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-file-surefire-reports
          path: pangrova-worker/target/surefire-reports/

  java-daily:
    name: Java Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    if: inputs.probe == 'java-daily'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      NATIVE_LIB_DIR: ${{ github.workspace }}/pangrova-worker-native/build
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the primary build target. JDK 21 runs in CI to catch
        # incompatibilities (e.g., new strong-encapsulation defaults, removed
        # APIs) before we promote 21 to the primary target.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f0cdbaae4747fc6338e654353efdeb26e5458c70
          fetch-depth: 2
      - name: Check the validated source revision
        run: |
          test "$(git rev-parse HEAD)" = f0cdbaae4747fc6338e654353efdeb26e5458c70
          git diff --exit-code 80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0 HEAD -- . ':!**/src/test/**'

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download native library (for java.library.path fallback)
        uses: actions/download-artifact@v8
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Download classifier JAR
        uses: actions/download-artifact@v8
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Download the tested Java Native fixture
        uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-test-download
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Restore executable test runtime
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/java-native-test-runtime.XXXXXXXX")
          tar -xzf "$RUNNER_TEMP/java-native-test-download/java-native-test-runtime.tar.gz" -C "$runtime_dir"
          test -x "$runtime_dir/pangrova_lance_fixture_tool"
          test -x "$runtime_dir/libexec/pangrova_lance_fixture_tool"
          echo "PANGROVA_JAVA_NATIVE_TEST_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

      - name: Verify artifacts
        run: |
          ls -la ${{ env.NATIVE_LIB_DIR }}/libpangrova_native.*
          ls -la native-bundle-jar/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Download the tested Iceberg SDK
        uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Compile and run daily filtered tests
        run: |
          export LD_LIBRARY_PATH="$NATIVE_LIB_DIR:$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/lib"
          mvn -B verify -Pnative-runtime -pl '!pangrova-native-bundle' \
            -Djava.library.path="$NATIVE_LIB_DIR" \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool"

      - name: Upload Java regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-daily-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/'
