name: Native dependency baseline

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Isolated CI stage to verify
        type: choice
        options: [macos-docker, macos-intel-docker, production, worker-files, java-daily, libunwind, ai-fixture, jmh-relative, tpc-transport, macos-libcxx, production-pic]
        default: macos-docker
      production_source:
        description: Exact production source revision
        type: string

permissions:
  contents: read
  actions: read

jobs:
  production-pic:
    name: Audit production PIC archives
    if: inputs.probe == 'production-pic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Verify actual Boost and curl shared-library links
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/source:ro" \
            ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 \
            bash -euo pipefail -s <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential gcc-11 g++-11 ninja-build \
            python3-pip sudo git curl ca-certificates pkg-config xz-utils libssl-dev zlib1g-dev \
            libbz2-dev liblzma-dev libevent-dev libsnappy-dev libdouble-conversion-dev \
            libsodium-dev libxml2-dev liblz4-dev libzstd-dev libxxhash-dev libicu-dev
          python3 -m pip install --no-cache-dir --only-binary=:all: cmake==3.28.3
          export CC=gcc-11 CXX=g++-11 BUILD_THREADS=2 CMAKE_BUILD_PARALLEL_LEVEL=2
          git -c http.version=HTTP/1.1 clone --depth 1 --branch v2026.04.17.00 \
            https://github.com/facebookincubator/velox.git /tmp/velox
          cd /tmp/velox
          git apply --check /source/pangrova-worker-native/patches/velox-linux-production-pic-boost.patch
          git apply /source/pangrova-worker-native/patches/velox-linux-production-pic-boost.patch
          scripts/setup-ubuntu.sh install_boost
          boost_lib=/usr/local/lib
          "$CXX" -shared -Wl,-z,defs,-z,text -Wl,--whole-archive \
            "$boost_lib/libboost_filesystem.a" "$boost_lib/libboost_atomic.a" \
            -Wl,--no-whole-archive -pthread -o /tmp/boost-pic-check.so
          echo 'Pinned Boost static PIC shared link passed'
          export PANGROVA_DEPS_PREFIX=/opt/pangrova-production/native-deps
          bash /source/deploy/docker/build-static-curl.sh
          echo 'Pinned curl static PIC shared link passed'
          multiarch=$("$CC" -dumpmachine)
          failure=0
          for name in bz2 lzma z event_core event_extra event_openssl event_pthreads snappy \
            double-conversion sodium xml2 lz4 zstd xxhash ssl crypto icui18n icuuc icudata; do
            archive="/usr/lib/$multiarch/lib$name.a"
            test -f "$archive"
            if "$CXX" -shared -Wl,-z,text -Wl,--whole-archive "$archive" \
                -Wl,--no-whole-archive -o /tmp/system-pic-check.so; then
              printf 'System archive PIC link passed %s\n' "$archive"
            else
              failure=1
            fi
          done
          exit "$failure"
          BASH

  macos-libcxx:
    name: Verify macOS libc++ exception ABI
    if: inputs.probe == 'macos-libcxx'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - name: Reproduce exception linkage and verify deployment target
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/libcxx-probe.XXXXXXXX")
          cxx="$(brew --prefix llvm@18)/bin/clang++"
          "$cxx" --version
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDK=%s\n' "$SDKROOT"
          cat > "$work/exception.cpp" <<'CPP'
          #include <future>
          #include <stdexcept>
          int main() {
              std::promise<int> promise;
              auto result = promise.get_future();
              promise.set_exception(std::make_exception_ptr(std::runtime_error("expected")));
              try { return result.get(); }
              catch (const std::runtime_error&) { return 0; }
          }
          CPP
          unset MACOSX_DEPLOYMENT_TARGET
          "$cxx" -isysroot "$SDKROOT" -std=c++20 -O2 -c "$work/exception.cpp" -o "$work/default.o"
          nm -u "$work/default.o"
          if "$cxx" -isysroot "$SDKROOT" "$work/default.o" -o "$work/default"; then
            "$work/default"
          else
            printf 'Default deployment target reproduced an exception link failure\n'
          fi
          export MACOSX_DEPLOYMENT_TARGET=13.0
          "$cxx" -isysroot "$SDKROOT" -std=c++20 -O2 -c "$work/exception.cpp" -o "$work/compatible.o"
          nm -u "$work/compatible.o" > "$work/symbols"
          cat "$work/symbols"
          if grep -E '__cxa_init_primary_exception|__from_native_exception_pointer' "$work/symbols"; then
            printf 'Changing the deployment target alone retained the newer exception symbols\n'
          fi
          if "$cxx" -isysroot "$SDKROOT" "$work/compatible.o" -o "$work/compatible"; then
            "$work/compatible"
          fi
          "$cxx" -isysroot "$SDKROOT" -nostdinc++ -isystem "$SDKROOT/usr/include/c++/v1" \
            -std=c++20 -O2 -c "$work/exception.cpp" -o "$work/sdk-libcxx.o"
          nm -u "$work/sdk-libcxx.o" > "$work/sdk-symbols"
          cat "$work/sdk-symbols"
          if grep -E '__cxa_init_primary_exception|__from_native_exception_pointer' "$work/sdk-symbols"; then
            exit 1
          fi
          "$cxx" -isysroot "$SDKROOT" "$work/sdk-libcxx.o" -o "$work/sdk-libcxx"
          "$work/sdk-libcxx"
          xcrun vtool -show-build "$work/sdk-libcxx"

  tpc-transport:
    name: Verify TPC workload contracts and real client transport
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: inputs.probe == 'tpc-transport'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9b6cec59638eb1172ea888121649aaed6a994317
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build the same-source CLI
        run: |
          test "$(git rev-parse HEAD)" = 9b6cec59638eb1172ea888121649aaed6a994317
          mvn -B package -pl pangrova-client/pangrova-client-cli -am -DskipTests -Dmaven.test.skip=true
      - name: Install pinned benchmark tooling
        run: python -m pip install -r pangrova-testing/pangrova-testing-benchmark/requirements.txt
      - name: Verify complete workloads, real Parquet conversion, runner and comparison contracts
        run: python -m unittest discover -s pangrova-testing/pangrova-testing-benchmark/scripts/tests -v
      - name: Verify persistent production client over real HTTP and Flight transport
        run: >-
          python pangrova-testing/pangrova-testing-benchmark/scripts/integration/test_persistent_transport.py
          --classpath pangrova-client/pangrova-client-cli/target/pangrova-client-cli-0.1.0-SNAPSHOT-exec.jar

  jmh-relative:
    name: JMH comparison on a single runner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: inputs.probe == 'jmh-relative'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      PANGROVA_CANDIDATE_SHA: afdddbed3bfa7d18a770a01382d86b8d37bd3c26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: afdddbed3bfa7d18a770a01382d86b8d37bd3c26
      - name: Check out the exact pull request base
        uses: actions/checkout@v7
        with:
          ref: 426d367632b2708a801e56839c592498db6a75a6
          path: jmh-base

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JMH harnesses for the base and candidate
        env:
          BASE_SHA: 426d367632b2708a801e56839c592498db6a75a6
        run: |
          [[ "$(git -C jmh-base rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$PANGROVA_CANDIDATE_SHA" ]]
          benchmark_args=(-B package -pl pangrova-testing/pangrova-testing-benchmark -am
                          -DskipTests -Dmaven.test.skip=true)
          (cd jmh-base && mvn "${benchmark_args[@]}")
          mvn "${benchmark_args[@]}"

      - name: Measure the base and candidate on the same runner
        run: |
          jar=pangrova-testing/pangrova-testing-benchmark/target/pangrova-benchmarks.jar
          mkdir -p target/jmh
          printf 'base=%s\ncandidate=%s\n' "$(git -C jmh-base rev-parse HEAD)" "$PANGROVA_CANDIDATE_SHA" \
            > target/jmh/revisions.txt
          measure() {
            java --add-opens=java.base/java.nio=ALL-UNNAMED -jar "$1" \
              -f 2 -wi 2 -i 3 -t 1 -foe true -jvmArgsAppend '-Xms512m -Xmx512m' \
              -rf json -rff "target/jmh/$2.json"
          }
          measure "jmh-base/$jar" base
          measure "$jar" candidate

      - name: Confirm the former empty baseline rejects real measurements
        run: |
          git -C jmh-base show HEAD:pangrova-testing/pangrova-testing-benchmark/baseline/jmh-baseline.json > "$RUNNER_TEMP/jmh-previous.json"
          set +e
          bash pangrova-testing/pangrova-testing-benchmark/scripts/jmh-regression-check.sh             target/jmh/candidate.json "$RUNNER_TEMP/jmh-previous.json" 0.10
          result=$?
          set -e
          test "$result" -eq 2

      - name: Check for regressions (>10% = fail)
        run: |
          bash pangrova-testing/pangrova-testing-benchmark/scripts/jmh-regression-check.sh \
            target/jmh/candidate.json target/jmh/base.json 0.10

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-benchmark-results
          path: target/jmh/
          retention-days: 30

  ai-fixture:
    if: inputs.probe == 'ai-fixture'
    name: Prepare and validate the real offline AI fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4aa0e5c87377b0a502dd4d12159cef8f70a879da
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          cat "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          docker run --rm -d --network none --name pangrova-ai-probe "$image_id" serve
          trap 'docker logs pangrova-ai-probe; docker stop pangrova-ai-probe' EXIT
          for attempt in $(seq 1 30); do
            if docker exec pangrova-ai-probe ollama list; then break; fi
            sleep 1
          done
          docker exec -e OLLAMA_NOHISTORY=1 pangrova-ai-probe ollama run tinyllama:latest "Say hello in one sentence."
          docker exec pangrova-ai-probe ollama list | grep -F all-minilm:latest

  macos-docker:
    if: inputs.probe == 'macos-docker' || inputs.probe == 'macos-intel-docker'
    name: Verify native macOS Docker
    runs-on: ${{ inputs.probe == 'macos-intel-docker' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Start the CI Docker endpoint
        run: bash .pangrova/scripts/setup-macos-native-test-docker.sh
      - name: Run PostgreSQL and verify the published port
        env:
          DOCKER_API_VERSION: '1.44'
        run: |
          command -v docker >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install docker
          docker info
          docker run --rm -d --name pangrova-ci-probe -e POSTGRES_PASSWORD=probe \
            -p 127.0.0.1::5432 postgres:16-alpine
          trap 'docker logs pangrova-ci-probe; docker stop pangrova-ci-probe || true' EXIT
          port=$(docker port pangrova-ci-probe 5432/tcp | cut -d: -f2)
          for attempt in $(seq 1 60); do
            if docker exec pangrova-ci-probe pg_isready -h 127.0.0.1 &&
                nc -z -G 2 127.0.0.1 "$port"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  production-regression:
    name: Production image and full regression (JDK 17)
    runs-on: ubuntu-24.04
    if: inputs.probe == 'production'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      PANGROVA_PROBE_SOURCE_SHA: ${{ inputs.production_source }}
      PANGROVA_E2E_IMAGE: pangrova/pangrova:ci-${{ inputs.production_source }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
      - name: Verify the source and the tested Native fixture inputs
        run: |
          [[ "$PANGROVA_PROBE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PANGROVA_PROBE_SOURCE_SHA"
          tested_ref=80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0
          git fetch --depth=1 origin "$tested_ref"
          git diff --exit-code "$tested_ref" HEAD -- pangrova-protocol \
            pangrova-worker-native/CMakeLists.txt pangrova-worker-native/cmake \
            pangrova-worker-native/src pangrova-worker-native/include \
            pangrova-worker-native/lance-ffi pangrova-worker-native/tools \
            pangrova-connector/pangrova-connector-iceberg/patches \
            .pangrova/scripts/build-iceberg-sdk-candidate.sh
          lock=pangrova-worker-native/dependency-versions.txt
          diff -u <(git show "$tested_ref:$lock" | grep -v '^PANGROVA_DEPENDENCY_BUILD=') \
            <(grep -v '^PANGROVA_DEPENDENCY_BUILD=' "$lock")
          free -h
          df -h /

      - name: Download the tested Java Native fixture
        uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-test-download
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Restore executable test runtime
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/java-native-test-runtime.XXXXXXXX")
          tar -xzf "$RUNNER_TEMP/java-native-test-download/java-native-test-runtime.tar.gz" -C "$runtime_dir"
          test -x "$runtime_dir/pangrova_lance_fixture_tool"
          test -x "$runtime_dir/libexec/pangrova_lance_fixture_tool"
          echo "PANGROVA_JAVA_NATIVE_TEST_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download the tested Iceberg SDK
        uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Build the canonical same-source Linux production image
        run: |
          docker buildx version
          IMAGE="$PANGROVA_E2E_IMAGE" SOURCE_COMMIT="$PANGROVA_PROBE_SOURCE_SHA" \
            docker buildx bake --load -f deploy/docker/docker-bake.hcl \
              --allow "fs.read=$RUNNER_TEMP/pangrova-iceberg-sdk" \
              --set native-build.args.NATIVE_BUILD_JOBS=2 \
              --set 'pangrova.args.MAVEN_ARGS=-C --global-settings /build/.mvn/ci-settings.xml' \
              --set "pangrova.contexts.iceberg-sdk=$RUNNER_TEMP/pangrova-iceberg-sdk" pangrova
          image_id=$(docker image inspect --format '{{.Id}}' "$PANGROVA_E2E_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" == "$PANGROVA_PROBE_SOURCE_SHA" ]]
          echo "PANGROVA_E2E_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Stage the production classifier and matching host JNI
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/pangrova-local-runtime.XXXXXXXX")
          echo "PANGROVA_LOCAL_STAGE=$stage" >> "$GITHUB_ENV"
          bundle=$(bash .pangrova/scripts/stage-production-regression-native.sh \
            "$PANGROVA_E2E_IMAGE_ID" "$stage" "$PANGROVA_PROBE_SOURCE_SHA")
          mvn -B install:install-file -Dfile="$bundle" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64 -Dpackaging=jar

      # Standalone-process tests need the complete reactor installed before tests start.
      - name: Install the complete Java reactor for process tests
        run: mvn -B -Pnative-runtime -DskipTests install -pl '!pangrova-native-bundle'

      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          echo "PANGROVA_E2E_AI_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Configure real FILE SQL acceptance
        run: |
          capability_key=$(openssl rand -base64 32)
          echo "::add-mask::$capability_key"
          echo "PANGROVA_E2E_FILE_CAPABILITY_KEY=$capability_key" >> "$GITHUB_ENV"

      - name: Run full regression
        run: |
          mvn -B -Pnative-runtime,full-regression verify -pl '!pangrova-native-bundle' \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
            -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID" \
            -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
            -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
            -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
            -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
            -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA"

      - name: Run isolated Native runtime owner E2E
        run: |
          for suite in WorkerBootstrapE2ETest NativeExchangeTransportExternalIntegrationTest \
                       WorkerShuffleChannelAdmissionIntegrationTest \
                       NativeShuffleEgressContractIntegrationTest \
                       NativeAiFailureProjectionRegistrationTest \
                       WorkerMembershipAdmissionE2ETest \
                       'CopySourceReadHttpE2ETest#privateTicketStagesExactVersionAndRestartsFromManagedBytes' \
                       LocalGovernedFileSqlE2ETest; do
            file_backend=s3
            if [[ "$suite" == LocalGovernedFileSqlE2ETest ]]; then file_backend=local; fi
            mvn -B -Pnative-runtime,full-regression \
              -pl pangrova-testing/pangrova-testing-integration-tests \
              -Dpangrova.e2e.excludedGroups=none -Dtest="$suite" test \
              -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
              -Dpangrova.e2e.file.backend="$file_backend" \
              -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
              -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
              -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
              -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
              -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
              -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID"
          done

      - name: Upload full regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-regression-reports
          path: |
            **/target/surefire-reports/

      - name: Upload production runtime provenance and process diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-runtime-provenance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pangrova-ai-fixture.json
            ${{ runner.temp }}/pangrova-local-runtime.*/runtime.sha256
            ${{ runner.temp }}/pangrova-local-runtime.*/image-provenance.properties
            /tmp/pangrova-local-process-*/*.log

  worker-files:
    name: Verify 5 GiB HTTP transfer and authorization on Temurin 17
    if: inputs.probe == 'worker-files'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: ./.github/actions/setup-iceberg-sdk
      - name: Run file transfer and authorization tests
        run: |
          cat >"$RUNNER_TEMP/maven-global.xml" <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          XML
          mvn -B -C --global-settings "$RUNNER_TEMP/maven-global.xml" \
            -Pfull-regression -pl :pangrova-worker -am \
            -Dtest=FileSpaceLargeObjectIntegrationTest,FileTransferDeadlineTest,FileSpaceFileResourceTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload file test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-file-surefire-reports
          path: pangrova-worker/target/surefire-reports/

  java-daily:
    name: Java Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    if: inputs.probe == 'java-daily'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      NATIVE_LIB_DIR: ${{ github.workspace }}/pangrova-worker-native/build
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the primary build target. JDK 21 runs in CI to catch
        # incompatibilities (e.g., new strong-encapsulation defaults, removed
        # APIs) before we promote 21 to the primary target.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f0cdbaae4747fc6338e654353efdeb26e5458c70
          fetch-depth: 2
      - name: Check the validated source revision
        run: |
          test "$(git rev-parse HEAD)" = f0cdbaae4747fc6338e654353efdeb26e5458c70
          git diff --exit-code 80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0 HEAD -- . ':!**/src/test/**'

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download native library (for java.library.path fallback)
        uses: actions/download-artifact@v8
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Download classifier JAR
        uses: actions/download-artifact@v8
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Download the tested Java Native fixture
        uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-test-download
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Restore executable test runtime
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/java-native-test-runtime.XXXXXXXX")
          tar -xzf "$RUNNER_TEMP/java-native-test-download/java-native-test-runtime.tar.gz" -C "$runtime_dir"
          test -x "$runtime_dir/pangrova_lance_fixture_tool"
          test -x "$runtime_dir/libexec/pangrova_lance_fixture_tool"
          echo "PANGROVA_JAVA_NATIVE_TEST_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

      - name: Verify artifacts
        run: |
          ls -la ${{ env.NATIVE_LIB_DIR }}/libpangrova_native.*
          ls -la native-bundle-jar/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Download the tested Iceberg SDK
        uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Compile and run daily filtered tests
        run: |
          export LD_LIBRARY_PATH="$NATIVE_LIB_DIR:$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/lib"
          mvn -B verify -Pnative-runtime -pl '!pangrova-native-bundle' \
            -Djava.library.path="$NATIVE_LIB_DIR" \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool"

      - name: Upload Java regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-daily-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/'

  libunwind:
    name: Production libunwind PIC link (${{ matrix.platform.arch }})
    if: inputs.probe == 'libunwind'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4aa0e5c87377b0a502dd4d12159cef8f70a879da
          fetch-depth: 3
      - name: Compile and link the pinned archives
        run: |
          git show 80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0:deploy/docker/build-static-libunwind.sh >"$RUNNER_TEMP/original-libunwind.sh"
          docker run --rm -i --platform linux/${{ matrix.platform.arch }} \
            -v "$RUNNER_TEMP/original-libunwind.sh:/original.sh:ro" \
            -v "$GITHUB_WORKSPACE/deploy/docker/build-static-libunwind.sh:/fixed.sh:ro" \
            ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 \
            bash -euo pipefail <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gcc-11 make libc6-dev binutils zlib1g-dev liblzma-dev curl ca-certificates >/tmp/apt.log
          export CC=gcc-11 CMAKE_BUILD_PARALLEL_LEVEL=2
          uname -m
          if [[ "$(uname -m)" == x86_64 ]]; then
            if PANGROVA_DEPS_PREFIX=/tmp/original bash /original.sh >/tmp/original.log 2>&1; then
              echo 'Expected the original link to fail' >&2
              exit 1
            fi
            grep 'undefined reference.*_Ux86_64_setcontext' /tmp/original.log
          fi
          PANGROVA_DEPS_PREFIX=/tmp/fixed bash /fixed.sh >/tmp/fixed.log 2>&1 || {
            tail -n 35 /tmp/fixed.log
            exit 1
          }
          echo 'Production PIC link passed'
          BASH
