name: Native dependency baseline

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Isolated CI stage to verify
        type: choice
        options: [macos-docker, macos-intel-docker, production, worker-files, java-daily, libunwind, ai-fixture, jmh-relative, tpc-transport, macos-libcxx, production-pic, system-pic, system-rebuild, metadata-regression, macos-arm-crash, macos-arm-acceptance, latency-fixture, chaos-completion]
        default: macos-docker
      production_source:
        description: Exact production source revision
        type: string

permissions:
  contents: read
  actions: read

jobs:
  latency-fixture:
    name: Verify isolated SQL latency fixtures after real routing writes
    if: inputs.probe == 'latency-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ inputs.production_source }}
      NATIVE_SOURCE: b0cd3a5c1b32ecb1407a2edaeb6b0101b142e73d
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
          fetch-depth: 3
      - name: Verify the exact test source and unchanged Linux Native inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code "$NATIVE_SOURCE" HEAD -- pangrova-protocol
          diff -u <(printf '%s\n' pangrova-worker-native/bin/setup-native-build-env.sh \
            pangrova-worker-native/dependency-versions.txt) \
            <(git diff --name-only "$NATIVE_SOURCE" HEAD -- pangrova-worker-native)
          diff -u <(git show "$NATIVE_SOURCE:pangrova-worker-native/dependency-versions.txt" \
            | grep -v '^PANGROVA_DEPENDENCY_BUILD=') \
            <(grep -v '^PANGROVA_DEPENDENCY_BUILD=' pangrova-worker-native/dependency-versions.txt)
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '46081052009'
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: native-bundle-linux-x86_64
          path: ${{ runner.temp }}/native-bundle
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-tool
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - name: Install the verified artifacts
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg" "$RUNNER_TEMP/java-native-tool/runtime"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"
          tar -xzf "$RUNNER_TEMP/java-native-tool/java-native-test-runtime.tar.gz" -C "$RUNNER_TEMP/java-native-tool/runtime"
          jar=$(ls "$RUNNER_TEMP/native-bundle"/pangrova-native-bundle-*-linux-x86_64.jar)
          mvn -B install:install-file -Dfile="$jar" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64 -Dpackaging=jar
      - name: Prepare the real AI dependency of the shared test runtime
        run: |
          docker pull ollama/ollama:0.6.2
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$RUNNER_TEMP/latency-ai.json"
      - name: Run routing writes followed by every SQL latency gate
        run: |
          tool="$RUNNER_TEMP/java-native-tool/runtime"
          export LD_LIBRARY_PATH="$tool/lib"
          export PANGROVA_E2E_FILE_CAPABILITY_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$PANGROVA_E2E_FILE_CAPABILITY_KEY"
          ai_image=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$RUNNER_TEMP/latency-ai.json")
          mvn -B -Pnative-runtime,full-regression -am \
            -pl pangrova-testing/pangrova-testing-integration-tests,'!pangrova-native-bundle' verify \
            -Dtest=VirtualWorkerQueryRoutingIntegrationTest,SqlLatencyBaselineTest \
            -Dsurefire.runOrder=reversealphabetical -Dsurefire.failIfNoSpecifiedTests=false \
            "-Dpangrova.lance.fixture.tool=$tool/pangrova_lance_fixture_tool" \
            "-Dpangrova.e2e.ai.image-id=$ai_image"

  macos-arm-crash:
    name: Verify ARM64 Native runtime with the archived SDK
    if: inputs.probe == 'macos-arm-crash' || inputs.probe == 'macos-arm-acceptance'
    runs-on: macos-15
    timeout-minutes: 230
    env:
      ORIGINAL_BUILD: b470b54b75bc6caeb7ca4dfa91a5926350593eea
      ORIGINAL_RUN: '45963319376'
      SOURCE_COMMIT: ${{ inputs.production_source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b470b54b75bc6caeb7ca4dfa91a5926350593eea
      - name: Verify the archived build identity
        run: |
          test "$(git rev-parse HEAD)" = "$ORIGINAL_BUILD"
          test "$(uname -m)" = arm64
          uname -a
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-native-build
      - uses: ./.github/actions/setup-macos-native-cache
      - uses: actions/download-artifact@v8
        with:
          name: macos-sdk-osx-aarch_64
          path: ${{ runner.temp }}/archived-sdk
          github-token: ${{ github.token }}
          run-id: '45963319376'
          digest-mismatch: error
      - name: Restore the SDK from the failed run with its own provenance
        run: |
          GITHUB_RUN_ID="$ORIGINAL_RUN" GITHUB_SHA="$ORIGINAL_BUILD" \
            bash .pangrova/scripts/macos-native-stage.sh restore sdk "$RUNNER_TEMP/archived-sdk"
          SKIP_DEPS=1 SKIP_VELOX=1 bash pangrova-worker-native/bin/setup-native-build-env.sh
          bash pangrova-worker-native/bin/build-lance-ffi.sh
      - name: Build the actual Native implementation with the affected test suites
        if: inputs.probe == 'macos-arm-crash'
        working-directory: pangrova-worker-native
        run: |
          set -eo pipefail
          source ~/.pangrova/env.sh
          mkdir -p "$RUNNER_TEMP/native-crash-diagnostics"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CMakeLists.txt")
          source = path.read_text()
          collection = 'file(GLOB_RECURSE TEST_SOURCES CONFIGURE_DEPENDS\n    "${CMAKE_CURRENT_SOURCE_DIR}/test/*.cpp")'
          assert source.count(collection) == 1
          files = [
              "TestMain.cpp",
              "engine/delete/DeleteFileReaderTest.cpp",
              "engine/result/ResultFlightStreamTest.cpp",
              "engine/velox/FilteredArtifactRetrievalExecutionTest.cpp",
              "engine/velox/HashJoinScanFilterTest.cpp",
              "engine/velox/NativeDynamicFilterReceptionTest.cpp",
              "engine/velox/NullAwareMarkExecutionTest.cpp",
              "engine/velox/exchange/NativeExchangeDataPlaneE2ETest.cpp",
              "jni/RuntimeInitializerTest.cpp",
          ]
          assert all(Path("test", name).is_file() for name in files)
          replacement = 'set(TEST_SOURCES\n' + '\n'.join('    "${CMAKE_CURRENT_SOURCE_DIR}/test/' + name + '"' for name in files) + ')'
          path.write_text(source.replace(collection, replacement))
          PY
          cmake --preset dev-release -G Ninja
          cmake --build build --parallel 2 --target pangrova_native_tests
          cp build/compile_commands.json "$RUNNER_TEMP/native-crash-diagnostics/product-compile-commands.json"
          cp "$VELOX_BUILD_DIR/CMakeCache.txt" "$RUNNER_TEMP/native-crash-diagnostics/velox-cmake-cache.txt"
          otool -L build/pangrova_native_tests
      - name: Capture representative crash stacks and compare Mach-O visibility
        if: inputs.probe == 'macos-arm-crash'
        working-directory: pangrova-worker-native
        run: |
          set -eo pipefail
          source ~/.pangrova/env.sh
          cat > "$RUNNER_TEMP/run-crash-probe.py" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          cases = [
              "DeleteFileReaderTest.ScanKeepsPhysicalPositionsBeforePredicateFiltering",
              "ResultFlightStreamTest.SignedFlightClaimsOnlyAnAlreadyReadableRegistration",
              "ResultFlightStreamTest.ActualFlightCancellationWakesPendingReadAndRetiresItsLease",
              "FilteredArtifactRetrievalExecutionTest.ActualDictionaryParquetFilterAndHydrationPreserveEligibleRows",
              "HashJoinScanFilterTest.ActualBuildFiltersOnlyItsInnerProbeScan",
              "NullAwareMarkExecutionTest.BuilderAndSerdeKeepTheSameActualThreeValuedExecution",
              "NativeExchangeDataPlaneE2ETest.PublishedBuildFiltersTheLocalJoinProbe",
              "NativeExchangeDataPlaneE2ETest.CancellingOneFlightSourceKeepsTheSharedPeerStreamAlive",
              "RuntimeInitializerTest.CachedPhysicalFilesRetainDistinctLiveIdentifiersAndValues",
              "DynamicFilterReception/NativeDynamicFilterReceptionTest.AddDynamicFilterReceivesFilter/Varchar_Card100",
          ]
          exe = Path("build/pangrova_native_tests").resolve()
          logdir = Path(os.environ["RUNNER_TEMP"], "native-crash-diagnostics")
          variant, = sys.argv[1:]
          failures = 0
          for index, case in enumerate(cases):
              arg = "--gtest_filter=" + case
              run = subprocess.run([exe, arg], capture_output=True, timeout=50, text=True, errors="replace")
              print(variant, run.returncode, case, flush=True)
              (logdir / f"{variant}-{index}.log").write_text(run.stdout + run.stderr)
              if run.returncode != 0 or "[  PASSED  ] 1 test." not in run.stdout:
                  failures += 1
                  debugger = ["xcrun", "lldb", "-b", "-o", "settings set target.disable-aslr false",
                              "-o", "run", "-k", "thread backtrace all", "-o", "thread backtrace all",
                              "--", exe, arg]
                  with (logdir / f"{variant}-{index}.lldb.log").open("w") as stack:
                      try:
                          subprocess.run(debugger, stdout=stack, stderr=subprocess.STDOUT, timeout=55)
                      except subprocess.TimeoutExpired:
                          stack.write("Debugger exceeded its diagnostic budget\n")
          print(f"{variant}: {failures} of {len(cases)} unusable", flush=True)
          (logdir / f"{variant}.result").write_text(str(failures))
          PY
          python3 "$RUNNER_TEMP/run-crash-probe.py" standard
          cmake --preset dev-release -G Ninja \
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-exported_symbols_list,$PWD/test_asan_exported_symbols_macos.list"
          cmake --build build --parallel 2 --target pangrova_native_tests
          python3 "$RUNNER_TEMP/run-crash-probe.py" private
      - name: Rebuild the archived Folly source with the Release profile
        working-directory: pangrova-worker-native
        run: |
          set -eo pipefail
          source ~/.pangrova/env.sh
          mkdir -p "$RUNNER_TEMP/native-crash-diagnostics"
          folly_source="$VELOX_HOME/deps-download/folly"
          folly_build="$RUNNER_TEMP/release-folly"
          folly_archive="$VELOX_HOME/deps-install/lib/libfolly.a"
          cp "$folly_source/_build/CMakeCache.txt" "$RUNNER_TEMP/native-crash-diagnostics/original-folly-cache.txt"
          cmake -S "$folly_source" -B "$folly_build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_PREFIX_PATH=$VELOX_HOME/deps-install;$(brew --prefix libevent);$(brew --prefix)" \
            "-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR" \
            "-DCMAKE_CXX_FLAGS=-mcpu=apple-m1+crc -isystem $(brew --prefix)/include" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DFOLLY_HAVE_INT128_T=ON -DGFLAGS_SHARED=FALSE
          cmake --build "$folly_build" --target folly --parallel 2
          test -s "$folly_build/libfolly.a"
          cp "$folly_build/CMakeCache.txt" "$RUNNER_TEMP/native-crash-diagnostics/release-folly-cache.txt"
          cp "$folly_build/libfolly.a" "$folly_archive"
      - name: Measure Release Folly against the original link inputs
        if: inputs.probe == 'macos-arm-crash'
        working-directory: pangrova-worker-native
        run: |
          set -eo pipefail
          source ~/.pangrova/env.sh
          cmake --preset dev-release -G Ninja -DCMAKE_EXE_LINKER_FLAGS=
          cmake --build build --parallel 2 --target pangrova_native_tests
          python3 "$RUNNER_TEMP/run-crash-probe.py" release-folly
          test "$(cat "$RUNNER_TEMP/native-crash-diagnostics/standard.result")" -eq 0
      - name: Apply the candidate Thrift selection and fixture startup changes
        if: inputs.probe == 'macos-arm-acceptance'
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth 1 origin "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          for file in \
            pangrova-worker-native/cmake/FindVelox.cmake \
            pangrova-worker-native/bin/run-native-tests.py \
            pangrova-worker-native/test/RunNativeTestsTest.py \
            pangrova-connector/pangrova-connector-lance/src/test/java/org/pangrova/connector/lance/LanceCatalogTestDatabase.java \
            pangrova-connector/pangrova-connector-lance/src/test/java/org/pangrova/connector/lance/LanceManagedSourceFixtureBroker.java; do
            git show "$SOURCE_COMMIT:$file" > "$file"
          done
          git diff --check
      - uses: ./.github/actions/prepare-native-java-fixture
        if: inputs.probe == 'macos-arm-acceptance'
      - name: Build the full Native test executable with the canonical Thrift archive
        if: inputs.probe == 'macos-arm-acceptance'
        working-directory: pangrova-worker-native
        run: |
          set -eo pipefail
          source ~/.pangrova/env.sh
          cmake --preset dev-release -G Ninja
          cmake --build build --parallel 2 --target all
          link_plan="$RUNNER_TEMP/native-crash-diagnostics/native-link.txt"
          ninja -C build -t commands pangrova_native_tests | tail -1 > "$link_plan"
          grep -q 'thrift_ep-install/lib/libthrift.a' "$link_plan"
          if grep -Eq '/lib(transport|thrift[^ .\/]+)\.a' "$link_plan"; then
            exit 1
          fi
      - name: Prepare the same cold Docker endpoint as full macOS CI
        if: inputs.probe == 'macos-arm-acceptance'
        run: bash .pangrova/scripts/setup-macos-native-test-docker.sh
      - name: Run all Native cases against the fresh real PostgreSQL fixture
        if: inputs.probe == 'macos-arm-acceptance'
        working-directory: pangrova-worker-native
        run: |
          python3 bin/run-native-tests.py --prepared-java "$RUNNER_TEMP/native-java-fixture" \
            -- --output-junit test-results.xml
      - name: Diagnose remaining Flight failures in the full executable
        if: failure() && inputs.probe == 'macos-arm-acceptance'
        working-directory: pangrova-worker-native
        run: |
          [[ -s build/test-results.xml ]] || exit 0
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          results = ET.parse("build/test-results.xml")
          directory = Path(os.environ["RUNNER_TEMP"], "native-crash-diagnostics")
          cases = [case.get("name") for case in results.iter("testcase")
                   if case.find("failure") is not None and case.get("name", "").startswith(
                      ("ResultFlightStreamTest.", "NativeExchangeDataPlaneE2ETest."))]
          for name in cases:
              with (directory / (name + ".lldb.log")).open("w") as output:
                  command = ["xcrun", "lldb", "-b", "-o", "settings set target.disable-aslr false",
                             "-o", "run", "-k", "thread backtrace all", "-o", "thread backtrace all",
                             "--", "build/pangrova_native_tests", "--gtest_filter=" + name]
                  try:
                      subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=35)
                  except subprocess.TimeoutExpired:
                      output.write("Debugger exceeded its diagnostic budget\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archived-macos-arm-crash-diagnostics
          path: |
            ${{ runner.temp }}/native-crash-diagnostics/
            pangrova-worker-native/build/test-results.xml
            pangrova-worker-native/build/Testing/LanceFixture/*/*.log

  metadata-regression:
    name: Verify rollback, UTF-8 plans and Arrow metadata on the exact repaired source
    if: inputs.probe == 'metadata-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: ${{ inputs.production_source }}
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
      - name: Require the requested commit
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: 46034791345
          digest-mismatch: error
      - name: Install the verified Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"
      - name: Run the rollback, planner and control-plane result cases
        run: |
          mvn -B -Pfull-regression -am test \
            -pl pangrova-metadata/pangrova-metadata-catalog,pangrova-planner,pangrova-coordination/pangrova-coordination-control \
            '-Dtest=PostgresGenerationStageExchangeStoreTest#failedPartitionClaimRestoresAttemptAndPreservesPrimary,TpchPlanStabilityTest,TpcdsPlanStabilityTest,JoinAlgorithmEligibilityTest,PangrovaPlannerTest,MetadataStoreShowResultSchemaIntegrationTest,MetadataShowResultSchemaTest,CoordinatorResultWriterTest,CoordinatorResultServiceTest,IndexDdlReadAuthorizationTest,StatementResultPropertyTest' \
            -Dsurefire.failIfNoSpecifiedTests=false

  system-rebuild:
    name: Rebuild and select exact Ubuntu PIC source packages
    if: inputs.probe == 'system-rebuild'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Build the same archives and verify production CMake selects them
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/source:ro" \
            ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 \
            bash -euo pipefail -s <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential gcc-11 g++-11 lld \
            ninja-build python3-pip curl ca-certificates pkg-config xz-utils autoconf automake libtool \
            libbz2-dev liblzma-dev zlib1g-dev libevent-dev libsnappy-dev libdouble-conversion-dev \
            libsodium-dev libxml2-dev liblz4-dev libzstd-dev libxxhash-dev libicu-dev libssl-dev
          python3 -m pip install --no-cache-dir --only-binary=:all: cmake==3.28.3
          export CC=gcc-11 CXX=g++-11 CMAKE_BUILD_PARALLEL_LEVEL=2
          export PANGROVA_DEPS_PREFIX=/opt/pangrova-production/native-deps
          version_map=/source/pangrova-worker-native/jni_exported_symbols.map
          bash /source/deploy/docker/build-static-system-deps.sh "$version_map"
          bash /source/deploy/docker/build-static-curl.sh
          export PKG_CONFIG_PATH="$PANGROVA_DEPS_PREFIX/lib/pkgconfig"

          mkdir /tmp/cmake-probe
          cd /tmp/cmake-probe
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(SystemPIC LANGUAGES CXX)
          set(PANGROVA_PRODUCTION_BUILD ON)
          set(CMAKE_FIND_LIBRARY_SUFFIXES .a)
          set(CMAKE_SKIP_RPATH TRUE)
          add_library(velox_imported INTERFACE)
          target_link_libraries(velox_imported INTERFACE "-Wl,--start-group")
          include(/source/pangrova-worker-native/cmake/PangrovaSystemDeps.cmake)
          target_link_libraries(velox_imported INTERFACE "-Wl,--end-group")
          add_library(system_check SHARED check.cpp)
          target_link_libraries(system_check PRIVATE velox_imported)
          target_link_options(system_check PRIVATE -Wl,-z,defs,-z,text
            -Wl,--version-script=/source/pangrova-worker-native/jni_exported_symbols.map)
          CMAKE
          cat > check.cpp <<'CPP'
          #include <bzlib.h>
          #include <zstd.h>
          #include <event2/event.h>
          #include <libxml/parser.h>
          #include <unicode/uclean.h>
          extern "C" int JNI_OnLoad(void*, void*) {
              auto* base = event_base_new();
              xmlInitParser();
              UErrorCode status = U_ZERO_ERROR;
              u_init(&status);
              const bool usable = base && BZ2_bzlibVersion() && ZSTD_versionNumber() && U_SUCCESS(status);
              event_base_free(base);
              return usable ? 0x00010008 : 0;
          }
          CPP
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$PANGROVA_DEPS_PREFIX"
          cmake --build build --verbose
          for archive in bz2 zstd event_core icuuc xml2; do
            grep -F "$PANGROVA_DEPS_PREFIX/lib/lib$archive.a" build/CMakeFiles/system_check.dir/link.txt
          done
          readelf -d build/libsystem_check.so
          python3 -c 'import ctypes; library=ctypes.CDLL("./build/libsystem_check.so"); assert library.JNI_OnLoad(None, None)==0x00010008'
          BASH

  system-pic:
    name: Link production system archives with the JNI export map
    if: inputs.probe == 'system-pic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Audit source packages with production symbol visibility
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/source:ro" \
            ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 \
            bash -euo pipefail -s <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends g++-11 lld binutils \
            libbz2-dev liblzma-dev zlib1g-dev libevent-dev libsnappy-dev libdouble-conversion-dev \
            libsodium-dev libxml2-dev liblz4-dev libzstd-dev libxxhash-dev libicu-dev libssl-dev
          dpkg-query -W -f='${Package} ${source:Package} ${source:Version}\n' \
            libbz2-dev liblzma-dev zlib1g-dev libevent-dev libsnappy-dev libdouble-conversion-dev \
            libsodium-dev libxml2-dev liblz4-dev libzstd-dev libxxhash-dev libicu-dev libssl-dev
          multiarch=$(g++-11 -dumpmachine)
          linker=()
          if [[ "$multiarch" == aarch64-* ]]; then linker=(-fuse-ld=lld); fi
          version_map=/source/pangrova-worker-native/jni_exported_symbols.map
          link_archives() {
            archives=()
            for name in "$@"; do archives+=("/usr/lib/$multiarch/lib$name.a"); done
            g++-11 "${linker[@]}" -shared -Wl,-z,defs,-z,text -Wl,--version-script="$version_map" \
              -Wl,--whole-archive "${archives[@]}" -Wl,--no-whole-archive -pthread -lm -ldl -lrt \
              -o /tmp/system-pic-check.so 2>&1 | tee /tmp/system-pic-errors
          }
          failure=0
          for group in 'bz2' 'z' 'lzma' 'lz4' 'zstd' 'xxhash' 'snappy' 'double-conversion' 'sodium' \
            'ssl crypto z' 'event_core event_extra event_openssl event_pthreads ssl crypto z' \
            'icui18n icuuc icudata' 'xml2 icui18n icuuc icudata z lzma'; do
            read -r -a components <<< "$group"
            if link_archives "${components[@]}" >/dev/null; then
              echo "PASS $group"
            else
              echo "FAIL $group"
              head -12 /tmp/system-pic-errors
              failure=1
            fi
          done
          exit "$failure"
          BASH

  production-pic:
    name: Audit production PIC archives
    if: inputs.probe == 'production-pic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Verify actual Boost and curl shared-library links
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/source:ro" \
            ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 \
            bash -euo pipefail -s <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential gcc-11 g++-11 ninja-build \
            python3-pip sudo git curl ca-certificates pkg-config xz-utils libssl-dev zlib1g-dev \
            libbz2-dev liblzma-dev libevent-dev libsnappy-dev libdouble-conversion-dev \
            libsodium-dev libxml2-dev liblz4-dev libzstd-dev libxxhash-dev libicu-dev
          python3 -m pip install --no-cache-dir --only-binary=:all: cmake==3.28.3
          export CC=gcc-11 CXX=g++-11 BUILD_THREADS=2 CMAKE_BUILD_PARALLEL_LEVEL=2
          git -c http.version=HTTP/1.1 clone --depth 1 --branch v2026.04.17.00 \
            https://github.com/facebookincubator/velox.git /tmp/velox
          cd /tmp/velox
          git apply --check /source/pangrova-worker-native/patches/velox-linux-production-pic-boost.patch
          git apply /source/pangrova-worker-native/patches/velox-linux-production-pic-boost.patch
          scripts/setup-ubuntu.sh install_boost
          boost_lib=/usr/local/lib
          "$CXX" -shared -Wl,-z,defs,-z,text -Wl,--whole-archive \
            "$boost_lib/libboost_filesystem.a" "$boost_lib/libboost_atomic.a" \
            -Wl,--no-whole-archive -pthread -o /tmp/boost-pic-check.so
          echo 'Pinned Boost static PIC shared link passed'
          export PANGROVA_DEPS_PREFIX=/opt/pangrova-production/native-deps
          bash /source/deploy/docker/build-static-curl.sh
          echo 'Pinned curl static PIC shared link passed'
          multiarch=$("$CC" -dumpmachine)
          failure=0
          for name in bz2 lzma z event_core event_extra event_openssl event_pthreads snappy \
            double-conversion sodium xml2 lz4 zstd xxhash ssl crypto icui18n icuuc icudata; do
            archive="/usr/lib/$multiarch/lib$name.a"
            test -f "$archive"
            if "$CXX" -shared -Wl,-z,text -Wl,--whole-archive "$archive" \
                -Wl,--no-whole-archive -o /tmp/system-pic-check.so; then
              printf 'System archive PIC link passed %s\n' "$archive"
            else
              failure=1
            fi
          done
          exit "$failure"
          BASH

  macos-libcxx:
    name: Verify macOS libc++ exception ABI
    if: inputs.probe == 'macos-libcxx'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - name: Reproduce exception linkage and verify deployment target
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/libcxx-probe.XXXXXXXX")
          cxx="$(brew --prefix llvm@18)/bin/clang++"
          "$cxx" --version
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDK=%s\n' "$SDKROOT"
          cat > "$work/exception.cpp" <<'CPP'
          #include <future>
          #include <stdexcept>
          int main() {
              std::promise<int> promise;
              auto result = promise.get_future();
              promise.set_exception(std::make_exception_ptr(std::runtime_error("expected")));
              try { return result.get(); }
              catch (const std::runtime_error&) { return 0; }
          }
          CPP
          unset MACOSX_DEPLOYMENT_TARGET
          "$cxx" -isysroot "$SDKROOT" -std=c++20 -O2 -c "$work/exception.cpp" -o "$work/default.o"
          nm -u "$work/default.o"
          if "$cxx" -isysroot "$SDKROOT" "$work/default.o" -o "$work/default"; then
            "$work/default"
          else
            printf 'Default deployment target reproduced an exception link failure\n'
          fi
          export MACOSX_DEPLOYMENT_TARGET=13.0
          "$cxx" -isysroot "$SDKROOT" -std=c++20 -O2 -c "$work/exception.cpp" -o "$work/compatible.o"
          nm -u "$work/compatible.o" > "$work/symbols"
          cat "$work/symbols"
          if grep -E '__cxa_init_primary_exception|__from_native_exception_pointer' "$work/symbols"; then
            printf 'Changing the deployment target alone retained the newer exception symbols\n'
          fi
          if "$cxx" -isysroot "$SDKROOT" "$work/compatible.o" -o "$work/compatible"; then
            "$work/compatible"
          fi
          "$cxx" -isysroot "$SDKROOT" -nostdinc++ -isystem "$SDKROOT/usr/include/c++/v1" \
            -std=c++20 -O2 -c "$work/exception.cpp" -o "$work/sdk-libcxx.o"
          nm -u "$work/sdk-libcxx.o" > "$work/sdk-symbols"
          cat "$work/sdk-symbols"
          if grep -E '__cxa_init_primary_exception|__from_native_exception_pointer' "$work/sdk-symbols"; then
            exit 1
          fi
          "$cxx" -isysroot "$SDKROOT" "$work/sdk-libcxx.o" -o "$work/sdk-libcxx"
          "$work/sdk-libcxx"
          xcrun vtool -show-build "$work/sdk-libcxx"

  tpc-transport:
    name: Verify TPC workload contracts and real client transport
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: inputs.probe == 'tpc-transport'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      PANGROVA_CANDIDATE_SHA: ${{ inputs.production_source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build the same-source CLI
        run: |
          test "$(git rev-parse HEAD)" = "$PANGROVA_CANDIDATE_SHA"
          mvn -B package -pl pangrova-client/pangrova-client-cli -am -DskipTests -Dmaven.test.skip=true
      - name: Install pinned benchmark tooling
        run: python -m pip install -r pangrova-testing/pangrova-testing-benchmark/requirements.txt
      - name: Verify complete workloads, real Parquet conversion, runner and comparison contracts
        run: python -m unittest discover -s pangrova-testing/pangrova-testing-benchmark/scripts/tests -v
      - name: Verify persistent production client over real HTTP and Flight transport
        run: >-
          python pangrova-testing/pangrova-testing-benchmark/scripts/integration/test_persistent_transport.py
          --classpath pangrova-client/pangrova-client-cli/target/pangrova-client-cli-0.1.0-SNAPSHOT-exec.jar

  jmh-relative:
    name: JMH comparison on a single runner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: inputs.probe == 'jmh-relative'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      PANGROVA_CANDIDATE_SHA: ${{ inputs.production_source }}
      PANGROVA_BASE_SHA: 46cc8ba23eccf4b17f048bfe691519ab5d99467f
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
      - name: Check out the exact pull request base
        uses: actions/checkout@v7
        with:
          ref: 46cc8ba23eccf4b17f048bfe691519ab5d99467f
          path: jmh-base

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Build JMH harnesses for the base and candidate
        run: |
          [[ "$(git -C jmh-base rev-parse HEAD)" == "$PANGROVA_BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$PANGROVA_CANDIDATE_SHA" ]]
          benchmark_args=(-B package -pl pangrova-testing/pangrova-testing-benchmark -am
                          -DskipTests -Dmaven.test.skip=true)
          (cd jmh-base && mvn "${benchmark_args[@]}")
          mvn "${benchmark_args[@]}"

      - name: Measure the base and candidate on the same runner
        run: |
          jar=pangrova-testing/pangrova-testing-benchmark/target/pangrova-benchmarks.jar
          mkdir -p target/jmh
          printf 'base=%s\ncandidate=%s\n' "$(git -C jmh-base rev-parse HEAD)" "$PANGROVA_CANDIDATE_SHA" \
            > target/jmh/revisions.txt
          measure() {
            java --add-opens=java.base/java.nio=ALL-UNNAMED -jar "$1" \
              -f 2 -wi 2 -i 3 -t 1 -foe true -jvmArgsAppend '-Xms512m -Xmx512m' \
              -rf json -rff "target/jmh/$2.json"
          }
          measure "jmh-base/$jar" base
          measure "$jar" candidate

      - name: Check for regressions (>10% = fail)
        run: |
          bash pangrova-testing/pangrova-testing-benchmark/scripts/jmh-regression-check.sh \
            target/jmh/candidate.json target/jmh/base.json 0.10

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-benchmark-results
          path: target/jmh/
          retention-days: 30

  ai-fixture:
    if: inputs.probe == 'ai-fixture'
    name: Prepare and validate the real offline AI fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4aa0e5c87377b0a502dd4d12159cef8f70a879da
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          cat "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          docker run --rm -d --network none --name pangrova-ai-probe "$image_id" serve
          trap 'docker logs pangrova-ai-probe; docker stop pangrova-ai-probe' EXIT
          for attempt in $(seq 1 30); do
            if docker exec pangrova-ai-probe ollama list; then break; fi
            sleep 1
          done
          docker exec -e OLLAMA_NOHISTORY=1 pangrova-ai-probe ollama run tinyllama:latest "Say hello in one sentence."
          docker exec pangrova-ai-probe ollama list | grep -F all-minilm:latest

  macos-docker:
    if: inputs.probe == 'macos-docker' || inputs.probe == 'macos-intel-docker'
    name: Verify native macOS Docker
    runs-on: ${{ inputs.probe == 'macos-intel-docker' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Start the CI Docker endpoint
        run: bash .pangrova/scripts/setup-macos-native-test-docker.sh
      - name: Run PostgreSQL and verify the published port
        env:
          DOCKER_API_VERSION: '1.44'
        run: |
          command -v docker >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install docker
          docker info
          docker run --rm -d --name pangrova-ci-probe -e POSTGRES_PASSWORD=probe \
            -p 127.0.0.1::5432 postgres:16-alpine
          trap 'docker logs pangrova-ci-probe; docker stop pangrova-ci-probe || true' EXIT
          port=$(docker port pangrova-ci-probe 5432/tcp | cut -d: -f2)
          for attempt in $(seq 1 60); do
            if docker exec pangrova-ci-probe pg_isready -h 127.0.0.1 &&
                nc -z -G 2 127.0.0.1 "$port"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  chaos-completion:
    name: Verify Flight completion and process failures using archived Linux JNI
    if: inputs.probe == 'chaos-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_SOURCE: ${{ inputs.production_source }}
      RUNTIME_SOURCE: b0cd3a5c1b32ecb1407a2edaeb6b0101b142e73d
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
      - name: Verify test source and the earlier successful Native run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          test "$TEST_SOURCE" = 7c88444a2bb00751813057a856438c2c33187524
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/46064151775" --jq .head_sha)" = "$RUNTIME_SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/140725911731" --jq .conclusion)" = success
          git fetch --depth=1 origin "$RUNTIME_SOURCE"
          git diff --exit-code "$RUNTIME_SOURCE" HEAD -- ':(glob)**/src/main/**' ':(exclude)pangrova-testing/**'
          git worktree add --detach "$RUNNER_TEMP/archived-runtime-source" "$RUNTIME_SOURCE"
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: native-library-linux-x86_64
          path: ${{ runner.temp }}/archived-native
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: native-bundle-linux-x86_64
          path: ${{ runner.temp }}/archived-bundle
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/archived-runtime-download
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - name: Build the role image from its archived matching Linux source and JNI
        run: |
          cd "$RUNNER_TEMP/archived-runtime-source"
          archive="$RUNNER_TEMP/archived-native/libpangrova_native.so"
          test -f "$archive"
          sha256sum "$archive"
          readelf -d "$archive" | grep NEEDED
          runtime="$RUNNER_TEMP/archived-runtime-image"
          mkdir -p "$runtime"
          tar -xzf "$RUNNER_TEMP/archived-runtime-download/java-native-test-runtime.tar.gz" -C "$runtime" ./lib
          LD_LIBRARY_PATH="$runtime/lib" ldd "$archive" | tee "$RUNNER_TEMP/archived-native-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/archived-native-ldd.txt"; then exit 1; fi
          # This is the Native test archive and its matched shared-library closure.
          # Use the package's normal JNI ABI check here. The separate exact-image build retains the production static gate.
          sed -i 's/package-native-lib.sh --production/package-native-lib.sh/' deploy/docker/Dockerfile
          sed -i '/^USER pangrova$/i COPY --from=archived_runtime /lib/ /opt/pangrova/archived-native-libs/' deploy/docker/Dockerfile
          sed -i '/^USER pangrova$/i ENV LD_LIBRARY_PATH=/opt/pangrova/archived-native-libs' deploy/docker/Dockerfile
          if readelf -V "$archive" | grep -E 'Name: GLIBC_2[.](3[6-9]|[4-9][0-9])([[:space:]]|$)' >/dev/null; then
            # The Ubuntu 24.04 Native test runner can use a newer glibc than production Jammy.
            sed -i 's/^FROM eclipse-temurin:17-jre-jammy@sha256:[0-9a-f]*$/FROM eclipse-temurin:17-jre-noble/' deploy/docker/Dockerfile
          fi
          cat > Dockerfile.archived-native <<'DOCKERFILE'
          FROM ubuntu:22.04 AS native-build
          RUN apt-get update && apt-get install -y --no-install-recommends binutils file && rm -rf /var/lib/apt/lists/*
          WORKDIR /workspace
          COPY pangrova-worker-native/ pangrova-worker-native/
          COPY pangrova-protocol/ pangrova-protocol/
          COPY --from=archived_jni /libpangrova_native.so pangrova-worker-native/build/libpangrova_native.so
          DOCKERFILE
          image="pangrova/pangrova:chaos-proof-$GITHUB_RUN_ID"
          IMAGE="$image" SOURCE_COMMIT="$RUNTIME_SOURCE" \
            docker buildx bake --load -f deploy/docker/docker-bake.hcl \
              --allow "fs.read=$RUNNER_TEMP/pangrova-iceberg-sdk" \
              --allow "fs.read=$RUNNER_TEMP/archived-native" \
              --allow "fs.read=$runtime" \
              --set native-build.dockerfile=Dockerfile.archived-native \
              --set "native-build.contexts.archived_jni=$RUNNER_TEMP/archived-native" \
              --set "pangrova.contexts.archived_runtime=$runtime" \
              --set 'pangrova.args.MAVEN_ARGS=-C --global-settings /build/.mvn/ci-settings.xml' \
              --set "pangrova.contexts.iceberg-sdk=$RUNNER_TEMP/pangrova-iceberg-sdk" pangrova
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" = "$RUNTIME_SOURCE"
          echo "PANGROVA_E2E_IMAGE=$image" >> "$GITHUB_ENV"
          echo "PANGROVA_E2E_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Install reactor and run the real restart cases
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"
          bundles=("$RUNNER_TEMP/archived-bundle/"*-linux-x86_64.jar)
          test "${#bundles[@]}" = 1
          mvn -B install:install-file -Dfile="${bundles[0]}" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64 -Dpackaging=jar
          mvn -B -Pnative-runtime -DskipTests install -pl '!pangrova-native-bundle'
          mvn -B -Pnative-runtime,full-regression \
            -pl pangrova-testing/pangrova-testing-integration-tests \
            -Dpangrova.e2e.excludedGroups=none -Dtest=CoordinatorRestartChaosTest test \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID" \
            -Dpangrova.e2e.local.source-commit="$RUNTIME_SOURCE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: process-chaos-completion
          path: '**/target/surefire-reports/*CoordinatorRestartChaosTest*'

  production-regression:
    name: Production image and full regression (JDK 17)
    runs-on: ubuntu-24.04
    if: inputs.probe == 'production'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      PANGROVA_PROBE_SOURCE_SHA: ${{ inputs.production_source }}
      PANGROVA_E2E_IMAGE: pangrova/pangrova:ci-${{ inputs.production_source }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_source }}
      - name: Verify the source and the tested Lance fixture inputs
        run: |
          [[ "$PANGROVA_PROBE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PANGROVA_PROBE_SOURCE_SHA"
          test "$PANGROVA_PROBE_SOURCE_SHA" = 4cc9724a3776eab4b96640e87c3b83608404b825
          tested_ref=b0cd3a5c1b32ecb1407a2edaeb6b0101b142e73d
          git fetch --depth=1 origin "$tested_ref"
          # The Lance fixture links Arrow, canonical protobuf and Lance C FFI.
          # The reviewed FindVelox change only selects the Worker's Thrift archives.
          # Pangrova's production Worker and Velox are rebuilt from HEAD below.
          git diff --exit-code "$tested_ref" HEAD -- pangrova-protocol \
            pangrova-worker-native/CMakeLists.txt pangrova-worker-native/cmake \
            pangrova-worker-native/src pangrova-worker-native/include pangrova-worker-native/test-tools \
            pangrova-worker-native/lance-ffi pangrova-worker-native/tools \
            .pangrova/scripts/stage-java-native-test-runtime.sh \
            pangrova-connector/pangrova-connector-iceberg/patches \
            .pangrova/scripts/build-iceberg-sdk-candidate.sh \
            ':(exclude)pangrova-worker-native/cmake/FindVelox.cmake'
          lock=pangrova-worker-native/dependency-versions.txt
          diff -u <(git show "$tested_ref:$lock" | grep -v '^PANGROVA_DEPENDENCY_BUILD=') \
            <(grep -v '^PANGROVA_DEPENDENCY_BUILD=' "$lock")
          free -h
          df -h /

      - name: Download the tested Java Native fixture
        uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-test-download
          github-token: ${{ github.token }}
          run-id: '46064151775'
          digest-mismatch: error
      - name: Restore executable test runtime
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/java-native-test-runtime.XXXXXXXX")
          tar -xzf "$RUNNER_TEMP/java-native-test-download/java-native-test-runtime.tar.gz" -C "$runtime_dir"
          test -x "$runtime_dir/pangrova_lance_fixture_tool"
          test -x "$runtime_dir/libexec/pangrova_lance_fixture_tool"
          echo "PANGROVA_JAVA_NATIVE_TEST_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download the tested Iceberg SDK
        uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '46095251162'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Build the canonical same-source Linux production image
        run: |
          docker buildx version
          IMAGE="$PANGROVA_E2E_IMAGE" SOURCE_COMMIT="$PANGROVA_PROBE_SOURCE_SHA" \
            docker buildx bake --load -f deploy/docker/docker-bake.hcl \
              --allow "fs.read=$RUNNER_TEMP/pangrova-iceberg-sdk" \
              --set native-build.args.NATIVE_BUILD_JOBS=2 \
              --set 'pangrova.args.MAVEN_ARGS=-C --global-settings /build/.mvn/ci-settings.xml' \
              --set "pangrova.contexts.iceberg-sdk=$RUNNER_TEMP/pangrova-iceberg-sdk" pangrova
          image_id=$(docker image inspect --format '{{.Id}}' "$PANGROVA_E2E_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" == "$PANGROVA_PROBE_SOURCE_SHA" ]]
          echo "PANGROVA_E2E_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Stage the production classifier and matching host JNI
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/pangrova-local-runtime.XXXXXXXX")
          echo "PANGROVA_LOCAL_STAGE=$stage" >> "$GITHUB_ENV"
          bundle=$(bash .pangrova/scripts/stage-production-regression-native.sh \
            "$PANGROVA_E2E_IMAGE_ID" "$stage" "$PANGROVA_PROBE_SOURCE_SHA")
          mvn -B install:install-file -Dfile="$bundle" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64 -Dpackaging=jar

      # Standalone-process tests need the complete reactor installed before tests start.
      - name: Install the complete Java reactor for process tests
        run: mvn -B -Pnative-runtime -DskipTests install -pl '!pangrova-native-bundle'

      - name: Verify real Flight completion through Worker and Coordinator failures
        run: |
          mvn -B -Pnative-runtime,full-regression \
            -pl pangrova-testing/pangrova-testing-integration-tests \
            -Dpangrova.e2e.excludedGroups=none -Dtest=CoordinatorRestartChaosTest test \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID" \
            -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA"

      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          echo "PANGROVA_E2E_AI_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Configure real FILE SQL acceptance
        run: |
          capability_key=$(openssl rand -base64 32)
          echo "::add-mask::$capability_key"
          echo "PANGROVA_E2E_FILE_CAPABILITY_KEY=$capability_key" >> "$GITHUB_ENV"

      - name: Run full regression
        run: |
          mvn -B -Pnative-runtime,full-regression verify -pl '!pangrova-native-bundle' \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
            -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID" \
            -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
            -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
            -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
            -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
            -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA"

      - name: Run isolated Native runtime owner E2E
        run: |
          for suite in WorkerBootstrapE2ETest NativeExchangeTransportExternalIntegrationTest \
                       WorkerShuffleChannelAdmissionIntegrationTest \
                       NativeShuffleEgressContractIntegrationTest \
                       NativeAiFailureProjectionRegistrationTest \
                       WorkerMembershipAdmissionE2ETest \
                       'CopySourceReadHttpE2ETest#privateTicketStagesExactVersionAndRestartsFromManagedBytes' \
                       LocalGovernedFileSqlE2ETest; do
            file_backend=s3
            if [[ "$suite" == LocalGovernedFileSqlE2ETest ]]; then file_backend=local; fi
            mvn -B -Pnative-runtime,full-regression \
              -pl pangrova-testing/pangrova-testing-integration-tests \
              -Dpangrova.e2e.excludedGroups=none -Dtest="$suite" test \
              -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
              -Dpangrova.e2e.file.backend="$file_backend" \
              -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
              -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
              -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
              -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
              -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
              -Dpangrova.e2e.local.source-commit="$PANGROVA_PROBE_SOURCE_SHA" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID"
          done

      - name: Upload full regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-regression-reports
          path: |
            **/target/surefire-reports/

      - name: Upload production runtime provenance and process diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-runtime-provenance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pangrova-ai-fixture.json
            ${{ runner.temp }}/pangrova-local-runtime.*/runtime.sha256
            ${{ runner.temp }}/pangrova-local-runtime.*/image-provenance.properties
            /tmp/pangrova-local-process-*/*.log

  worker-files:
    name: Verify 5 GiB HTTP transfer and authorization on Temurin 17
    if: inputs.probe == 'worker-files'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: ./.github/actions/setup-iceberg-sdk
      - name: Run file transfer and authorization tests
        run: |
          cat >"$RUNNER_TEMP/maven-global.xml" <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          XML
          mvn -B -C --global-settings "$RUNNER_TEMP/maven-global.xml" \
            -Pfull-regression -pl :pangrova-worker -am \
            -Dtest=FileSpaceLargeObjectIntegrationTest,FileTransferDeadlineTest,FileSpaceFileResourceTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload file test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-file-surefire-reports
          path: pangrova-worker/target/surefire-reports/

  java-daily:
    name: Java Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    if: inputs.probe == 'java-daily'
    env:
      MAVEN_ARGS: -C --global-settings ${{ github.workspace }}/.mvn/ci-settings.xml
      NATIVE_LIB_DIR: ${{ github.workspace }}/pangrova-worker-native/build
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the primary build target. JDK 21 runs in CI to catch
        # incompatibilities (e.g., new strong-encapsulation defaults, removed
        # APIs) before we promote 21 to the primary target.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f0cdbaae4747fc6338e654353efdeb26e5458c70
          fetch-depth: 2
      - name: Check the validated source revision
        run: |
          test "$(git rev-parse HEAD)" = f0cdbaae4747fc6338e654353efdeb26e5458c70
          git diff --exit-code 80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0 HEAD -- . ':!**/src/test/**'

      - name: Set up function-contract Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download native library (for java.library.path fallback)
        uses: actions/download-artifact@v8
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Download classifier JAR
        uses: actions/download-artifact@v8
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Download the tested Java Native fixture
        uses: actions/download-artifact@v8
        with:
          name: java-native-test-runtime-linux-x86_64
          path: ${{ runner.temp }}/java-native-test-download
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error

      - name: Restore executable test runtime
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/java-native-test-runtime.XXXXXXXX")
          tar -xzf "$RUNNER_TEMP/java-native-test-download/java-native-test-runtime.tar.gz" -C "$runtime_dir"
          test -x "$runtime_dir/pangrova_lance_fixture_tool"
          test -x "$runtime_dir/libexec/pangrova_lance_fixture_tool"
          echo "PANGROVA_JAVA_NATIVE_TEST_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"

      - name: Verify artifacts
        run: |
          ls -la ${{ env.NATIVE_LIB_DIR }}/libpangrova_native.*
          ls -la native-bundle-jar/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Download the tested Iceberg SDK
        uses: actions/download-artifact@v8
        with:
          name: pinned-iceberg-sdk
          path: ${{ runner.temp }}/pangrova-iceberg-sdk
          github-token: ${{ github.token }}
          run-id: '45906002470'
          digest-mismatch: error
      - name: Install the tested Iceberg SDK
        run: |
          mkdir -p "$HOME/.m2/repository/org/apache/iceberg"
          cp -R "$RUNNER_TEMP/pangrova-iceberg-sdk/org/apache/iceberg/." "$HOME/.m2/repository/org/apache/iceberg/"

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Compile and run daily filtered tests
        run: |
          export LD_LIBRARY_PATH="$NATIVE_LIB_DIR:$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/lib"
          mvn -B verify -Pnative-runtime -pl '!pangrova-native-bundle' \
            -Djava.library.path="$NATIVE_LIB_DIR" \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool"

      - name: Upload Java regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-daily-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/'

  libunwind:
    name: Production libunwind PIC link (${{ matrix.platform.arch }})
    if: inputs.probe == 'libunwind'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4aa0e5c87377b0a502dd4d12159cef8f70a879da
          fetch-depth: 3
      - name: Compile and link the pinned archives
        run: |
          git show 80cbe6b744e19f8a77a8d7bdcb88e6430189c7c0:deploy/docker/build-static-libunwind.sh >"$RUNNER_TEMP/original-libunwind.sh"
          docker run --rm -i --platform linux/${{ matrix.platform.arch }} \
            -v "$RUNNER_TEMP/original-libunwind.sh:/original.sh:ro" \
            -v "$GITHUB_WORKSPACE/deploy/docker/build-static-libunwind.sh:/fixed.sh:ro" \
            ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 \
            bash -euo pipefail <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gcc-11 make libc6-dev binutils zlib1g-dev liblzma-dev curl ca-certificates >/tmp/apt.log
          export CC=gcc-11 CMAKE_BUILD_PARALLEL_LEVEL=2
          uname -m
          if [[ "$(uname -m)" == x86_64 ]]; then
            if PANGROVA_DEPS_PREFIX=/tmp/original bash /original.sh >/tmp/original.log 2>&1; then
              echo 'Expected the original link to fail' >&2
              exit 1
            fi
            grep 'undefined reference.*_Ux86_64_setcontext' /tmp/original.log
          fi
          PANGROVA_DEPS_PREFIX=/tmp/fixed bash /fixed.sh >/tmp/fixed.log 2>&1 || {
            tail -n 35 /tmp/fixed.log
            exit 1
          }
          echo 'Production PIC link passed'
          BASH
