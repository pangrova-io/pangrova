name: Controlled TPC-derived benchmark

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      benchmark:
        description: Workload (engineering suite, not certified TPC scores)
        type: choice
        default: both
        options: [tpch, tpcds, both]
      scale_factor:
        description: Logical scale (TPC-DS SF100 is engineering-only)
        type: choice
        default: '100'
        options: ['100', '1000']
      streams:
        description: Concurrent persistent query streams
        type: choice
        default: '1'
        options: ['1', '4', '5', '7', '8']
      profile:
        description: Ordinary three-window suite or expensive strict TPC-H tail experiment
        type: choice
        default: ordinary
        options: [ordinary, tail]

# One exclusive hardware lease across both benchmarks and manual/scheduled runs.
concurrency:
  group: pangrova-exclusive-tpc-hardware
  cancel-in-progress: false

jobs:
  benchmark:
    # An unattended schedule needs the dedicated fleet and its configuration;
    # without them it would stay queued forever inside the exclusive hardware
    # group. Manual dispatches still run and fail loudly on missing setup.
    if: github.event_name != 'schedule' || vars.TPC_BENCHMARK_CONFIG_DIR != ''
    runs-on: [self-hosted, benchmark, linux, x86_64]
    timeout-minutes: 1440
    env:
      TPC_CONFIG_DIR: ${{ vars.TPC_BENCHMARK_CONFIG_DIR }}
      PANGROVA_BENCHMARK_TOKEN: ${{ secrets.PANGROVA_BENCHMARK_TOKEN }}
      SCALE_FACTOR: ${{ inputs.scale_factor || '100' }}
      STREAMS: ${{ inputs.streams || '1' }}
      BENCHMARK: ${{ inputs.benchmark || 'both' }}
      PROFILE: ${{ inputs.profile || 'ordinary' }}
      PANGROVA_BENCHMARK_IMAGE: pangrova/pangrova:tpc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Validate dedicated-host configuration
        shell: bash
        run: |
          test -n "$TPC_CONFIG_DIR"
          test -f "$TPC_CONFIG_DIR/deployment.json"
          test -f "$TPC_CONFIG_DIR/environment-template.json"
          test -f "$TPC_CONFIG_DIR/catalog-verifier.json"
          python - <<'PYCONFIG'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'pangrova-testing/pangrova-testing-benchmark/scripts')
          from tpc_common import read_json
          root = Path(os.environ['TPC_CONFIG_DIR'])
          template = read_json(root / 'environment-template.json')
          token_env = template['client'].get('tokenEnv')
          if token_env and not os.environ.get(token_env, '').strip():
              raise SystemExit('Benchmark token environment variable is unset')
          selected = ('tpch', 'tpcds') if os.environ['BENCHMARK'] == 'both' else (os.environ['BENCHMARK'],)
          for benchmark in selected:
              for kind in ('binding', 'reference'):
                  if not (root / f"{benchmark}-sf{os.environ['SCALE_FACTOR']}-{kind}.json").is_file():
                      raise SystemExit(f'Missing {benchmark} {kind}; prepare real shared snapshots and references first')
          PYCONFIG
      - name: Install pinned conversion and persistent-client dependencies
        run: python -m pip install -r pangrova-testing/pangrova-testing-benchmark/requirements-clients.txt
      - name: Verify benchmark tools
        run: python -m unittest discover -s pangrova-testing/pangrova-testing-benchmark/scripts/tests -v
      - name: Build the canonical same-source production image
        shell: bash
        run: |
          IMAGE="$PANGROVA_BENCHMARK_IMAGE" SOURCE_COMMIT="$GITHUB_SHA" \
            docker buildx bake --load -f deploy/docker/docker-bake.hcl pangrova
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PANGROVA_BENCHMARK_IMAGE")" = "$GITHUB_SHA"
      - name: Run complete suites sequentially under the exclusive hardware lease
        shell: bash
        run: |
          mkdir -p tpc-results
          failed=0
          for benchmark in tpch tpcds; do
            if [[ "$BENCHMARK" != both && "$BENCHMARK" != "$benchmark" ]]; then
              continue
            fi
            python pangrova-testing/pangrova-testing-benchmark/scripts/run_tpc_job.py \
              --benchmark "$benchmark" --scale-factor "$SCALE_FACTOR" --streams "$STREAMS" \
              --profile "$PROFILE" --config-dir "$TPC_CONFIG_DIR" --data-dir /data/tpc \
              --source-revision "$GITHUB_SHA" --output-dir "tpc-results/$benchmark" || failed=1
          done
          exit "$failed"
      - name: Emergency cleanup for interrupted jobs
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          failed=0
          for state in tpc-results/*/cluster-state.json; do
            python pangrova-testing/pangrova-testing-benchmark/scripts/tpc_cluster.py stop --state "$state" || failed=1
          done
          exit "$failed"
      - name: Retain success, failure, calibration and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tpc-${{ inputs.scale_factor || '100' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tpc-results/**/*.json
            tpc-results/**/*.jsonl
            tpc-results/**/queries/**/*.sql
          if-no-files-found: error
          retention-days: 90
      - name: Publish comparison outcomes
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('# TPC-derived engineering benchmark')
          print('Missing calibration, invalid evidence and cleanup failures are failures, never passing scores.')
          for path in sorted(Path('tpc-results').glob('*/comparison.json')):
              result = json.loads(path.read_text())
              print(f"- {path.parent.name}: {result['status']}")
          PY
