name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_LIB_DIR: ${{ github.workspace }}/pangrova-worker-native/build

jobs:
  native-build:
    name: Native Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            lib-ext: so
            classifier: linux-x86_64
          - name: linux-aarch_64
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            lib-ext: so
            classifier: linux-aarch_64
          - name: osx-x86_64
            runner: macos-13
            os: osx
            arch: x86_64
            lib-ext: dylib
            classifier: osx-x86_64
          - name: osx-aarch_64
            runner: macos-14
            os: osx
            arch: aarch64
            lib-ext: dylib
            classifier: osx-aarch_64
    steps:
      - uses: actions/checkout@v7

      - name: Cache native deps + Velox
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps
            ~/.pangrova/velox
          key: pangrova-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/bin/setup-native-build-env.sh') }}
          restore-keys: |
            pangrova-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Setup native build environment
        run: ./pangrova-worker-native/bin/setup-native-build-env.sh

      - name: CMake configure
        run: |
          source ~/.pangrova/env.sh
          cmake --preset dev-release
        working-directory: pangrova-worker-native

      - name: CMake build
        run: cmake --build build --target all
        working-directory: pangrova-worker-native

      - name: Run native tests (GTest via CTest)
        run: |
          ctest --test-dir build --output-on-failure --output-junit test-results.xml
        working-directory: pangrova-worker-native

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-${{ matrix.platform.name }}
          path: pangrova-worker-native/build/test-results.xml
          retention-days: 7

      - name: Publish native test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Native Tests (${{ matrix.platform.name }})
          path: pangrova-worker-native/build/test-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Verify native library
        run: |
          ls -la build/libpangrova_native.${{ matrix.platform.lib-ext }}
          echo "Native library built successfully"
        working-directory: pangrova-worker-native

      # Stage and build classifier JAR for downstream java-build job
      - name: Stage native library for classifier JAR
        run: |
          RESOURCE_DIR=pangrova-native-bundle/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          mkdir -p "${RESOURCE_DIR}"
          cp pangrova-worker-native/build/libpangrova_native.${{ matrix.platform.lib-ext }} "${RESOURCE_DIR}/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install classifier JAR to local repo
        run: |
          mvn -B install -pl pangrova-native-bundle \
            -Dnative.platform.classifier=${{ matrix.platform.classifier }} \
            -DskipTests

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-library-${{ matrix.platform.name }}
          path: pangrova-worker-native/build/libpangrova_native.*
          retention-days: 1

      - name: Upload classifier JAR
        uses: actions/upload-artifact@v4
        with:
          name: native-bundle-${{ matrix.platform.classifier }}
          path: pangrova-native-bundle/target/pangrova-native-bundle-*-${{ matrix.platform.classifier }}.jar
          retention-days: 1

  java-build:
    name: Java Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the primary build target. JDK 21 runs in CI to catch
        # incompatibilities (e.g., new strong-encapsulation defaults, removed
        # APIs) before we promote 21 to the primary target.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Download native library (for java.library.path fallback)
        uses: actions/download-artifact@v4
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}

      - name: Download classifier JAR
        uses: actions/download-artifact@v4
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar

      - name: Verify artifacts
        run: |
          ls -la ${{ env.NATIVE_LIB_DIR }}/libpangrova_native.*
          ls -la native-bundle-jar/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: SPI annotation gate
        run: |
          chmod +x .pangrova/scripts/check-spi-annotations.sh
          .pangrova/scripts/check-spi-annotations.sh

      - name: Install protoc (for descriptor diff gate)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Proto descriptor diff gate
        run: |
          chmod +x .pangrova/scripts/proto-descriptor-diff.sh
          .pangrova/scripts/proto-descriptor-diff.sh

      - name: Build with Maven
        run: mvn -B clean verify -DskipTests -pl '!pangrova-native-bundle'

      - name: Run Tests
        run: mvn -B verify -Pcoverage -Djava.library.path=${{ env.NATIVE_LIB_DIR }} -pl '!pangrova-native-bundle'
        env:
          LD_LIBRARY_PATH: ${{ env.NATIVE_LIB_DIR }}

      - name: Diff Coverage Gate
        if: github.event_name == 'pull_request' && matrix.java == '17'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          chmod +x .pangrova/scripts/diff-coverage-check.sh
          .pangrova/scripts/diff-coverage-check.sh --threshold 60 --base-ref origin/${{ github.base_ref }}

      - name: Upload Coverage
        if: matrix.java == '17'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  tpch-performance:
    name: TPC-H Performance Regression
    runs-on: ubuntu-latest
    needs: java-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}

      - name: Download classifier JAR
        uses: actions/download-artifact@v4
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Run TPC-H Q1, Q5, Q9 performance tests
        run: |
          mvn -B test \
            -pl pangrova-testing/pangrova-test-e2e \
            -Dgroups=performance \
            -Dtest="SqlLatencyBaselineTest" \
            -Djava.library.path=${{ env.NATIVE_LIB_DIR }} \
            -Dpangrova.benchmark.output=target/tpch-results.json \
            -Dpangrova.benchmark.queries=Q1,Q5,Q9
        env:
          LD_LIBRARY_PATH: ${{ env.NATIVE_LIB_DIR }}
          MAVEN_OPTS: "-Xmx4g"

      - name: Compare against baseline
        run: |
          chmod +x pangrova-testing/pangrova-test-benchmark/scripts/tpch-regression-check.sh
          pangrova-testing/pangrova-test-benchmark/scripts/tpch-regression-check.sh \
            pangrova-testing/pangrova-test-e2e/target/tpch-results.json \
            pangrova-testing/pangrova-test-benchmark/baseline/tpch-performance-baseline.json

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpch-performance-results
          path: pangrova-testing/pangrova-test-e2e/target/tpch-results.json
          retention-days: 30

  native-sanitizers:
    name: Native Sanitizer (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-latest
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: asan
            preset: dev-asan
            env_var: ASAN_OPTIONS
            env_val: "detect_leaks=1:halt_on_error=1:suppressions=sanitizer-suppressions/asan.supp"
          - name: ubsan
            preset: dev-ubsan
            env_var: UBSAN_OPTIONS
            env_val: "halt_on_error=1:print_stacktrace=1:suppressions=sanitizer-suppressions/ubsan.supp"
    steps:
      - uses: actions/checkout@v7

      - name: Cache native deps + Velox
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps
            ~/.pangrova/velox
          key: pangrova-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/bin/setup-native-build-env.sh') }}
          restore-keys: |
            pangrova-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Setup native build environment
        run: ./pangrova-worker-native/bin/setup-native-build-env.sh

      - name: CMake configure (${{ matrix.sanitizer.preset }})
        run: |
          source ~/.pangrova/env.sh
          cmake --preset ${{ matrix.sanitizer.preset }}
        working-directory: pangrova-worker-native

      - name: CMake build
        run: cmake --build build-${{ matrix.sanitizer.name }}
        working-directory: pangrova-worker-native

      - name: Run tests with ${{ matrix.sanitizer.name }}
        run: ctest --test-dir build-${{ matrix.sanitizer.name }} --output-on-failure --timeout 300
        working-directory: pangrova-worker-native
        env:
          ${{ matrix.sanitizer.env_var }}: ${{ matrix.sanitizer.env_val }}

  fuzzer:
    name: Query Fuzzer (60s)
    runs-on: ubuntu-latest
    needs: native-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Build fuzzer
        run: |
          cd pangrova-testing/pangrova-test-fuzzer/src/main/cpp
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run fuzzer (60 seconds)
        run: |
          pangrova-testing/pangrova-test-fuzzer/src/main/cpp/build/pangrova_fuzzer_runner \
            --duration 60 --seed ${{ github.run_id }}

      - name: Upload fuzzer results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-crash-report
          path: pangrova-testing/pangrova-test-fuzzer/src/main/cpp/build/
          retention-days: 7

  jmh-benchmarks:
    name: JMH Micro-Benchmarks
    runs-on: ubuntu-latest
    needs: java-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build benchmark JAR
        run: |
          mvn -B package -pl pangrova-testing/pangrova-test-benchmark -am \
            -DskipTests -Dmaven.test.skip=true

      - name: Run JMH benchmarks (short mode for CI)
        run: |
          java --add-opens=java.base/java.nio=ALL-UNNAMED \
            -jar pangrova-testing/pangrova-test-benchmark/target/pangrova-benchmarks.jar \
            -f 1 -wi 2 -i 3 -t 1 \
            -rf json -rff target/jmh-results.json
        env:
          MAVEN_OPTS: "-Xmx4g"

      - name: Check for regressions (>10% = fail)
        run: |
          chmod +x pangrova-testing/pangrova-test-benchmark/scripts/jmh-regression-check.sh
          pangrova-testing/pangrova-test-benchmark/scripts/jmh-regression-check.sh \
            target/jmh-results.json \
            pangrova-testing/pangrova-test-benchmark/baseline/jmh-baseline.json \
            0.10

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-benchmark-results
          path: target/jmh-results.json
          retention-days: 30

  plan-stability:
    name: Plan Stability Gate
    runs-on: ubuntu-latest
    needs: java-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Extract PR metadata
        run: echo '${{ github.event.pull_request.body }}' > /tmp/pr-body.md
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}

      - name: Download classifier JAR
        uses: actions/download-artifact@v4
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Run plan stability tests (verify golden files match)
        run: |
          mvn -B test -pl pangrova-planner \
            -Dtest="TpcdsPlanStabilityTest" \
            -DfailIfNoTests=false \
            -Djava.library.path=${{ env.NATIVE_LIB_DIR }}
        env:
          LD_LIBRARY_PATH: ${{ env.NATIVE_LIB_DIR }}

      - name: Check plan stability (golden plan diff gate)
        run: |
          chmod +x .pangrova/scripts/plan-stability-check.sh
          .pangrova/scripts/plan-stability-check.sh \
            --base-ref origin/${{ github.base_ref }} \
            --pr-labels "${{ join(github.event.pull_request.labels.*.name, ',') }}" \
            --pr-body-file /tmp/pr-body.md

  distributed-checklist:
    name: Distributed Correctness Checklist
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Extract PR body
        run: echo '${{ github.event.pull_request.body }}' > /tmp/pr-body.md
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Check distributed correctness checklist
        run: |
          chmod +x .pangrova/scripts/distributed-checklist-check.sh
          .pangrova/scripts/distributed-checklist-check.sh \
            --base-ref origin/${{ github.base_ref }} \
            --pr-body-file /tmp/pr-body.md

  dead-stub-detection:
    name: Dead-Stub Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect dead stubs in production code
        run: |
          chmod +x .pangrova/scripts/detect-dead-stubs.sh
          ./.pangrova/scripts/detect-dead-stubs.sh

  doc-consistency:
    name: Documentation-Code Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check BOM dependency usage
        run: ./.pangrova/scripts/check-bom-usage.sh

      - name: Check doc class references
        run: ./.pangrova/scripts/check-doc-class-refs.sh

      - name: Check doc staleness (warning only)
        run: ./.pangrova/scripts/check-doc-staleness.sh

      - name: Check ADR status vs code grep alignment
        run: |
          chmod +x .pangrova/scripts/adr-grep-check.sh
          ./.pangrova/scripts/adr-grep-check.sh

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Guard against root-level build artifacts
        run: |
          VIOLATIONS=""
          for dir in io org build cmake-build-*; do
            if [ -d "$dir" ]; then
              VIOLATIONS="$VIOLATIONS $dir"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Build artifacts leaked into project root:$VIOLATIONS"
            echo "These directories should not exist at the repository root."
            echo "Likely cause: cmake or javac was run from the project root instead of a module directory."
            exit 1
          fi

      - name: Reject contributor-machine paths
        run: ./.pangrova/scripts/check-environment-specific-info.sh

      # patch_flight_types.py rewrites an Arrow header during native dependency
      # setup. Its unit tests are also registered with CTest, but CTest only runs
      # on the native job; running them here keeps them covered on every PR even
      # when the native build is skipped.
      - name: Test patch_flight_types.py
        run: python3 pangrova-worker-native/test/PatchFlightTypesTest.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile (required for SpotBugs bytecode analysis)
        run: mvn -B compile -pl '!pangrova-native-bundle'

      - name: Check Code Style (Checkstyle)
        run: mvn -B checkstyle:check -pl '!pangrova-native-bundle'

      - name: SpotBugs Analysis
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:check -pl '!pangrova-native-bundle'

      - name: Static Analysis (profile gate)
        run: mvn -B verify -Pstatic-analysis -DskipTests -pl '!pangrova-native-bundle'

  archunit:
    name: ArchUnit Wiring Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile all modules
        run: mvn -B compile -pl '!pangrova-native-bundle'

      - name: Run ArchUnit SPI wiring verification
        run: |
          mvn -B test \
            -pl pangrova-testing/pangrova-test-e2e \
            -Dtest="SpiWiringVerificationTest" \
            -DfailIfNoTests=false

      - name: Run ArchUnit bootstrap reachability verification
        run: |
          mvn -B test \
            -pl pangrova-testing/pangrova-test-e2e \
            -Dtest="BootstrapReachabilityTest" \
            -DfailIfNoTests=false
