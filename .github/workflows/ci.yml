name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_LIB_DIR: ${{ github.workspace }}/pangrova-worker-native/build

jobs:
  change-scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime || steps.full.outputs.runtime }}
      native: ${{ steps.scope.outputs.native || steps.full.outputs.native }}
      native_matrix: ${{ steps.scope.outputs.native_matrix || steps.full.outputs.native_matrix }}
      performance: ${{ steps.scope.outputs.performance || steps.full.outputs.performance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine change scope
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .pangrova/scripts/ci_change_scope.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Retain full correctness checks on pushes and release calls
        if: github.event_name != 'pull_request'
        id: full
        run: python3 .pangrova/scripts/ci_change_scope.py --full >> "$GITHUB_OUTPUT"

  native-build:
    name: Native Build (${{ matrix.platform.name }})
    needs: change-scope
    if: needs.change-scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.change-scope.outputs.native_matrix) }}
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: ${{ toJSON(matrix.platform) }}

  java-build:
    name: Java Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the primary build target. JDK 21 runs in CI to catch
        # incompatibilities (e.g., new strong-encapsulation defaults, removed
        # APIs) before we promote 21 to the primary target.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download native library (for java.library.path fallback)
        uses: actions/download-artifact@v8
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}

      - name: Download classifier JAR
        uses: actions/download-artifact@v8
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar

      - uses: ./.github/actions/restore-java-native-test-runtime

      - name: Verify artifacts
        run: |
          ls -la ${{ env.NATIVE_LIB_DIR }}/libpangrova_native.*
          ls -la native-bundle-jar/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Compile and run daily filtered tests
        run: |
          export LD_LIBRARY_PATH="$NATIVE_LIB_DIR:$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/lib"
          mvn -B verify -Pnative-runtime -pl '!pangrova-native-bundle' \
            -Djava.library.path="$NATIVE_LIB_DIR" \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool"

      - name: Retain same-source CLI for benchmark transport checks
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: tpc-client-cli
          path: pangrova-client/pangrova-client-cli/target/pangrova-client-cli-0.1.0-SNAPSHOT-exec.jar
          if-no-files-found: error
          retention-days: 1

  production-regression:
    name: Production image and full regression (JDK 17)
    runs-on: ubuntu-24.04
    needs: [change-scope, native-build, native-sanitizers]
    if: >-
      always() && !cancelled() && needs.change-scope.outputs.runtime == 'true' &&
      needs.native-build.result == 'success' &&
      (needs.native-sanitizers.result == 'success' ||
       (needs.change-scope.outputs.native == 'false' && needs.native-sanitizers.result == 'skipped'))
    env:
      PANGROVA_E2E_IMAGE: pangrova/pangrova:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/restore-java-native-test-runtime

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Build the canonical same-source Linux production image
        run: |
          docker buildx version
          IMAGE="$PANGROVA_E2E_IMAGE" SOURCE_COMMIT="$GITHUB_SHA" \
            docker buildx bake --load -f deploy/docker/docker-bake.hcl pangrova
          image_id=$(docker image inspect --format '{{.Id}}' "$PANGROVA_E2E_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" == "$GITHUB_SHA" ]]
          echo "PANGROVA_E2E_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Stage the production classifier and matching host JNI
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/pangrova-local-runtime.XXXXXXXX")
          echo "PANGROVA_LOCAL_STAGE=$stage" >> "$GITHUB_ENV"
          bundle=$(bash .pangrova/scripts/stage-production-regression-native.sh \
            "$PANGROVA_E2E_IMAGE_ID" "$stage" "$GITHUB_SHA")
          mvn -B install:install-file -Dfile="$bundle" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64

      # Standalone-process tests need the complete reactor installed before tests start.
      - name: Install the complete Java reactor for process tests
        run: mvn -B -Pnative-runtime -DskipTests install -pl '!pangrova-native-bundle'

      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          echo "PANGROVA_E2E_AI_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Configure real FILE SQL acceptance
        run: |
          capability_key=$(openssl rand -base64 32)
          echo "::add-mask::$capability_key"
          echo "PANGROVA_E2E_FILE_CAPABILITY_KEY=$capability_key" >> "$GITHUB_ENV"

      - name: Run full regression
        run: |
          mvn -B -Pnative-runtime,full-regression verify -pl '!pangrova-native-bundle' \
            -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
            -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID" \
            -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
            -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
            -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
            -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
            -Dpangrova.e2e.local.source-commit="$GITHUB_SHA"

      - name: Run isolated Native runtime owner E2E
        run: |
          for suite in WorkerBootstrapE2ETest NativeExchangeTransportExternalIntegrationTest \
                       WorkerShuffleChannelAdmissionIntegrationTest \
                       NativeShuffleEgressContractIntegrationTest \
                       NativeAiFailureProjectionRegistrationTest \
                       WorkerMembershipAdmissionE2ETest \
                       'CopySourceReadHttpE2ETest#privateTicketStagesExactVersionAndRestartsFromManagedBytes' \
                       LocalGovernedFileSqlE2ETest; do
            file_backend=s3
            if [[ "$suite" == LocalGovernedFileSqlE2ETest ]]; then file_backend=local; fi
            mvn -B -Pnative-runtime,full-regression \
              -pl pangrova-testing/pangrova-testing-integration-tests \
              -Dpangrova.e2e.excludedGroups=none -Dtest="$suite" test \
              -Dpangrova.lance.fixture.tool="$PANGROVA_JAVA_NATIVE_TEST_RUNTIME/pangrova_lance_fixture_tool" \
              -Dpangrova.e2e.file.backend="$file_backend" \
              -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
              -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
              -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
              -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
              -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
              -Dpangrova.e2e.local.source-commit="$GITHUB_SHA" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID"
          done

      - name: Upload full regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-regression-reports
          path: |
            **/target/surefire-reports/

      - name: Upload production runtime provenance and process diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-runtime-provenance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pangrova-ai-fixture.json
            ${{ runner.temp }}/pangrova-local-runtime.*/runtime.sha256
            ${{ runner.temp }}/pangrova-local-runtime.*/image-provenance.properties
            /tmp/pangrova-local-process-*/*.log

  tpch-performance:
    name: TPC workload and evidence contracts
    runs-on: ubuntu-latest
    needs: [java-build, change-scope]
    if: github.event_name == 'pull_request' && needs.change-scope.outputs.performance == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned benchmark tooling
        run: python -m pip install -r pangrova-testing/pangrova-testing-benchmark/requirements.txt
      - name: Verify complete workloads, real Parquet conversion, runner and comparison contracts
        run: python -m unittest discover -s pangrova-testing/pangrova-testing-benchmark/scripts/tests -v
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v8
        with:
          name: tpc-client-cli
          path: tpc-client
      - name: Verify persistent production client over real HTTP and Flight transport
        run: >-
          python pangrova-testing/pangrova-testing-benchmark/scripts/integration/test_persistent_transport.py
          --classpath tpc-client/pangrova-client-cli-0.1.0-SNAPSHOT-exec.jar
      # Actual SF100/1000 comparisons run on exclusive hardware in nightly-tpc-benchmark.yml.
      # Short E2E latency samples are never submitted to a P99 calibration comparator.
  native-sanitizers:
    name: Native Sanitizer (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-24.04
    needs: change-scope
    if: needs.change-scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: asan
            preset: dev-asan
          - name: ubsan
            preset: dev-ubsan
    steps:
      - uses: actions/checkout@v7

      - name: Set up Native fixture JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare the Lance Java fixture
        uses: ./.github/actions/prepare-native-java-fixture

      - name: Cache dependency archives
        uses: actions/cache@v4
        with:
          path: ~/.pangrova/velox/archive-cache
          key: pangrova-v1-archives-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/dependency-versions.txt') }}

      - name: Cache native dependency prefixes
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps
            ~/.pangrova/velox/deps-install
          key: pangrova-v1-deps-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/dependency-versions.txt', '.github/actions/setup-native-build/action.yml', 'pangrova-worker-native/patches/*') }}

      - name: Cache ASan Velox + ABI dependencies
        if: matrix.sanitizer.name == 'asan'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps-asan
            ~/.pangrova/velox/_build/asan-ci/CMakeCache.txt
            ~/.pangrova/velox/_build/asan-ci/lib/libvelox.a
            ~/.pangrova/velox/_build/asan-ci/_deps
            ~/.pangrova/velox/_build/asan-ci/CMake/resolve_dependency_modules/arrow/arrow_ep/src/arrow_ep-build/thrift_ep-install
          key: pangrova-v1-native-asan-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/dependency-versions.txt', '.github/actions/setup-native-build/action.yml', 'pangrova-worker-native/bin/setup-native-asan-env.sh', 'pangrova-worker-native/patches/*') }}

      - name: Cache compiler results
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: pangrova-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sanitizer.name }}-${{ github.sha }}
          restore-keys: |
            pangrova-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sanitizer.name }}-

      - name: Install and verify the native toolchain
        uses: ./.github/actions/setup-native-build

      - name: Setup native build environment
        env:
          PANGROVA_NATIVE_BUILD_PHASE: ${{ matrix.sanitizer.name == 'asan' && 'dependencies' || 'all' }}
        run: |
          set -o pipefail
          report_failure() {
            local log="$1" title="$2" escaped
            {
              printf '### %s\n```text\n' "$title"
              df -h /
              uname -a
              free -m 2>/dev/null || vm_stat
              tail -n 160 "$log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            # Logs need admin, and GitHub caps annotations per step. Escape the
            # entire tail into one annotation so the actual error stays visible.
            escaped="$({ df -h /; uname -a; free -m 2>/dev/null || vm_stat; \
              printf '%s\n' '--- last command lines ---'; tail -n 25 "$log"; \
              printf '%s\n' '--- error diagnostics ---'; \
              grep -E -i 'error:|fatal error|CMake Error|undefined reference|ld: |cannot find|No space left|Killed|ninja: build stopped|command not found|Failed to|FAILED:' "$log" \
                | tail -n 80 || true; } \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk 'length {printf "%s%%0A", $0}')"
            printf '::error::%s\n' "${escaped:0:60000}"
          }
          if ! bash -x ./pangrova-worker-native/bin/setup-native-build-env.sh 2>&1 \
              | tee "$RUNNER_TEMP/native-setup.log"; then
            report_failure "$RUNNER_TEMP/native-setup.log" "Native setup failed"
            exit 1
          fi

      - name: Verify the sanitizer dependency contract
        if: matrix.sanitizer.name == 'asan'
        run: ./pangrova-worker-native/bin/setup-native-asan-env.sh --check-tools

      - name: Build instrumented Velox, Folly, Protobuf, Abseil, RE2, gRPC and Flight
        if: matrix.sanitizer.name == 'asan'
        run: |
          set -o pipefail
          report_failure() {
            local log="$1" title="$2" escaped
            {
              printf '### %s\n```text\n' "$title"
              df -h /
              uname -a
              free -m 2>/dev/null || vm_stat
              tail -n 160 "$log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            # Logs need admin, and GitHub caps annotations per step. Escape the
            # entire tail into one annotation so the actual error stays visible.
            escaped="$({ df -h /; uname -a; free -m 2>/dev/null || vm_stat; \
              printf '%s\n' '--- last command lines ---'; tail -n 25 "$log"; \
              printf '%s\n' '--- error diagnostics ---'; \
              grep -E -i 'error:|fatal error|CMake Error|undefined reference|ld: |cannot find|No space left|Killed|ninja: build stopped|command not found|Failed to|FAILED:' "$log" \
                | tail -n 80 || true; } \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk 'length {printf "%s%%0A", $0}')"
            printf '::error::%s\n' "${escaped:0:60000}"
          }
          if ! PANGROVA_ASAN_CI_PRUNE_RELEASE=1 bash -x \
              ./pangrova-worker-native/bin/setup-native-asan-env.sh 2>&1 \
              | tee "$RUNNER_TEMP/native-asan-setup.log"; then
            report_failure "$RUNNER_TEMP/native-asan-setup.log" \
              "Sanitizer dependency setup failed"
            exit 1
          fi

      - name: Build required Lance C FFI
        run: |
          set -o pipefail
          report_failure() {
            local log="$1" title="$2" escaped
            {
              printf '### %s\n```text\n' "$title"
              df -h /
              uname -a
              free -m 2>/dev/null || vm_stat
              tail -n 160 "$log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            escaped="$({ df -h /; uname -a; free -m 2>/dev/null || vm_stat; \
              printf '%s\n' '--- last command lines ---'; tail -n 25 "$log"; \
              printf '%s\n' '--- error diagnostics ---'; \
              grep -E -i 'error:|fatal error|CMake Error|undefined reference|ld: |cannot find|No space left|Killed|ninja: build stopped|command not found|Failed to|FAILED:' "$log" \
                | tail -n 80 || true; } \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk 'length {printf "%s%%0A", $0}')"
            printf '::error::%s\n' "${escaped:0:60000}"
          }
          if ! bash -x ./pangrova-worker-native/bin/build-lance-ffi.sh 2>&1 \
              | tee "$RUNNER_TEMP/native-lance.log"; then
            report_failure "$RUNNER_TEMP/native-lance.log" "Lance FFI build failed"
            exit 1
          fi

      - name: CMake configure (${{ matrix.sanitizer.preset }})
        uses: ./.github/actions/run-native-step
        with:
          log: native-sanitizer-configure
          title: CMake sanitizer configure failed
          working-directory: pangrova-worker-native
          command: |
            source ~/.pangrova/env.sh
            if [[ "${{ matrix.sanitizer.name }}" == "asan" ]]; then
              source ~/.pangrova/asan-env.sh
              cmake --preset ${{ matrix.sanitizer.preset }} \
                -DPANGROVA_DEPS_PREFIX="$PANGROVA_DEPS_PREFIX" \
                -DCMAKE_PREFIX_PATH="$PANGROVA_DEPS_PREFIX" \
                -DVELOX_BUILD_DIR="$VELOX_BUILD_DIR" \
                -DArrow_DIR="$Arrow_DIR" \
                -DARROW_FLIGHT_HOME="$ARROW_FLIGHT_HOME" -UARROW_FLIGHT_LIB \
                -Dre2_DIR="$re2_DIR" -DgRPC_DIR="$gRPC_DIR" \
                -DProtobuf_DIR="$Protobuf_DIR" \
                -DPANGROVA_ASAN_PROTOBUF_LIB="$PANGROVA_ASAN_PROTOBUF_LIB" \
                -DPANGROVA_ASAN_FOLLY_PREFIX="$PANGROVA_ASAN_FOLLY_PREFIX" \
                -Dabsl_DIR="$absl_DIR"
            else
              cmake --preset ${{ matrix.sanitizer.preset }}
            fi

      - name: CMake build
        uses: ./.github/actions/run-native-step
        with:
          log: native-sanitizer-build
          title: Sanitizer CMake build failed
          working-directory: pangrova-worker-native
          command: |
            cmake --build build-${{ matrix.sanitizer.name }}

      - name: Run tests with ${{ matrix.sanitizer.name }}
        uses: ./.github/actions/run-native-step
        with:
          log: native-sanitizer-tests
          title: Sanitizer tests failed
          working-directory: pangrova-worker-native
          command: |
            python3 bin/run-native-tests.py --build-dir build-${{ matrix.sanitizer.name }} \
              --prepared-java "$RUNNER_TEMP/native-java-fixture" \
              -- --preset ${{ matrix.sanitizer.preset }} --timeout 300

      - name: Upload sanitizer fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-fixture-${{ matrix.sanitizer.name }}
          path: |
            pangrova-worker-native/build-${{ matrix.sanitizer.name }}/Testing/LanceFixture/*/*.log
            ${{ runner.temp }}/native-java-fixture/java-build.log
          retention-days: 7

  jmh-benchmarks:
    name: JMH Micro-Benchmarks
    runs-on: ubuntu-latest
    needs: [java-build, change-scope]
    if: github.event_name == 'pull_request' && needs.change-scope.outputs.performance == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Build benchmark JAR
        run: |
          mvn -B package -pl pangrova-testing/pangrova-testing-benchmark -am \
            -DskipTests -Dmaven.test.skip=true

      - name: Run JMH benchmarks (short mode for CI)
        run: |
          java --add-opens=java.base/java.nio=ALL-UNNAMED \
            -jar pangrova-testing/pangrova-testing-benchmark/target/pangrova-benchmarks.jar \
            -f 1 -wi 2 -i 3 -t 1 \
            -rf json -rff target/jmh-results.json
        env:
          MAVEN_OPTS: "-Xmx4g"

      - name: Check for regressions (>10% = fail)
        run: |
          chmod +x pangrova-testing/pangrova-testing-benchmark/scripts/jmh-regression-check.sh
          pangrova-testing/pangrova-testing-benchmark/scripts/jmh-regression-check.sh \
            target/jmh-results.json \
            pangrova-testing/pangrova-testing-benchmark/baseline/jmh-baseline.json \
            0.10

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-benchmark-results
          path: target/jmh-results.json
          retention-days: 30

  dead-stub-detection:
    name: Dead-Stub Detection
    runs-on: ubuntu-latest
    needs: change-scope
    if: needs.change-scope.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 for Java source analysis
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect dead stubs in production code
        run: |
          chmod +x .pangrova/scripts/detect-dead-stubs.sh
          ./.pangrova/scripts/detect-dead-stubs.sh

  doc-consistency:
    name: Documentation-Code Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check doc class references
        run: ./.pangrova/scripts/check-doc-class-refs.sh

  lint:
    name: Repository tooling checks
    runs-on: ubuntu-latest
    needs: change-scope
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 17 for source and descriptor verification
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Guard against root-level build artifacts
        run: |
          VIOLATIONS=""
          for dir in io org build cmake-build-*; do
            if [ -d "$dir" ]; then
              VIOLATIONS="$VIOLATIONS $dir"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Build artifacts leaked into project root:$VIOLATIONS"
            echo "These directories should not exist at the repository root."
            echo "Likely cause: cmake or javac was run from the project root instead of a module directory."
            exit 1
          fi

      - name: Dev artifact hygiene
        run: bash .pangrova/scripts/check-dev-artifacts.sh

      - name: Reject contributor-machine paths
        run: ./.pangrova/scripts/check-environment-specific-info.sh

      # patch_flight_types.py rewrites an Arrow header during native dependency
      # setup. Its unit tests are also registered with CTest, but CTest only runs
      # on the native job; running them here keeps them covered on every PR even
      # when the native build is skipped.
      - name: Test patch_flight_types.py
        run: python3 pangrova-worker-native/test/PatchFlightTypesTest.py

      - name: Test gate selection and stub detection
        run: |
          set -o pipefail
          report_failure() {
            local log="$1" title="$2" escaped
            {
              printf '### %s\n```text\n' "$title"
              df -h /
              uname -a
              free -m 2>/dev/null || vm_stat
              tail -n 160 "$log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            # Logs need admin, and GitHub caps annotations per step. Escape the
            # entire tail into one annotation so the actual error stays visible.
            escaped="$({ df -h /; uname -a; free -m 2>/dev/null || vm_stat; \
              printf '%s\n' '--- last command lines ---'; tail -n 25 "$log"; \
              printf '%s\n' '--- error diagnostics ---'; \
              grep -E -i 'error:|fatal error|CMake Error|undefined reference|ld: |cannot find|No space left|Killed|ninja: build stopped|command not found|Failed to|FAILED:' "$log" \
                | tail -n 80 || true; } \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk 'length {printf "%s%%0A", $0}')"
            printf '::error::%s\n' "${escaped:0:60000}"
          }
          if ! python3 -m unittest discover -s .pangrova/scripts/tests \
              -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/tooling-tests.log"; then
            report_failure "$RUNNER_TEMP/tooling-tests.log" "Repository tooling tests failed"
            exit 1
          fi

      - name: Verify module manifest and source baseline
        run: bash .pangrova/scripts/check-module-manifest.sh

      - name: Verify canonical instructions
        run: bash .pangrova/setup.sh --check

      - name: Check gate shell syntax
        run: |
          for script in .pangrova/setup.sh .pangrova/scripts/*.sh .pangrova/scripts/tests/*.sh; do
            bash -n "$script"
          done

      - name: SPI annotation gate
        run: bash .pangrova/scripts/check-spi-annotations.sh

      - name: E2E truthfulness gate
        run: bash .pangrova/scripts/check-e2e-truthfulness.sh

      - name: Proto descriptor diff gate
        if: needs.change-scope.outputs.runtime == 'true'
        run: bash .pangrova/scripts/proto-descriptor-diff.sh

  static-analysis:
    name: Java static analysis
    runs-on: ubuntu-latest
    needs: change-scope
    if: needs.change-scope.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Test Checkstyle boundary enforcement
        run: python3 .pangrova/scripts/tests/checkstyle-boundaries-test.py

      - name: Static Analysis (profile gate)
        run: mvn -B verify -Pstatic-analysis -DskipTests -pl '!pangrova-native-bundle'

  validation:
    name: Validation result
    runs-on: ubuntu-latest
    needs: [change-scope, lint, doc-consistency, dead-stub-detection, static-analysis,
            native-build, java-build, native-sanitizers, production-regression,
            tpch-performance, jmh-benchmarks]
    if: always()
    steps:
      - name: Require selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PR_EVENT: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          jobs = json.loads(os.environ['RESULTS'])
          required = {'change-scope', 'lint', 'doc-consistency'}
          runtime = jobs['change-scope']['outputs'].get('runtime')
          if runtime not in {'true', 'false'}:
              raise SystemExit('Missing or invalid runtime scope')
          if os.environ['PR_EVENT'] != 'true' and runtime != 'true':
              raise SystemExit('Push/release validation must select runtime checks')
          native = jobs['change-scope']['outputs'].get('native')
          if native not in {'true', 'false'} or (native == 'true' and runtime != 'true'):
              raise SystemExit('Missing or inconsistent native scope')
          if os.environ['PR_EVENT'] != 'true' and native != 'true':
              raise SystemExit('Push/release validation must select native checks')
          performance = jobs['change-scope']['outputs'].get('performance')
          if os.environ['PR_EVENT'] == 'true' and performance not in {'true', 'false'}:
              raise SystemExit('Missing or invalid performance scope')
          if performance == 'true' and runtime != 'true':
              raise SystemExit('Performance checks require the runtime prerequisites')
          if runtime == 'true':
              required.update({'dead-stub-detection', 'static-analysis', 'native-build',
                               'java-build', 'production-regression'})
          if native == 'true':
              required.add('native-sanitizers')
          if performance == 'true':
              required.update({'tpch-performance', 'jmh-benchmarks'})
          missing = required - jobs.keys()
          if missing:
              raise SystemExit('Required checks absent: ' + ', '.join(sorted(missing)))
          failed = [name for name, job in jobs.items()
                    if job['result'] in {'failure', 'cancelled'}
                    or (name in required and job['result'] != 'success')]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(sorted(failed)))
          print('All selected checks passed.')
          PY
