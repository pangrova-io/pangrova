name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_LIB_DIR: ${{ github.workspace }}/pangrova-worker-native/build

jobs:
  change-scope:
    name: Select extra performance checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      performance: ${{ steps.scope.outputs.performance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .pangrova/scripts/ci_change_scope.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  native-build:
    name: Native Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            lib-ext: so
            classifier: linux-x86_64
          - name: linux-aarch_64
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            lib-ext: so
            classifier: linux-aarch_64
          - name: osx-x86_64
            runner: macos-13
            os: osx
            arch: x86_64
            lib-ext: dylib
            classifier: osx-x86_64
          - name: osx-aarch_64
            runner: macos-14
            os: osx
            arch: aarch64
            lib-ext: dylib
            classifier: osx-aarch_64
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache native deps + Velox
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps
            ~/.pangrova/velox
          key: pangrova-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/bin/setup-native-build-env.sh') }}
          restore-keys: |
            pangrova-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Setup native build environment
        run: ./pangrova-worker-native/bin/setup-native-build-env.sh

      - name: Build required Lance C FFI
        run: ./pangrova-worker-native/bin/build-lance-ffi.sh

      - name: CMake configure
        run: |
          source ~/.pangrova/env.sh
          cmake --preset dev-release
        working-directory: pangrova-worker-native

      - name: CMake build
        run: cmake --build build --target all
        working-directory: pangrova-worker-native

      - name: Run native tests (GTest via CTest)
        run: |
          ctest --test-dir build --output-on-failure --output-junit test-results.xml
        working-directory: pangrova-worker-native

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-${{ matrix.platform.name }}
          path: pangrova-worker-native/build/test-results.xml
          retention-days: 7

      - name: Publish native test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Native Tests (${{ matrix.platform.name }})
          path: pangrova-worker-native/build/test-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Verify native library
        run: |
          ls -la build/libpangrova_native.${{ matrix.platform.lib-ext }}
          echo "Native library built successfully"
        working-directory: pangrova-worker-native

      # Stage and build classifier JAR for downstream java-build job
      - name: Stage native library for classifier JAR
        run: |
          RESOURCE_DIR=pangrova-native-bundle/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          mkdir -p "${RESOURCE_DIR}"
          cp pangrova-worker-native/build/libpangrova_native.${{ matrix.platform.lib-ext }} "${RESOURCE_DIR}/"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install classifier JAR to local repo
        run: |
          mvn -B install -pl pangrova-native-bundle \
            -Dnative.platform.classifier=${{ matrix.platform.classifier }} \
            -Dnative.resource.dir=${{ github.workspace }}/pangrova-native-bundle/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }} \
            -Dnative.resource.os=${{ matrix.platform.os }} \
            -Dnative.resource.arch=${{ matrix.platform.arch }} \
            -Dnative.library.path=${{ github.workspace }}/pangrova-native-bundle/src/main/resources/META-INF/native/${{ matrix.platform.os }}/${{ matrix.platform.arch }}/libpangrova_native.${{ matrix.platform.lib-ext }} \
            -DskipTests

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-library-${{ matrix.platform.name }}
          path: pangrova-worker-native/build/libpangrova_native.*
          retention-days: 1

      - name: Upload classifier JAR
        uses: actions/upload-artifact@v4
        with:
          name: native-bundle-${{ matrix.platform.classifier }}
          path: pangrova-native-bundle/target/pangrova-native-bundle-*-${{ matrix.platform.classifier }}.jar
          retention-days: 1

  java-build:
    name: Java Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is the primary build target. JDK 21 runs in CI to catch
        # incompatibilities (e.g., new strong-encapsulation defaults, removed
        # APIs) before we promote 21 to the primary target.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download native library (for java.library.path fallback)
        uses: actions/download-artifact@v4
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}

      - name: Download classifier JAR
        uses: actions/download-artifact@v4
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar

      - name: Verify artifacts
        run: |
          ls -la ${{ env.NATIVE_LIB_DIR }}/libpangrova_native.*
          ls -la native-bundle-jar/

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: SPI annotation gate
        run: |
          chmod +x .pangrova/scripts/check-spi-annotations.sh
          .pangrova/scripts/check-spi-annotations.sh

      - name: E2E truthfulness gate
        run: bash .pangrova/scripts/check-e2e-truthfulness.sh

      - name: Fetch pinned proto descriptor toolchain
        run: .pangrova/scripts/proto-descriptor-diff.sh --prepare-only

      - name: Proto descriptor diff gate
        run: |
          chmod +x .pangrova/scripts/proto-descriptor-diff.sh
          .pangrova/scripts/proto-descriptor-diff.sh

      - name: Run daily filtered tests
        run: mvn -B clean verify -Djava.library.path=${{ env.NATIVE_LIB_DIR }} -pl '!pangrova-native-bundle'
        env:
          LD_LIBRARY_PATH: ${{ env.NATIVE_LIB_DIR }}

      - name: Retain same-source CLI for benchmark transport checks
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: tpc-client-cli
          path: pangrova-client/pangrova-client-cli/target/pangrova-client-cli-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  production-regression:
    name: Production image and full regression (JDK 17)
    runs-on: ubuntu-latest
    needs: [native-build, native-sanitizers]
    env:
      PANGROVA_E2E_IMAGE: pangrova/pangrova:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Build the canonical same-source Linux production image
        run: |
          docker buildx version
          export SOURCE_COMMIT="$GITHUB_SHA"
          IMAGE="$PANGROVA_E2E_IMAGE" docker buildx bake --load -f deploy/docker/docker-bake.hcl pangrova
          image_id=$(docker image inspect --format '{{.Id}}' "$PANGROVA_E2E_IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" == "$GITHUB_SHA" ]]
          echo "PANGROVA_E2E_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Stage the production classifier and matching host JNI
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/pangrova-local-runtime.XXXXXXXX")
          echo "PANGROVA_LOCAL_STAGE=$stage" >> "$GITHUB_ENV"
          bundle=$(bash .pangrova/scripts/stage-production-regression-native.sh "$PANGROVA_E2E_IMAGE_ID" "$stage" "$GITHUB_SHA")
          mvn -B install:install-file -Dfile="$bundle" -DpomFile=pangrova-native-bundle/pom.xml \
            -Dclassifier=linux-x86_64

      - name: Compile the complete Java reactor
        run: mvn -B -Pnative-runtime -DskipTests install -pl '!pangrova-native-bundle'

      - name: Prepare immutable real AI models before regression
        run: |
          docker pull ollama/ollama:0.6.2
          receipt="$RUNNER_TEMP/pangrova-ai-fixture.json"
          python3 .pangrova/scripts/prepare-e2e-ai-image.py --receipt "$receipt"
          image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$receipt")
          echo "PANGROVA_E2E_AI_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Configure real FILE SQL acceptance
        run: |
          capability_key=$(openssl rand -base64 32)
          echo "::add-mask::$capability_key"
          echo "PANGROVA_E2E_FILE_CAPABILITY_KEY=$capability_key" >> "$GITHUB_ENV"

      - name: Run full regression
        run: |
          mvn -B -Pnative-runtime,full-regression verify -pl '!pangrova-native-bundle' \
            -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
            -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
            -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
            -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
            -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
            -Dpangrova.e2e.local.source-commit="$GITHUB_SHA" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID"

      - name: Run isolated Native runtime owner E2E
        run: |
          for suite in WorkerBootstrapE2ETest NativeExchangeTransportExternalIntegrationTest \
                       WorkerShuffleChannelAdmissionIntegrationTest; do
            mvn -B -Pnative-runtime,full-regression \
              -pl pangrova-testing/pangrova-test-e2e \
              -Dpangrova.e2e.excludedGroups=none -Dtest="$suite" test \
              -Dpangrova.e2e.ai.image-id="$PANGROVA_E2E_AI_IMAGE_ID" \
              -Dpangrova.e2e.local.lib-dir="$PANGROVA_LOCAL_STAGE/lib" \
              -Dpangrova.e2e.local.native-lib="$PANGROVA_LOCAL_STAGE/extracted/META-INF/native/linux/x86_64/libpangrova_native.so" \
              -Dpangrova.e2e.local.jar-manifest="$PANGROVA_LOCAL_STAGE/runtime.sha256" \
              -Dpangrova.e2e.local.image-provenance="$PANGROVA_LOCAL_STAGE/image-provenance.properties" \
              -Dpangrova.e2e.local.source-commit="$GITHUB_SHA" \
            -Dpangrova.e2e.image="$PANGROVA_E2E_IMAGE" -Dpangrova.e2e.image-id="$PANGROVA_E2E_IMAGE_ID"
          done

      - name: Upload full regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-regression-reports
          path: |
            **/target/surefire-reports/

      - name: Upload production runtime provenance and process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-provenance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pangrova-ai-fixture.json
            ${{ runner.temp }}/pangrova-local-runtime.*/runtime.sha256
            ${{ runner.temp }}/pangrova-local-runtime.*/image-provenance.properties
            /tmp/pangrova-local-process-*/*.log

  tpch-performance:
    name: TPC workload and evidence contracts
    runs-on: ubuntu-latest
    needs: [java-build, change-scope]
    if: github.event_name == 'pull_request' && needs.change-scope.outputs.performance == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned benchmark tooling
        run: python -m pip install -r pangrova-testing/pangrova-test-benchmark/requirements.txt
      - name: Verify complete workloads, real Parquet conversion, runner and comparison contracts
        run: python -m unittest discover -s pangrova-testing/pangrova-test-benchmark/scripts/tests -v
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: tpc-client-cli
          path: tpc-client
      - name: Verify persistent production client over real HTTP and Flight transport
        run: >-
          python pangrova-testing/pangrova-test-benchmark/scripts/integration/test_persistent_transport.py
          --classpath tpc-client/pangrova-client-cli-0.1.0-SNAPSHOT.jar
      # Actual SF100/1000 comparisons run on exclusive hardware in nightly-tpc-benchmark.yml.
      # Short E2E latency samples are never submitted to a P99 calibration comparator.
  native-sanitizers:
    name: Native Sanitizer (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-latest
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: asan
            preset: dev-asan
          - name: ubsan
            preset: dev-ubsan
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache native deps + Velox
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps
            ~/.pangrova/velox
          key: pangrova-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/bin/setup-native-build-env.sh') }}
          restore-keys: |
            pangrova-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache ASan Velox + ABI dependencies
        if: matrix.sanitizer.name == 'asan'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pangrova/native-deps-asan
            ~/.pangrova/velox/_build/asan-ci/CMakeCache.txt
            ~/.pangrova/velox/_build/asan-ci/lib/libvelox.a
            ~/.pangrova/velox/_build/asan-ci/_deps
            ~/.pangrova/velox/_build/asan-ci/CMake/resolve_dependency_modules/arrow/arrow_ep/src/arrow_ep-build/thrift_ep-install
          key: pangrova-native-asan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pangrova-worker-native/bin/setup-native-build-env.sh', 'pangrova-worker-native/bin/setup-native-asan-env.sh') }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Setup native build environment
        run: ./pangrova-worker-native/bin/setup-native-build-env.sh

      - name: Build instrumented Velox, Protobuf, Abseil, RE2, gRPC and Flight
        if: matrix.sanitizer.name == 'asan'
        run: |
          PANGROVA_ASAN_CI_PRUNE_RELEASE=1 \
            ./pangrova-worker-native/bin/setup-native-asan-env.sh

      - name: Build required Lance C FFI
        run: ./pangrova-worker-native/bin/build-lance-ffi.sh

      - name: CMake configure (${{ matrix.sanitizer.preset }})
        run: |
          source ~/.pangrova/env.sh
          if [[ "${{ matrix.sanitizer.name }}" == "asan" ]]; then
            source ~/.pangrova/asan-env.sh
            cmake --preset ${{ matrix.sanitizer.preset }} \
              -DPANGROVA_DEPS_PREFIX="$PANGROVA_DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$PANGROVA_DEPS_PREFIX" \
              -DVELOX_BUILD_DIR="$VELOX_BUILD_DIR" \
              -DArrow_DIR="$Arrow_DIR" \
              -DARROW_FLIGHT_HOME="$ARROW_FLIGHT_HOME" -UARROW_FLIGHT_LIB \
              -Dre2_DIR="$re2_DIR" -DgRPC_DIR="$gRPC_DIR" \
              -DProtobuf_DIR="$Protobuf_DIR" \
              -DPANGROVA_ASAN_PROTOBUF_LIB="$PANGROVA_ASAN_PROTOBUF_LIB" \
              -Dabsl_DIR="$absl_DIR"
          else
            cmake --preset ${{ matrix.sanitizer.preset }}
          fi
        working-directory: pangrova-worker-native

      - name: CMake build
        run: cmake --build build-${{ matrix.sanitizer.name }}
        working-directory: pangrova-worker-native

      - name: Run tests with ${{ matrix.sanitizer.name }}
        run: ctest --preset ${{ matrix.sanitizer.preset }} --timeout 300
        working-directory: pangrova-worker-native

  fuzzer:
    name: Query Fuzzer (60s)
    runs-on: ubuntu-latest
    needs: native-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Build fuzzer
        run: |
          cd pangrova-testing/pangrova-test-fuzzer/src/main/cpp
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run fuzzer (60 seconds)
        run: |
          pangrova-testing/pangrova-test-fuzzer/src/main/cpp/build/pangrova_fuzzer_runner \
            --duration 60 --seed ${{ github.run_id }}

      - name: Upload fuzzer results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-crash-report
          path: pangrova-testing/pangrova-test-fuzzer/src/main/cpp/build/
          retention-days: 7

  jmh-benchmarks:
    name: JMH Micro-Benchmarks
    runs-on: ubuntu-latest
    needs: [java-build, change-scope]
    if: github.event_name == 'pull_request' && needs.change-scope.outputs.performance == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Build benchmark JAR
        run: |
          mvn -B package -pl pangrova-testing/pangrova-test-benchmark -am \
            -DskipTests -Dmaven.test.skip=true

      - name: Run JMH benchmarks (short mode for CI)
        run: |
          java --add-opens=java.base/java.nio=ALL-UNNAMED \
            -jar pangrova-testing/pangrova-test-benchmark/target/pangrova-benchmarks.jar \
            -f 1 -wi 2 -i 3 -t 1 \
            -rf json -rff target/jmh-results.json
        env:
          MAVEN_OPTS: "-Xmx4g"

      - name: Check for regressions (>10% = fail)
        run: |
          chmod +x pangrova-testing/pangrova-test-benchmark/scripts/jmh-regression-check.sh
          pangrova-testing/pangrova-test-benchmark/scripts/jmh-regression-check.sh \
            target/jmh-results.json \
            pangrova-testing/pangrova-test-benchmark/baseline/jmh-baseline.json \
            0.10

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-benchmark-results
          path: target/jmh-results.json
          retention-days: 30

  plan-stability:
    name: Plan Stability Gate
    runs-on: ubuntu-latest
    needs: java-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Extract PR metadata
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-library-linux-x86_64
          path: ${{ env.NATIVE_LIB_DIR }}

      - name: Download classifier JAR
        uses: actions/download-artifact@v4
        with:
          name: native-bundle-linux-x86_64
          path: native-bundle-jar

      - name: Install classifier JAR to local Maven repo
        run: |
          JAR_FILE=$(ls native-bundle-jar/pangrova-native-bundle-*-linux-x86_64.jar | head -1)
          mvn install:install-file \
            -Dfile="${JAR_FILE}" \
            -DgroupId=org.pangrova \
            -DartifactId=pangrova-native-bundle \
            -Dversion=0.1.0-SNAPSHOT \
            -Dclassifier=linux-x86_64 \
            -Dpackaging=jar

      - name: Run plan stability tests (verify golden files match)
        run: |
          mvn -B test -pl pangrova-planner \
            -Dtest="TpcdsPlanStabilityTest" \
            -DfailIfNoTests=false \
            -Djava.library.path=${{ env.NATIVE_LIB_DIR }}
        env:
          LD_LIBRARY_PATH: ${{ env.NATIVE_LIB_DIR }}

      - name: Check plan stability (golden plan diff gate)
        run: |
          chmod +x .pangrova/scripts/plan-stability-check.sh
          .pangrova/scripts/plan-stability-check.sh \
            --base-ref origin/${{ github.base_ref }} \
            --pr-labels "${{ join(github.event.pull_request.labels.*.name, ',') }}" \
            --pr-body-file /tmp/pr-body.md

  distributed-checklist:
    name: Distributed Correctness Checklist
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Extract PR body
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Check distributed correctness checklist
        run: |
          chmod +x .pangrova/scripts/distributed-checklist-check.sh
          .pangrova/scripts/distributed-checklist-check.sh \
            --base-ref origin/${{ github.base_ref }} \
            --pr-body-file /tmp/pr-body.md

  dead-stub-detection:
    name: Dead-Stub Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect dead stubs in production code
        run: |
          chmod +x .pangrova/scripts/detect-dead-stubs.sh
          ./.pangrova/scripts/detect-dead-stubs.sh

  doc-consistency:
    name: Documentation-Code Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check doc class references
        run: ./.pangrova/scripts/check-doc-class-refs.sh

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up function-contract Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Guard against root-level build artifacts
        run: |
          VIOLATIONS=""
          for dir in io org build cmake-build-*; do
            if [ -d "$dir" ]; then
              VIOLATIONS="$VIOLATIONS $dir"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Build artifacts leaked into project root:$VIOLATIONS"
            echo "These directories should not exist at the repository root."
            echo "Likely cause: cmake or javac was run from the project root instead of a module directory."
            exit 1
          fi

      - name: Reject contributor-machine paths
        run: ./.pangrova/scripts/check-environment-specific-info.sh

      # patch_flight_types.py rewrites an Arrow header during native dependency
      # setup. Its unit tests are also registered with CTest, but CTest only runs
      # on the native job; running them here keeps them covered on every PR even
      # when the native build is skipped.
      - name: Test patch_flight_types.py
        run: python3 pangrova-worker-native/test/PatchFlightTypesTest.py

      - name: Test gate selection and policy consistency
        run: python3 -m unittest discover -s .pangrova/scripts/tests -p 'test_gate_policy.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build pinned Iceberg SDK dependency
        uses: ./.github/actions/setup-iceberg-sdk

      - name: Test Checkstyle boundary enforcement
        run: python3 .pangrova/scripts/tests/checkstyle-boundaries-test.py

      - name: Static Analysis (profile gate)
        run: mvn -B verify -Pstatic-analysis -DskipTests -pl '!pangrova-native-bundle'
