# =============================================================================
# Pangrova Coordinator — Default Configuration
# =============================================================================
#
# This file ships with the pangrova-config module and provides sensible defaults
# for all coordinator configuration keys defined in CoordinatorOptions.
#
# Priority (highest → lowest):
#   1. CLI YAML (--config path/to/file.yml)
#   2. Environment variables (PANGROVA_* prefix)
#   3. This classpath default YAML
#   4. ConfigOption.defaultValue()
#
# Environment variable placeholders are supported: ${ENV_VAR} or ${ENV_VAR:-default}
# =============================================================================

# ---- Server ----
coordinator:
  id: "coordinator-1"
  host: "0.0.0.0"
  port: 8080
  internal-auth-secret: "${PANGROVA_INTERNAL_AUTH_SECRET:-}"
  speculation:
    enabled: false

  # ---- High Availability ----
  ha:
    enabled: false
    # jdbc-url: "jdbc:postgresql://localhost:5432/pangrova_ha"
    # DDL leader routing: when true, DDL is restricted to the leader node (HTTP 307 redirect).
    # Default false — DDL can execute on any coordinator; consistency is guaranteed by
    # connector concurrency control + cross-node invalidation propagation.
    ddl-leader-routing: false

  # ---- Query ----
  query:
    placement-provider: load-balanced
    timeout: "5m"
    max-concurrent: 100

  # Per-task byte grant. Zero disables task spilling; positive values also
  # require worker.spill.directory on each executing Worker.
  task:
    spill:
      max-bytes: 0

  # ---- Worker Management ----
  worker:
    heartbeat-timeout: "30s"
    max-retry: 3

  # ---- Internal Transport ----
  # Development defaults to plaintext. Distributed production deployments
  # must enable mutual TLS and mount all three PEM files on every coordinator.
  transport:
    tls:
      enabled: false
      certificate-chain-path: ""
      private-key-path: ""
      root-ca-path: ""

  # ---- Remote Shuffle ----
  shuffle:
    tls:
      server-identity: ""  # DNS identity present in the shuffle server certificate

# ---- Feature Flags ----
# All modules default to enabled except security.


metadata:
  enabled: true
  # jdbc-url: "jdbc:postgresql://localhost:5432/pangrova_metadata"
  jdbc-username: "${PANGROVA_DB_USERNAME:-}"
  jdbc-password: "${PANGROVA_DB_PASSWORD:-}"
  cache:
    l1-max-size: 10000
    l1-ttl: "60s"

governance:
  enabled: true

resilience:
  enabled: true

streaming:
  enabled: true

tenant:
  enabled: false

indexing:
  enabled: false
  # Required when enabled. Set via YAML or PANGROVA_INDEX_BASE_PATH.
  base-path: "${PANGROVA_INDEX_BASE_PATH:-/var/lib/pangrova/indexes}"
  build:
    thread-pool-size: 4
    parallelism: 4
    batch-flush-size: 500
    max-concurrent-per-tenant: 2
  cache:
    # Negative selects min(256 MiB, 12.5% of JVM maximum heap).
    size-bytes: -1
  eval:
    parallelism: 8
    timeout-ms: 5000
    circuit-failure-threshold: 5
    circuit-open-seconds: 60
    include-stale: true
  gc:
    interval-minutes: 60
    grace-period-minutes: 1440
  commit-listener:
    enabled: false
    poll-batch-size: 64
  consistency:
    check-interval-minutes: 30
    rebuild-threshold: 0.8
    # Keep off until snapshot, recovery, consistency and schema gates pass.
    auto-rebuild-enabled: false
    stuck-detection-multiplier: 2
  artifact:
    dispatch-lease: "2m"
    dispatch-retry-delay: "5s"
    dispatch-max-in-flight: 32
    publish-claim-ttl: "30s"
    publish-retry-delay: "15s"
    publish-poll-interval: "1s"
    publish-batch-size: 64

operations:
  enabled: true

observability:
  enabled: true
  # service-name: "pangrova-coordinator"
  # otlp-endpoint: "http://otel-collector:4317"

security:
  enabled: false
