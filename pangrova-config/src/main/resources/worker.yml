# =============================================================================
# Pangrova Worker — Default Configuration
# =============================================================================
#
# This file ships with the pangrova-config module and provides sensible defaults
# for all worker configuration keys defined in WorkerOptions.
#
# Priority (highest → lowest):
#   1. CLI YAML (--config path/to/file.yml)
#   2. Environment variables (PANGROVA_* prefix)
#   3. This classpath default YAML
#   4. ConfigOption.defaultValue()
#
# Environment variable placeholders are supported: ${ENV_VAR} or ${ENV_VAR:-default}
# =============================================================================

# ---- Server ----
worker:
  host: "0.0.0.0"
  port: 8081
  # advertised-host: "my-worker-host.example.com"
  id: "worker-1"

  # ---- Coordinator Connection ----
  # coordinator-url: "http://coordinator:8080"
  heartbeat-interval: "10s"

  # ---- Transport ----
  transport:
    port: 0  # 0 = auto-assign
    # Development defaults to plaintext. Distributed production deployments
    # must enable mutual TLS and mount all three PEM files on every worker.
    tls:
      enabled: false
      certificate-chain-path: ""
      private-key-path: ""
      root-ca-path: ""
      identity: ""  # DNS identity present in the worker certificate

  # Private COPY task control uses the transport TLS certificate and CA.
  # Set a fixed nonzero port in distributed deployments for firewall routing.
  copy:
    task-tls-port: 0  # 0 = disabled; set a fixed port to enable private COPY control

  # ---- Task Execution ----
  task:
    result-retention-seconds: 300

  # ---- Shuffle ----
  shuffle:
    buffer-capacity: 100
    max-memory-bytes: 536870912   # 512 MB
    spill-threshold: 0.8
    client:
      # ManagedChannel owners, including in-flight creation and failed joins;
      # not OS TCP sockets or concurrent RPCs. Shared by ingress and egress.
      max-owned-channels: 100
      max-owned-channels-per-endpoint: 8
    service:
      retention-bytes: 16777216  # 16 MiB, reserved from node memory
      transit-bytes: 16777216    # 16 MiB, reserved separately for Flight send
      spill-bytes: 1073741824    # hard cap for this Native service
      spill-files: 256
      # Required before Worker startup: create a dedicated absolute directory
      # on the intended spill volume with sufficient free space.
      # spill-directory: "/var/lib/pangrova/shuffle"

  # ---- Memory / Resources ----
  memory:
    budget-bytes: 536870912       # 512 MB
    system-reserved-bytes: 67108864  # 64 MB
    node-bytes: 1073741824        # 1 GB

  threads:
    query: 4
    io: 2
    scheduler: 1

  # Engine-level spill. Tasks also need a positive coordinator.task.spill.max-bytes
  # grant. Leaving the directory unset disables
  # spill entirely. The paths below are examples, not defaults — code-side
  # defaults derive from ${java.io.tmpdir}, which is NOT /tmp on macOS.
  # spill:
  #   directory: "/var/lib/pangrova/spill"

  # ---- Native Engine ----
  native:
    # path: "/opt/pangrova/lib/libpangrova_native.so"
    # workdir: "/var/lib/pangrova/native"
    delete-after-load: true

  # ---- Registration Retry ----
  registration:
    max-attempts: 5
    initial-backoff: "1s"
    max-backoff: "30s"

  # ---- CDC ----
  cdc:
    enabled: true

  # ---- AI invocation governance ----
  # Deny by default. To enable the built-in authenticated baseline, explicitly
  # configure exact model/capability/permission allowlists. Production RBAC and
  # distributed budgets should use an AiInvocationAuthorizer plugin.
  ai:
    authorization:
      mode: "deny"
      allowed-models: ""
      allowed-capabilities: ""
      granted-permissions: ""
      max-batch-size: 128
      max-input-bytes: 8388608
    file:
      # Empty storage-backend disables FILE. Configure the same durable backend
      # and capability secret on every Worker before enabling FILE or multimodal AI.
      storage-backend: ""
      storage-staging-root: ""
      capability-secret-reference: ""
      storage:
        s3:
          bucket: ""
          region: ""
          endpoint: ""
          prefix: "pangrova/ai-files"
          sse: ""
          kms-key-id: ""
          expected-bucket-owner: ""
          path-style-access: false
      max-bytes: 67108864
      allowed-mime-types: "image/jpeg,image/png,image/webp,application/pdf,text/plain,audio/mpeg,audio/wav,video/mp4"
      url:
        # Empty denies every URL import. List exact HTTPS hosts to enable it.
        allowed-hosts: ""
        connect-timeout-ms: 5000
        read-timeout-ms: 30000
        max-wire-bytes: 67108864
        max-decoded-bytes: 67108864
        max-connections: 256
        max-connections-per-route: 32
        connection-ttl-ms: 60000
        idle-eviction-ms: 30000
    # Versioned model descriptors are intentionally absent by default.
    # Secrets must be references, never literal credentials. Example:
    # models:
    #   chat:
    #     name: "gpt-4o-mini"
    #     provider: "openai-compatible"
    #     provider-model: "gpt-4o-mini-2026-08-01"
    #     version: "2026-08-01"
    #     endpoint: "https://api.example/v1/chat/completions"
    #     secret-reference: "env://PANGROVA_CHAT_API_KEY"
    #     capabilities: "inference"
    #     modalities: "text"
    #     max-input-tokens: 128000
    #     max-output-tokens: 16384
    #     max-media-bytes: 0
    #     max-concurrency: 8
    #     max-provider-items-per-task: 10000
    #     max-provider-attempts-per-task: 40000
    #     max-request-bytes: 1048576
    #     max-response-bytes: 1048576

# ---- Feature Flags ----
observability:
  enabled: true
  # service-name: "pangrova-worker"
  # otlp-endpoint: "http://otel-collector:4317"

security:
  enabled: false
