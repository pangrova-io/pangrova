# ============================================================
# Pangrova — Security Configuration (Production)
#
# This file configures authentication, authorization, TLS,
# column-level security, and audit logging.
#
# Reference this file from coordinator.yml:
#   security:
#     enabled: true
#     config-file: /etc/pangrova/security.yml
#
# All secrets MUST be injected via environment variables.
# Never store real credentials, keys, or tokens in this file.
# ============================================================

# ── Authentication ─────────────────────────────────────────────
auth:
  # ── Option A: OAuth2 / OIDC (recommended) ──────────────────
  #
  # Validates JWT bearer tokens from any OIDC-compliant IdP.
  # Tested with: Keycloak, Auth0, Okta, AWS Cognito, Azure AD.
  #
  type: OAUTH2

  oauth2:
    # Issuer URI — must exactly match the "iss" claim in tokens.
    # OIDC discovery doc: ${issuer-uri}/.well-known/openid-configuration
    issuer-uri: "${PANGROVA_OAUTH2_ISSUER_URI}"

    # Expected audience — must match "aud" claim in tokens.
    # In Keycloak this is the client ID; in Auth0 it is the API identifier.
    audience: "${PANGROVA_OAUTH2_AUDIENCE:-pangrova-api}"

    # JWKS URI — auto-discovered from issuer-uri if omitted.
    # Set explicitly if your IdP does not follow OIDC discovery.
    # jwks-uri: "${PANGROVA_OAUTH2_JWKS_URI}"

    # Connection settings for JWKS fetching.
    jwks:
      # Cache JWKS keys for this duration before re-fetching.
      # Keep below your IdP's key rotation interval.
      cache-ttl: "1h"
      # Timeout for fetching the JWKS document.
      connect-timeout: "5s"
      read-timeout: "10s"

    # JWT claim mappings.
    claims:
      # Claim containing the user's identity (principal).
      # Sub is the OIDC standard; some IdPs use "email" or "preferred_username".
      principal: "sub"

      # Claim containing group memberships for RBAC evaluation.
      groups: "groups"

      # Claim containing the tenant identifier for multi-tenant isolation.
      # Must be present in every token when multi-tenancy is enabled.
      tenant: "tenant_id"

      # Optional: claim containing a display name for audit logs.
      display-name: "name"

  # ── Option B: LDAP / Active Directory ──────────────────────
  # (uncomment to use LDAP instead of OAuth2; set type: LDAP above)
  #
  # ldap:
  #   url: "ldaps://ldap.internal:636"
  #   bind-dn: "cn=pangrova-svc,ou=service-accounts,dc=example,dc=com"
  #   bind-password: "${PANGROVA_LDAP_BIND_PASSWORD}"
  #   user-search-base: "ou=users,dc=example,dc=com"
  #   user-search-filter: "(sAMAccountName={0})"
  #   group-search-base: "ou=groups,dc=example,dc=com"
  #   group-search-filter: "(member={0})"
  #   group-role-attribute: "cn"
  #   # Connection pool
  #   pool-size: 10
  #   connection-timeout: "5s"
  #   read-timeout: "10s"
  #   # Use TLS for LDAP connections (ldaps:// or STARTTLS)
  #   tls:
  #     enabled: true
  #     ca-file: "/etc/pangrova/tls/ldap-ca.crt"


# ── Internal Cluster Authentication ───────────────────────────
#
# HMAC-SHA256 tokens authenticate internal RPC calls between
# Coordinators and Workers. Must be identical on all nodes.
internal:
  # Secret key — minimum 32 bytes, base64-encoded.
  # Generate: openssl rand -base64 48
  auth-secret: "${PANGROVA_INTERNAL_AUTH_SECRET}"

  # Token lifetime. Internal tokens are reissued automatically.
  token-ttl: "1h"


# ── TLS ───────────────────────────────────────────────────────
#
# Enables HTTPS for the REST API and mTLS for internal gRPC/Flight.
# Use separate certificates for external (REST) and internal (gRPC).
tls:
  # External: REST API certificate (client-facing)
  external:
    enabled: true
    cert-file: "${PANGROVA_TLS_CERT_FILE:-/etc/pangrova/tls/server.crt}"
    key-file: "${PANGROVA_TLS_KEY_FILE:-/etc/pangrova/tls/server.key}"
    ca-file: "${PANGROVA_TLS_CA_FILE:-/etc/pangrova/tls/ca-bundle.crt}"
    # Minimum TLS version. TLS 1.3 preferred; 1.2 for broader compatibility.
    min-protocol: "TLSv1.2"
    # Explicitly allow only strong cipher suites.
    # Comment out to use the JVM platform defaults (also acceptable).
    ciphers:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_AES_128_GCM_SHA256"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
      - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"

  # Internal: Worker ↔ Coordinator mTLS
  internal:
    enabled: true
    # Internal certs may be the same as external or separate PKI certs.
    cert-file: "${PANGROVA_TLS_CERT_FILE:-/etc/pangrova/tls/server.crt}"
    key-file: "${PANGROVA_TLS_KEY_FILE:-/etc/pangrova/tls/server.key}"
    ca-file: "${PANGROVA_TLS_CA_FILE:-/etc/pangrova/tls/ca-bundle.crt}"
    min-protocol: "TLSv1.2"


# ── Authorization (RBAC) ──────────────────────────────────────
#
# Role-Based Access Control. Roles are sourced from JWT claim
# (auth.oauth2.claims.groups) or LDAP group membership.
rbac:
  # Deny any request that does not match an explicit GRANT.
  # Set to false only during initial migration; always true in production.
  default-deny: true

  # Grant superuser access to a specific role.
  # Members of this role bypass all object-level checks.
  admin-role: "pangrova-admin"

  # ── Privilege Grant Examples ──────────────────────────────
  # These are examples — adapt to your role taxonomy.
  # Grants are evaluated in order; first match wins.
  #
  # grants:
  #   # Data engineers can manage tables in their schema
  #   - role: "data-engineers"
  #     privileges: ["CREATE", "DROP", "SELECT", "INSERT", "UPDATE", "DELETE"]
  #     on: "schema:engineering.*"
  #
  #   # Analysts have read-only access to the reporting schema
  #   - role: "analysts"
  #     privileges: ["SELECT"]
  #     on: "schema:reporting.*"
  #
  #   # AI service account can write embedding outputs
  #   - role: "ai-svc"
  #     privileges: ["INSERT", "UPDATE"]
  #     on: "table:vectors.*"


# ── Row-Level Security (RLS) ──────────────────────────────────
#
# Automatically appends a tenant filter to every query on
# tables that have RLS enabled. The tenant ID is extracted
# from the JWT claim (auth.oauth2.claims.tenant).
rls:
  enabled: true

  # SQL expression that produces the current user's tenant ID.
  # Available variables: ${principal} (user identity), ${tenant} (tenant claim value).
  tenant-id-expression: "CURRENT_SETTING('pangrova.tenant_id')"

  # Tables where RLS is NOT applied (system/shared tables).
  # Use full qualified names: catalog.schema.table
  exclusions:
    - "system.information_schema.*"
    - "system.pangrova_catalog.*"


# ── Column Masking ────────────────────────────────────────────
#
# Masking functions are applied at query result time.
# Columns are masked for users who do NOT hold the named role.
column-masking:
  enabled: true

  # ── Masking Policy Examples ───────────────────────────────
  # policies:
  #   - column-pattern: "*.*.email"
  #     mask-function: "REGEXP_REPLACE({col}, '(?<=.{2}).(?=.*@)', '*')"
  #     exempt-roles: ["data-engineers", "pangrova-admin"]
  #
  #   - column-pattern: "*.*.phone_number"
  #     mask-function: "CONCAT('***-***-', SUBSTR({col}, -4))"
  #     exempt-roles: ["data-engineers", "pangrova-admin"]
  #
  #   - column-pattern: "*.*.ssn"
  #     mask-function: "'***-**-' || SUBSTR({col}, 8)"
  #     exempt-roles: ["pangrova-admin"]
  #
  #   - column-pattern: "*.*.credit_card_number"
  #     mask-function: "CONCAT(REPEAT('*', LENGTH({col}) - 4), SUBSTR({col}, -4))"
  #     exempt-roles: ["finance", "pangrova-admin"]


# ── Audit Logging ─────────────────────────────────────────────
#
# Audit events are written to a separate log file and optionally
# shipped to a SIEM (Splunk, Elasticsearch, Chronicle, etc.)
audit:
  enabled: true

  # Log all DDL statements (CREATE / DROP / ALTER TABLE, etc.)
  log-ddl: true

  # Log all DML statements (SELECT, INSERT, UPDATE, DELETE).
  # This can be high volume — consider sampling or log-dml: false
  # and rely on the query log for DML tracing.
  log-dml: false

  # Log every authentication attempt (success and failure).
  log-auth: true

  # Log authorization denials.
  log-authz-denials: true

  # Log all column masking applications.
  log-masking: false

  # Log all RLS filter injections.
  log-rls: false

  # Audit log retention in days. Subject to your compliance policy.
  # Typical: PCI-DSS = 365, SOC 2 = 365, GDPR = varies.
  retention-days: 365

  # Audit log destination. "LOGFILE" writes to audit.log alongside
  # the application log. "SIEM" ships to an external endpoint.
  destination: LOGFILE

  # Uncomment to ship audit events to an OTLP-compatible SIEM.
  # siem:
  #   type: OTLP
  #   endpoint: "${AUDIT_SIEM_OTLP_ENDPOINT}"
  #   headers:
  #     Authorization: "Bearer ${AUDIT_SIEM_TOKEN}"
