# ============================================================
# Pangrova — REST Catalog (Iceberg REST Catalog)
#
# Use this when your data lake uses the Iceberg REST Catalog
# specification (Apache Polaris, Project Nessie, Gravitino,
# Tabular, AWS Glue REST mode, Snowflake Open Catalog, etc.)
#
# Reference in coordinator.yml:
#   catalogs:
#     - name: my_lakehouse
#       config-file: /etc/pangrova/catalog/rest-catalog.yml
#
# ============================================================

catalog:
  name: "my_lakehouse"

  # Catalog type — Iceberg REST Catalog (open standard).
  type: ICEBERG_REST

  # ── Endpoint ─────────────────────────────────────────────────
  # Base URI of the catalog server (no trailing slash).
  # Examples:
  #   Apache Polaris:   https://polaris.internal/api/catalog
  #   Project Nessie:   https://nessie.internal/iceberg
  #   AWS Glue:         https://glue.<region>.amazonaws.com/iceberg
  #   Snowflake:        https://<account>.snowflakecomputing.com/polaris/api/catalog
  uri: "${ICEBERG_REST_URI:-https://catalog.internal/api/catalog}"

  # Iceberg REST API version. Current standard: "1".
  api-version: "1"

  # Default warehouse (storage location prefix).
  # Iceberg REST Catalog uses this as the root for table files.
  # Examples:
  #   S3:   s3://my-bucket/warehouse
  #   GCS:  gs://my-bucket/warehouse
  #   ADLS: abfss://container@account.dfs.core.windows.net/warehouse
  warehouse: "${ICEBERG_WAREHOUSE:-s3://my-lakehouse/warehouse}"

  # ── Authentication ───────────────────────────────────────────
  #
  # The REST Catalog spec supports OAuth2 client credentials
  # and pre-issued bearer tokens. Do NOT hardcode tokens here.
  auth:
    # OAuth2 client credentials (recommended for long-running services).
    type: OAUTH2_CLIENT_CREDENTIALS

    # Token endpoint of the authorization server.
    # For AWS Glue: https://glue.<region>.amazonaws.com/iceberg/token
    # For Polaris: https://polaris.internal/api/catalog/v1/oauth/tokens
    token-endpoint: "${ICEBERG_AUTH_TOKEN_ENDPOINT}"

    # Client ID and secret issued by the catalog's auth server.
    client-id: "${ICEBERG_AUTH_CLIENT_ID}"
    client-secret: "${ICEBERG_AUTH_CLIENT_SECRET}"

    # OAuth2 scope requested in the client credentials grant.
    # Polaris: "PRINCIPAL_ROLE:my-role" (catalog admin role)
    # AWS Glue: (not required)
    scope: "${ICEBERG_AUTH_SCOPE:-PRINCIPAL_ROLE:catalog-admin}"

    # ── Alternative: pre-issued static token ─────────────────
    # Use only for testing or very short-lived integrations.
    # type: BEARER
    # token: "${ICEBERG_BEARER_TOKEN}"

  # ── Object Storage Credentials ───────────────────────────────
  #
  # The catalog server returns pre-signed S3/GCS/ADLS credentials
  # for each table operation (vended credentials pattern).
  # Pangrova uses these credentials for direct object store access.
  #
  # If vended credentials are NOT used, configure static credentials:
  #
  # s3:
  #   region: "${AWS_REGION:-us-east-1}"
  #   # IAM role assumption (recommended over static keys)
  #   role-arn: "${AWS_ROLE_ARN}"
  #   # Static credentials (use only when IAM roles are unavailable)
  #   access-key-id: "${AWS_ACCESS_KEY_ID}"
  #   secret-access-key: "${AWS_SECRET_ACCESS_KEY}"
  #   # Custom endpoint for S3-compatible stores (MinIO, Ceph, R2)
  #   endpoint: "${AWS_S3_ENDPOINT}"
  #   path-style-access: false   # set true for MinIO/Ceph

  # ── Connection Settings ──────────────────────────────────────
  connection:
    # Connection timeout for catalog API calls.
    connect-timeout: "5s"
    # Read timeout for catalog API responses.
    read-timeout: "30s"
    # Connection pool size — tune based on concurrent DDL operations.
    pool-size: 10
    # Maximum retry attempts for transient catalog API errors.
    max-retries: 3
    # Retry backoff: 200ms, 400ms, 800ms (exponential).
    retry-initial-backoff: "200ms"

  # ── Schema ───────────────────────────────────────────────────
  # Default namespace exposed to SQL users as a SQL schema.
  default-namespace: "default"

  # Namespaces to expose in Pangrova's information_schema.
  # Comment out to expose all namespaces visible to the catalog auth principal.
  # include-namespaces:
  #   - "production"
  #   - "staging"
  #   - "analytics"

  # ── Metadata Cache ───────────────────────────────────────────
  # Reduce catalog API calls by caching table metadata locally.
  cache:
    enabled: true
    # Cache table schemas and partition stats for this duration.
    # A shorter TTL means fresher metadata but more catalog API calls.
    ttl: "60s"
    # Maximum number of table metadata entries cached per coordinator.
    max-size: 5000
    # Invalidate cache immediately on table write operations.
    invalidate-on-write: true
