      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/dynamictable/DynamicTableRefreshDispatchFunction.java
      - pangrova-worker/src/main/java/org/pangrova/worker/execution/NativeTaskExecutor.java
      - pangrova-protocol/src/main/proto/pangrova/protocol/v2/task.proto
    deliverables:
