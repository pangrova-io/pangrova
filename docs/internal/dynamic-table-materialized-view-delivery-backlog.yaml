      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/query/task/WriteCommitFencer.java
    deliverables:
      - '每 claim 独立 lease/renew state；共享库 live claim/epoch/definition/lifecycle/base head/policy CAS。'
      - 'head、source vector、state manifest、receipt、attempt、history、outbox 同一发布事务。'
