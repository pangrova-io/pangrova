# 工程实施基线；planned 表示尚未实现/验收，不表示已有能力。
schema_version: 1
date: '2026-09-30'
status: planned
scope: 'Pangrova DT/MV 完整分布式物化链路'
design: dynamic-table-materialized-view-delivery-design.md
research: dynamic-table-materialized-view-industry-research.md
ownership_note: 'owner 是责任角色，实际负责人和排期在启动实施时指定；不把未知团队容量换算成承诺日期。'
delivery_policy:
  - '每个任务以契约、真实实现、生产装配、调用者、错误路径、测试和运维说明共同验收。'
  - '新增跨模块契约放 SPI；Planner 不引用 Coordinator；Connector 不引用领域实现；业务行仅 Worker/Native 处理。'
  - '源码改动执行 .pangrova/rules/build-pipeline.md 全部八步及适用 gates，保存真实日志。'
  - '旧工作树修改保留；迁移 definitions，不把旧 timestamp checkpoint 当作可信源位置。'
  - '每个阶段先验证正确性，再以实测决定性能与容量承诺。'
  - '一次任务可拆多个 PR，但不以只有 SPI、fixture 或注释作为完成。'
completion_evidence:
  required: [implementation_pr, production_wiring, caller_trace, failure_tests, validation_logs, operator_docs]
  invariant: '未运行、依赖缺失、失败都单列；不能以 mock/source override 证明真实物化。'
milestones:
  - id: M0
    title: 生产真实性与契约冻结
    tasks: [MAT-001, MAT-002]
    exit: '真实 harness 暴露旧派发即成功、源透传及 replay 风险；产品保证矩阵明确。'
  - id: M1
    title: 正确 full 分布式垂直闭环
    tasks: [MAT-003, MAT-004, MAT-005, MAT-006, MAT-007, MAT-008, MAT-009, MAT-010]
    exit: '正常客户端完成 CREATE、真实 target 刷新、精确版本查询与重启恢复；错误路径不提前发布。'
  - id: M2
    title: 实用范围增量
    tasks: [MAT-011, MAT-012, MAT-013]
    exit: '支持矩阵内 append/partition/key 策略与 pinned full oracle 差分一致。'
  - id: M3
    title: 分布式调度与 DAG cut
    tasks: [MAT-014, MAT-015, MAT-016]
    exit: 'durable sharded queue、公平配额、新鲜度证据和 pipeline cut 在多进程下成立。'
  - id: M4
    title: 通用 delta 与状态恢复
    tasks: [MAT-017, MAT-018, MAT-019]
    exit: 'retract、多输入、多分区和 rescale 的 source/state/output 共同发布。'
  - id: M5
    title: 安全查询加速
    tasks: [MAT-020, MAT-021]
    exit: '正式等价、权限、版本一致性与 native compensation 验证后逐能力打开。'
  - id: M6
    title: 生产硬化与迁移
    tasks: [MAT-022, MAT-023, MAT-024]
    exit: '迁移、GC、DR、多进程故障、容量和全链发布门槛通过。'
tasks:
  - id: MAT-001
    title: 真实生产 harness 与旧风险复现
    milestone: M0
    owner: execution-testing
    status: planned
    depends_on: []
    existing_entrypoints:
      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/bootstrap/QueryExecutionWiring.java
      - pangrova-testing/pangrova-test-common/src/main/java/org/pangrova/testing/PangrovaClusterContainer.java
      - pangrova-testing/pangrova-test-e2e/src/test/java/org/pangrova/testing/e2e/SqlE2ETestBase.java
    deliverables:
      - '生产正常 bootstrap 启动两个 Coordinator、三个独立 Worker 和独立 Shuffle；记录 endpoint/process identity。'
      - '真实 source 与 target catalog/object store；DT 专用验收禁止 source table override 和 inline defining SQL 替代。'
      - '形成现有路径事实图及 failing regression evidence，不用禁用测试掩盖未实现能力。'
    acceptance:
      - '停止刷新后修改源，读取物化对象必须仍为旧 generation；旧 fixture 不能通过该断言。'
      - '派发后阻塞 Worker，checkpoint/readiness 不得前进；注入 commit ACK 丢失留存证据。'
    tests: [production-bootstrap-reachability, distinct-process-and-target-identity, dispatch-vs-completion-regression]

  - id: MAT-002
    title: 产品语义与版本化身份契约
    milestone: M0
    owner: materialization-planner
    status: planned
    depends_on: [MAT-001]
    existing_entrypoints:
      - pangrova-parser/src/main/java/org/pangrova/parser/ast/CreateDynamicTableStatement.java
      - pangrova-parser/src/main/java/org/pangrova/parser/ast/RefreshMode.java
      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/dynamictable/DynamicTableDdlExecutor.java
    deliverables:
      - '产品/触发/计算/变化获取/查询一致性分开；qualified 名、UUID、definition、source incarnation、opaque token 类型明确。'
      - 'OBJECT_ATOMIC 和 PINNED_VECTOR 首期保证；跨 catalog 共同事务 cut 作为独立能力。'
      - 'CREATE/REFRESH/SUSPEND/REDEFINE/DROP 并发语义、NOT_READY 和错误枚举确定。'
    acceptance:
      - '同名跨 tenant/namespace 无冲突；重建同名源不会复用旧范围。'
      - 'RefreshMode 旧语义有明确兼容映射，不能把 SNAPSHOT 改读成 FULL。'
    tests: [qualified-name-parser, legacy-mode-compatibility, lifecycle-contract]

  - id: MAT-003
    title: Durable 定义与运行状态模型
    milestone: M1
    owner: control-store
    status: planned
    depends_on: [MAT-002]
    existing_entrypoints:
      - pangrova-metadata/src/main/resources/db/migration/V1__init_schema.sql
      - pangrova-metadata/src/main/java/org/pangrova/metadata/dynamictable/JdbcDynamicTableStateStore.java
    deliverables:
      - '新增迁移，不编辑已发布 V1；定义、deps、head、intent、attempt、generation、receipt、pins、outbox 分表。'
      - '领域 store adapter、tenant scoped unique key、版本 CAS、分页与大 vector artifact。'
      - '最小 durable claim/polling 与发布事务框架，禁止启动失败回落内存。'
    acceptance:
      - '进程重启、事务回滚、duplicate request 幂等；desired/claim/progress 不互相覆盖。'
      - '两个 Coordinator 并发 claim、DDL 和 CAS 不丢状态；tenant 查询隔离。'
    tests: [postgres-testcontainers-transactions, concurrent-cas, migration-forward-compatibility]

  - id: MAT-004
    title: DDL 授权、依赖提取与生产装配
    milestone: M1
    owner: coordinator-bootstrap
    status: planned
    depends_on: [MAT-003]
    existing_entrypoints:
      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/bootstrap/QueryExecutionWiring.java
      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/bootstrap/PlannerWiring.java
      - pangrova-coordinator/src/main/java/org/pangrova/coordinator/dynamictable/DynamicTableViewRegistrar.java
    deliverables:
      - '正常 statement dispatcher 注册 DT/MV 生命周期任务；bootstrap 连接持久 store、recovery barrier、provider 和 poller。'
      - '从 validated RelNode 提取 CTE/subquery/JOIN 的所有 source binding，事务拒绝环。'
      - '固定 output schema、函数/安全语义指纹；desired 与 observed readiness 分离。'
