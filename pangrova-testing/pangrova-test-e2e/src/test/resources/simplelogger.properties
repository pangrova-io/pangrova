org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
# Reduce noise from infrastructure
org.slf4j.simpleLogger.log.org.testcontainers=info
org.slf4j.simpleLogger.log.com.github.dockerjava=warn
org.slf4j.simpleLogger.log.org.apache.hc=warn
org.slf4j.simpleLogger.log.org.apache.calcite=warn
org.slf4j.simpleLogger.log.org.apache.iceberg=info
org.slf4j.simpleLogger.log.org.eclipse.jetty=info
# Arrow Flight / IPC — suppress verbose buffer-level logging
org.slf4j.simpleLogger.log.org.apache.arrow=warn
org.slf4j.simpleLogger.log.io.grpc=warn
org.slf4j.simpleLogger.log.io.netty=warn
