syntax = "proto3";
package pangrova.native.protocol.v1;

option java_package = "org.pangrova.native.protocol.v1";
option java_multiple_files = true;

// ShuffleSerdeFormat: only one format is currently in use.
// Kept because ShuffleConfig.serde_format references this enum — removing it
// would be a proto wire-format breaking change. No callers outside ShuffleConfig.
enum ShuffleSerdeFormat {
  SHUFFLE_SERDE_PRESTO_PAGES = 0;
}

enum ShufflePersistenceMode {
  SHUFFLE_PERSISTENCE_MEMORY_ONLY = 0;
  SHUFFLE_PERSISTENCE_MEMORY_AND_DISK = 1;
  SHUFFLE_PERSISTENCE_MEMORY_AND_REMOTE = 2;
}

message ShuffleConfig {
  ShuffleSerdeFormat serde_format = 1;
  string compression_codec = 2;
  int32 batch_size = 3;
  ShufflePersistenceMode persistence_mode = 4;
  int32 num_partitions = 5;
  repeated int32 partition_key_indices = 6;
  // Maximum number of buffered batches per partition before back-pressure is applied.
  int32 max_buffered_batches_per_partition = 7;
}
