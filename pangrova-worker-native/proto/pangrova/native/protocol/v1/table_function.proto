syntax = "proto3";
package pangrova.native.protocol.v1;

option java_package = "org.pangrova.native.protocol.v1";
option java_multiple_files = true;

import "substrait/algebra.proto";
import "substrait/type.proto";

// Metadata for a table function invocation, packed into ExtensionMultiRel.detail.
// The Java planner encodes TableFunctionRel as an ExtensionMultiRel whose
// detail field is a google.protobuf.Any wrapping this message.
message TableFunctionDetail {
  // Registered table function name (e.g., "generate_series").
  string function_name = 1;

  // Function arguments (constants or field references from the input).
  repeated substrait.Expression arguments = 2;

  // Output schema produced by the table function.
  substrait.NamedStruct output_schema = 3;
}
