syntax = "proto3";
package pangrova.native.protocol.v1;

option java_package = "org.pangrova.native.protocol.v1";
option java_multiple_files = true;

enum DynamicFilterType {
  DYNAMIC_FILTER_TYPE_UNKNOWN = 0;
  DYNAMIC_FILTER_TYPE_IN_LIST = 1;
  DYNAMIC_FILTER_TYPE_RANGE = 2;
}

message DynamicFilterEntry {
  string column_name = 1;
  DynamicFilterType filter_type = 2;

  oneof filter_values {
    BigintInList bigint_in_list = 10;
    StringInList string_in_list = 11;
    BigintRange bigint_range = 12;
    DoubleRange double_range = 13;
  }
}

message BigintInList {
  repeated int64 values = 1;
}

message StringInList {
  repeated string values = 1;
}

message BigintRange {
  int64 lower = 1;
  int64 upper = 2;
}

message DoubleRange {
  double lower = 1;
  double upper = 2;
}

message InjectDynamicFilterPayload {
  string plan_node_id = 1;
  reserved 2;
  repeated DynamicFilterEntry filters = 3;
}
