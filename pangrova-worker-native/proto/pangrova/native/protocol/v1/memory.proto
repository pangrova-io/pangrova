syntax = "proto3";
package pangrova.native.protocol.v1;

option java_package = "org.pangrova.native.protocol.v1";
option java_multiple_files = true;

// Configuration for nativeInit — Velox runtime setup.
message NativeConfig {
  int64 max_memory_bytes = 1;
  int32 io_thread_count = 2;
  bool cache_enabled = 3;
  int64 ram_cache_bytes = 4;
  int64 ssd_cache_bytes = 5;
  string ssd_cache_path = 6;
  string s3_endpoint = 7;
  // SECURITY: Sensitive credential — must only transit over TLS-encrypted channels.
  // Never log or include in error messages.
  string s3_access_key = 8;
  // SECURITY: Sensitive credential — must only transit over TLS-encrypted channels.
  // Never log or include in error messages.
  string s3_secret_key = 9;
  string s3_region = 10;
  string hdfs_host = 11;
  int32 hdfs_port = 12;
  string kerberos_principal = 13;
  // SECURITY: Sensitive credential — keytab file path. Ensure restricted
  // file permissions (0600) and TLS for wire transfer.
  string kerberos_keytab = 14;
  // SECURITY: Sensitive credential — GCS service account key file path.
  // Ensure restricted file permissions (0600).
  string gcs_credentials_path = 15;
  bool s3_path_style_access = 16;
  bool s3_ssl_enabled = 17;
  string s3_security_token = 18;
  int32 ssd_shards = 19;                    // 0 → default 4
  int64 checkpoint_interval_bytes = 20;      // 0 → disabled

  // Memory pressure thresholds (percentage of total memory, 0-100).
  // 0 → defaults (50/70/85/95). Passed from Java worker config.
  double memory_pressure_threshold_low = 21;
  double memory_pressure_threshold_medium = 22;
  double memory_pressure_threshold_high = 23;
  double memory_pressure_threshold_critical = 24;

  // Engine-level spill configuration. Field numbers 25-26 MUST match the Java
  // proto NativeInitConfig exactly.
  //
  // spill_directory is the switch: an empty path means engine-level spill is
  // disabled, mirroring the per-task idiom in PlanExecutionDriver. Without
  // these fields NativeRuntimeConfig::spill_directory could never be populated,
  // so VeloxMemoryGovernor::spillDirectory() was always empty.
  bool spill_enabled = 25;
  string spill_directory = 26;
}

// Memory stats for heartbeat observability.
message MemorySnapshot {
  int64 current_used_bytes = 1;
  int64 peak_used_bytes = 2;
  int64 spill_bytes = 3;
  int64 cache_used_bytes = 4;
  int64 arbitrator_free_bytes = 5;
  int64 arbitrator_capacity_bytes = 6;
  int32 active_pool_count = 7;
}

enum MemoryPressureLevel {
  MEMORY_PRESSURE_NONE = 0;
  MEMORY_PRESSURE_LOW = 1;
  MEMORY_PRESSURE_MEDIUM = 2;
  MEMORY_PRESSURE_HIGH = 3;
  MEMORY_PRESSURE_CRITICAL = 4;
}

message MemoryPressurePayload {
  MemoryPressureLevel level = 1;
}
