syntax = "proto3";
package pangrova.native.protocol.v1;

option java_package = "org.pangrova.native.protocol.v1";
option java_multiple_files = true;

import "pangrova/native/protocol/v1/split.proto";

message CacheStats {
  int64 ram_hits = 1;
  int64 ram_misses = 2;
  int64 ssd_hits = 3;
  int64 ssd_misses = 4;
  int64 promotions = 5;
  int64 demotions = 6;
  int64 evictions = 7;
  int64 ram_used_bytes = 8;
  int64 ssd_used_bytes = 9;
  double prefetch_hit_rate = 10;
}

message PrefetchSplitsRequest {
  repeated SplitInfo splits = 1;
}
