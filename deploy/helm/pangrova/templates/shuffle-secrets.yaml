{{- if and .Values.shuffle.enabled .Values.shuffle.secrets.create }}
{{- /*
Development-only convenience. Production deployments must pre-create these
four Secrets and leave shuffle.secrets.create=false so credentials never enter
Helm values or release history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shuffle.database.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app: pangrova
    component: shuffle
type: Opaque
stringData:
  username: {{ required "shuffle.database.username is required" .Values.shuffle.database.username | quote }}
  password: {{ required "shuffle.database.password is required when creating the Secret" .Values.shuffle.database.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shuffle.security.capabilityExistingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app: pangrova
    component: shuffle
type: Opaque
stringData:
  capability-secret: {{ required "shuffle.security.capabilitySecret is required when creating the Secret" .Values.shuffle.security.capabilitySecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shuffle.security.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app: pangrova
    component: shuffle
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "shuffle.security.certificateChainPem is required when creating the Secret" .Values.shuffle.security.certificateChainPem | quote }}
  tls.key: {{ required "shuffle.security.privateKeyPem is required when creating the Secret" .Values.shuffle.security.privateKeyPem | quote }}
  ca.crt: {{ required "shuffle.security.rootCaPem is required when creating the Secret" .Values.shuffle.security.rootCaPem | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shuffle.objectStorage.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app: pangrova
    component: shuffle
type: Opaque
stringData:
  access-key: {{ required "shuffle.objectStorage.accessKey is required when creating the Secret" .Values.shuffle.objectStorage.accessKey | quote }}
  secret-key: {{ required "shuffle.objectStorage.secretKey is required when creating the Secret" .Values.shuffle.objectStorage.secretKey | quote }}
{{- end }}
