{{- if .Values.multiTenancy.enabled }}
{{- range .Values.multiTenancy.tenants }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace | default (printf "pangrova-%s" .name) }}
  labels:
    app: pangrova
    component: tenant
    tenant: {{ .name }}
    pangrova.io/tenant-isolation: "true"
  annotations:
    pangrova.io/tenant-name: {{ .name | quote }}
{{- end }}
{{- end }}
