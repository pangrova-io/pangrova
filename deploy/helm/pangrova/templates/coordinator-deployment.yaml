{{- $config := fromYaml .Values.config.coordinator -}}
{{- if hasKey $config "Error" -}}
{{- fail "config.coordinator must be valid YAML" -}}
{{- end -}}
{{- $security := get $config "security" | default dict -}}
{{- $auth := get $security "auth" | default dict -}}
{{- $authType := get $auth "type" | default "" | upper -}}
{{- if ne (get $security "enabled" | toString | lower) "true" -}}
{{- fail "config.coordinator security.enabled must be true for Worker control authentication" -}}
{{- end -}}
{{- if eq $authType "NOOP" -}}
{{- if not .Values.developmentMode -}}
{{- fail "NOOP accepts unauthenticated users; set developmentMode=true explicitly for development, or configure OAUTH2/LDAP" -}}
{{- end -}}
{{- else if not (has $authType (list "OAUTH2" "LDAP")) -}}
{{- fail "config.coordinator security.auth.type must be OAUTH2 or LDAP, or explicit developmentMode=true with NOOP" -}}
{{- end -}}
{{- $coordinator := get $config "coordinator" | default dict -}}
{{- if or (hasKey $config "indexing.enabled") (hasKey $config "indexing.base-path") -}}
{{- fail "use nested indexing.enabled and indexing.base-path without dotted overrides" -}}
{{- end -}}
{{- $indexing := get $config "indexing" | default dict -}}
{{- $indexingFlag := get $indexing "enabled" | toString | lower -}}
{{- if and (hasKey $indexing "enabled") (not (has $indexingFlag (list "true" "false"))) -}}
{{- fail "indexing.enabled must be a literal true or false" -}}
{{- end -}}
{{- $indexingEnabled := eq $indexingFlag "true" -}}
{{- $indexBasePath := get $indexing "base-path" | default "" -}}
{{- if $indexingEnabled -}}
{{- if or (not (kindIs "string" $indexBasePath)) (eq $indexBasePath "") -}}
{{- fail "enabled indexing requires a literal indexing.base-path" -}}
{{- end -}}
{{- if contains "${" $indexBasePath -}}
{{- fail "enabled indexing requires a literal indexing.base-path; Helm cannot validate environment substitutions" -}}
{{- end -}}
{{- $localIndexRoot := or (hasPrefix "/" $indexBasePath) (hasPrefix "file:" $indexBasePath) (not (contains "://" $indexBasePath)) -}}
{{- if $localIndexRoot -}}
{{- if not .Values.indexing.persistence.enabled -}}
{{- fail "enabling indexing with a local base path requires indexing.persistence.enabled=true and a shared ReadWriteMany PVC" -}}
{{- end -}}
{{- $localPath := trimSuffix "/" (trimPrefix "file://" $indexBasePath) -}}
{{- if or (ne (clean $localPath) $localPath) (not (or (eq $localPath "/opt/pangrova/indexes") (hasPrefix "/opt/pangrova/indexes/" $localPath))) (contains "%" $localPath) -}}
{{- fail "local indexing.base-path must be /opt/pangrova/indexes or a canonical subdirectory of the shared PVC mount" -}}
{{- end -}}
{{- if and .Values.multiTenancy.enabled (gt (len .Values.multiTenancy.tenants) 0) -}}
{{- fail "local index storage is not shared across tenant namespaces; configure a shared object-store indexing.base-path" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $ha := get $coordinator "ha" | default dict -}}
{{- $multiple := gt (int .Values.coordinator.replicas) 1 -}}
{{- $identityMode := .Values.coordinator.identityMode -}}
{{- if not (has $identityMode (list "configured" "podUid")) -}}
{{- fail "coordinator.identityMode must be configured or podUid" -}}
{{- end -}}
{{- if and $multiple (or (hasKey $config "coordinator.ha.enabled") (hasKey $config "coordinator.ha") (hasKey $coordinator "ha.enabled")) -}}
{{- fail "multiple Coordinator replicas require nested coordinator.ha.enabled without a dotted override" -}}
{{- end -}}
{{- if and $multiple (ne (get $ha "enabled" | toString | lower) "true") -}}
{{- fail "multiple Coordinator replicas require coordinator.ha.enabled=true and a verified shared HA topology" -}}
{{- end -}}
{{- if and $multiple (ne $identityMode "podUid") -}}
{{- fail "multiple Coordinator replicas require coordinator.identityMode=podUid" -}}
{{- end -}}
{{- if and (eq $identityMode "podUid") (or (hasKey $coordinator "id") (hasKey $config "coordinator.id")) -}}
{{- fail "coordinator.identityMode=podUid requires removing coordinator.id from config.coordinator, including the embedded default ID" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangrova-coordinator
  namespace: {{ .Values.namespace }}
  labels:
    app: pangrova
    component: coordinator
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app: pangrova
      component: coordinator
  template:
    metadata:
      labels:
        app: pangrova
        component: coordinator
    spec:
      securityContext:
        fsGroup: {{ .Values.coordinator.fsGroup }}
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/pangrova/bin/pangrova.sh"]
          args: ["start", "coordinator"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if eq $identityMode "podUid" }}
            - name: PANGROVA_COORDINATOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- end }}
            - name: PANGROVA_HOME
              value: /opt/pangrova
            - name: PANGROVA_CONF_DIR
              value: /opt/pangrova/config
            - name: PANGROVA_LOG_DIR
              value: /opt/pangrova/logs
            - name: PANGROVA_JAVA_OPTS
              value: {{ .Values.coordinator.javaOpts | quote }}
            - name: PANGROVA_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalAuth.existingSecret | quote }}
                  key: internal-auth-secret
            - name: PANGROVA_DB_HOST
              value: {{ required "metadata.host must name a reachable PostgreSQL endpoint" .Values.metadata.host | quote }}
            - name: PANGROVA_DB_PORT
              value: {{ .Values.metadata.port | quote }}
            - name: PANGROVA_DB_NAME
              value: {{ required "metadata.database must name an existing PostgreSQL database" .Values.metadata.database | quote }}
            - name: PANGROVA_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "metadata.existingSecret must name a Secret with username/password" .Values.metadata.existingSecret | quote }}
                  key: username
            - name: PANGROVA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "metadata.existingSecret must name a Secret with username/password" .Values.metadata.existingSecret | quote }}
                  key: password
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/pangrova/config/coordinator.yml
              subPath: coordinator.yml
            - name: logs
              mountPath: /opt/pangrova/logs
            {{- if .Values.indexing.persistence.enabled }}
            - name: index-data
              mountPath: /opt/pangrova/indexes
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: pangrova-config
        - name: logs
          emptyDir: {}
        {{- if .Values.indexing.persistence.enabled }}
        - name: index-data
          persistentVolumeClaim:
            claimName: {{ default "pangrova-coordinator-index-data" .Values.indexing.persistence.existingClaim | quote }}
        {{- end }}
{{- if and .Values.indexing.persistence.enabled (not .Values.indexing.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pangrova-coordinator-index-data
  namespace: {{ .Values.namespace }}
  labels:
    app: pangrova
    component: coordinator
spec:
  accessModes: ["ReadWriteMany"]
  {{- if .Values.indexing.persistence.storageClass }}
  storageClassName: {{ .Values.indexing.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.indexing.persistence.size }}
{{- end }}
