# ============================================================
# Pangrova — Distributed Cluster (docker-compose)
# 2 independent, non-HA Coordinators + 3 Workers for development routing.
#
# Usage:
#   cd deploy/docker
#   docker compose -f docker-compose-cluster.yml up -d
#   docker compose -f docker-compose-cluster.yml ps
#   docker compose -f docker-compose-cluster.yml down
#
# Override image version:
#   PANGROVA_VERSION=0.1.0 docker compose -f docker-compose-cluster.yml up -d
# ============================================================

services:
  metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pangrova_meta
      POSTGRES_USER: pangrova
      POSTGRES_PASSWORD: ${PANGROVA_DB_PASSWORD:?Set PANGROVA_DB_PASSWORD in .env}
    volumes:
      - metadata-data:/var/lib/postgresql/data
    networks:
      - pangrova-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pangrova -d pangrova_meta"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- Coordinators ----
  coordinator-1:
    image: pangrova/pangrova:${PANGROVA_VERSION:-latest}
    container_name: pangrova-coordinator-1
    hostname: coordinator-1
    command: ["start", "coordinator"]
    ports:
      - "8080:8080"
    environment:
      - PANGROVA_HOME=/opt/pangrova
      - PANGROVA_CONF_DIR=/opt/pangrova/config
      - PANGROVA_LOG_DIR=/opt/pangrova/logs
      - PANGROVA_JAVA_OPTS=${COORDINATOR_JAVA_OPTS:--Xms128m -Xmx512m}
      - PANGROVA_INTERNAL_AUTH_SECRET=${PANGROVA_INTERNAL_AUTH_SECRET:?Set PANGROVA_INTERNAL_AUTH_SECRET in .env}
      - PANGROVA_DB_USERNAME=pangrova
      - PANGROVA_DB_PASSWORD=${PANGROVA_DB_PASSWORD:?Set PANGROVA_DB_PASSWORD in .env}
      - PANGROVA_INDEX_BASE_PATH=/opt/pangrova/indexes
      - PANGROVA_COORDINATOR_ADMISSION_STATE_DIRECTORY=/opt/pangrova/data/coordinator-1-admission
      # Object Storage credentials (pass via .env file)
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      - PANGROVA_OSS_ENDPOINT=${PANGROVA_OSS_ENDPOINT:-}
      - PANGROVA_OSS_REGION=${PANGROVA_OSS_REGION:-}
    volumes:
      - coordinator-1-logs:/opt/pangrova/logs
      - coordinator-data:/opt/pangrova/data
      - index-data:/opt/pangrova/indexes
      - ./config/coordinator.yml:/opt/pangrova/config/coordinator.yml:ro
    networks:
      - pangrova-net
    depends_on:
      metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  coordinator-2:
    image: pangrova/pangrova:${PANGROVA_VERSION:-latest}
    container_name: pangrova-coordinator-2
    hostname: coordinator-2
    command: ["start", "coordinator"]
    ports:
      - "8082:8080"
    environment:
      - PANGROVA_HOME=/opt/pangrova
      - PANGROVA_CONF_DIR=/opt/pangrova/config
      - PANGROVA_LOG_DIR=/opt/pangrova/logs
      - PANGROVA_JAVA_OPTS=${COORDINATOR_JAVA_OPTS:--Xms128m -Xmx512m}
      - PANGROVA_INTERNAL_AUTH_SECRET=${PANGROVA_INTERNAL_AUTH_SECRET:?Set PANGROVA_INTERNAL_AUTH_SECRET in .env}
      - PANGROVA_DB_USERNAME=pangrova
      - PANGROVA_DB_PASSWORD=${PANGROVA_DB_PASSWORD:?Set PANGROVA_DB_PASSWORD in .env}
      - PANGROVA_INDEX_BASE_PATH=/opt/pangrova/indexes
      - PANGROVA_COORDINATOR_ADMISSION_STATE_DIRECTORY=/opt/pangrova/data/coordinator-2-admission
    volumes:
      - coordinator-2-logs:/opt/pangrova/logs
      - coordinator-data:/opt/pangrova/data
      - index-data:/opt/pangrova/indexes
      - ./config/coordinator.yml:/opt/pangrova/config/coordinator.yml:ro
    networks:
      - pangrova-net
    depends_on:
      metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- Workers ----
  worker-1:
    image: pangrova/pangrova:${PANGROVA_VERSION:-latest}
    container_name: pangrova-worker-1
    hostname: worker-1
    command: ["start", "worker"]
    ports:
      - "8081:8081"
    environment:
      - PANGROVA_HOME=/opt/pangrova
      - PANGROVA_CONF_DIR=/opt/pangrova/config
      - PANGROVA_LOG_DIR=/opt/pangrova/logs
      - PANGROVA_JAVA_OPTS=${WORKER_JAVA_OPTS:--Xms128m -Xmx384m -XX:MaxDirectMemorySize=128m}
      - PANGROVA_COORDINATOR_URL=http://coordinator-1:8080
      - PANGROVA_ADVERTISED_HOST=worker-1
      - PANGROVA_INTERNAL_AUTH_SECRET=${PANGROVA_INTERNAL_AUTH_SECRET:?Set PANGROVA_INTERNAL_AUTH_SECRET in .env}
    volumes:
      - worker-1-logs:/opt/pangrova/logs
      - worker-1-data:/opt/pangrova/data
      - index-data:/opt/pangrova/indexes
      - ./config/worker.yml:/opt/pangrova/config/worker.yml:ro
    networks:
      - pangrova-net
    depends_on:
      coordinator-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-2:
    image: pangrova/pangrova:${PANGROVA_VERSION:-latest}
    container_name: pangrova-worker-2
    hostname: worker-2
    command: ["start", "worker"]
    ports:
      - "8083:8081"
    environment:
      - PANGROVA_HOME=/opt/pangrova
      - PANGROVA_CONF_DIR=/opt/pangrova/config
      - PANGROVA_LOG_DIR=/opt/pangrova/logs
      - PANGROVA_JAVA_OPTS=${WORKER_JAVA_OPTS:--Xms128m -Xmx384m -XX:MaxDirectMemorySize=128m}
      - PANGROVA_COORDINATOR_URL=http://coordinator-1:8080
      - PANGROVA_ADVERTISED_HOST=worker-2
      - PANGROVA_INTERNAL_AUTH_SECRET=${PANGROVA_INTERNAL_AUTH_SECRET:?Set PANGROVA_INTERNAL_AUTH_SECRET in .env}
    volumes:
      - worker-2-logs:/opt/pangrova/logs
      - worker-2-data:/opt/pangrova/data
      - index-data:/opt/pangrova/indexes
      - ./config/worker.yml:/opt/pangrova/config/worker.yml:ro
    networks:
      - pangrova-net
    depends_on:
      coordinator-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-3:
    image: pangrova/pangrova:${PANGROVA_VERSION:-latest}
    container_name: pangrova-worker-3
    hostname: worker-3
    command: ["start", "worker"]
    ports:
      - "8084:8081"
    environment:
      - PANGROVA_HOME=/opt/pangrova
      - PANGROVA_CONF_DIR=/opt/pangrova/config
      - PANGROVA_LOG_DIR=/opt/pangrova/logs
      - PANGROVA_JAVA_OPTS=${WORKER_JAVA_OPTS:--Xms128m -Xmx384m -XX:MaxDirectMemorySize=128m}
      - PANGROVA_COORDINATOR_URL=http://coordinator-2:8080
      - PANGROVA_ADVERTISED_HOST=worker-3
      - PANGROVA_INTERNAL_AUTH_SECRET=${PANGROVA_INTERNAL_AUTH_SECRET:?Set PANGROVA_INTERNAL_AUTH_SECRET in .env}
    volumes:
      - worker-3-logs:/opt/pangrova/logs
      - worker-3-data:/opt/pangrova/data
      - index-data:/opt/pangrova/indexes
      - ./config/worker.yml:/opt/pangrova/config/worker.yml:ro
    networks:
      - pangrova-net
    depends_on:
      coordinator-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  metadata-data:
  coordinator-data:
  coordinator-1-logs:
  coordinator-2-logs:
  worker-1-logs:
  worker-1-data:
  worker-2-logs:
  worker-2-data:
  worker-3-logs:
  worker-3-data:
  index-data:

networks:
  pangrova-net:
    driver: bridge
