# Docker Compose development profile. Production uses etc/worker.yml.
worker:
  id: "${HOSTNAME:-worker-0}"
  host: 0.0.0.0
  port: 8081
  advertised-host: "${PANGROVA_ADVERTISED_HOST}"
  coordinator-url: "${PANGROVA_COORDINATOR_URL}"
  internal-auth-secret: "${PANGROVA_INTERNAL_AUTH_SECRET}"
  transport:
    port: 9090
  memory:
    budget-bytes: 536870912
    node-bytes: 1073741824
  shuffle:
    service:
      spill-directory: /opt/pangrova/data
  native:
    cache:
      enabled: true
      memory-bytes: 536870912
      ssd-path: /opt/pangrova/data/velox-cache
      ssd-bytes: 21474836480
      ssd-shards: 4
      checkpoint-interval-bytes: 1073741824
      artifact-path: /opt/pangrova/data/pangrova-artifacts
      artifact-bytes: 10737418240
      artifact-index-memory-bytes: 536870912
