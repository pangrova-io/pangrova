# Docker Compose development profile. Production uses etc/coordinator.yml.
coordinator:
  id: "${HOSTNAME:-coordinator-0}"
  host: 0.0.0.0
  port: 8080
  role: COMBINED
  admission:
    state-directory: "${PANGROVA_COORDINATOR_ADMISSION_STATE_DIRECTORY:-/opt/pangrova/data/coordinator-admission}"
  internal-auth-secret: "${PANGROVA_INTERNAL_AUTH_SECRET}"
  ha:
    enabled: false
metadata:
  enabled: true
  jdbc-url: "jdbc:postgresql://metadata:5432/pangrova_meta"
  jdbc-username: "${PANGROVA_DB_USERNAME}"
  jdbc-password: "${PANGROVA_DB_PASSWORD}"
security:
  # Explicit development-only bypass still instantiates the internal-service
  # authentication filter required for Worker control.
  enabled: true
  auth:
    type: NOOP

indexing:
  # Keep automatic maintenance disabled until lifecycle qualification. Set a
  # shared durable root before enabling; Workers receive it through catalog config.
  enabled: false
  base-path: "${PANGROVA_INDEX_BASE_PATH:-/opt/pangrova/indexes}"
